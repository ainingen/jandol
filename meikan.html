<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%2313201c%22/%3E%3Crect%20x%3D%228%22%20y%3D%225%22%20width%3D%2216%22%20height%3D%2222%22%20rx%3D%223%22%20fill%3D%22%23f7f1e4%22/%3E%3Ctext%20x%3D%2216%22%20y%3D%2217%22%20text-anchor%3D%22middle%22%20font-size%3D%2212%22%20font-family%3D%22serif%22%20fill%3D%22%23c0392b%22%3E%E9%9B%80%3C/text%3E%3Ctext%20x%3D%2216%22%20y%3D%2225%22%20text-anchor%3D%22middle%22%20font-size%3D%228%22%20font-family%3D%22serif%22%20fill%3D%22%238c2f28%22%3E%E8%90%AC%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雀ドル名鑑</title>
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/maru.css">
<link rel="stylesheet" href="src/theme.css">
<link rel="stylesheet" href="src/meikan.css">
<style>
  /* このページ専用。style.css の #app レイアウトは使わない */
  body{display:block}
  .dbg{max-width:760px;margin:0 auto;padding:0 8px 30px;display:flex;gap:6px;flex-wrap:wrap}
  .dbg button{
    font-size:11px;padding:4px 9px;border-radius:3px;cursor:pointer;
    border:1px dashed var(--gold-dim);background:transparent;color:var(--muted);
  }
  .dbg span{font-size:11px;color:#5c6d66;align-self:center}
  .mkExtra button{
    font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer;margin:8px 6px 0 0;
    border:1px solid var(--gold-dim);background:var(--felt);color:var(--ivory);
  }
</style>
</head>
<body>
<div id="meikan"></div>

<!-- 動作確認用。本編に組み込むときはこの帯ごと外す -->
<div class="dbg">
  <span>動作確認：</span>
  <button id="dbgFind">1人発掘する</button>
  <button id="dbgFind10">10人発掘する</button>
  <button id="dbgAll">全員発見にする</button>
  <button id="dbgReset">最初からにする</button>
</div>

<script src="src/characters.js"></script>
<script src="src/title.js"></script>
<script src="src/meikan.js"></script>
<script>
/* ------------------------------------------------------------
   セーブ（引き継ぎ書 §5 の方針）
   ・すべて id で持つ
   ・localStorage は try/catch。使えない環境では毎回最初から
------------------------------------------------------------ */
const SAVE_KEY = 'jandol_save_v1';

function blankState() {
  /* 初期メンバー候補（id 64〜73）は最初から名鑑に載っている */
  return {
    discovered: FREE_AGENTS.map((c) => c.id),
    contracted: [],
    comp: Object.fromEntries(FREE_AGENTS.map((c) => [c.id, c.comp])),
    favor: {},
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return blankState();
    const s = JSON.parse(raw);
    /* 後からキャラが増えても壊れないよう、足りない項目だけ補う。
       この画面が知らない項目（team など）は必ずそのまま残すこと。
       拾い直した項目だけを返すと、別画面が保存した内容を消してしまう。 */
    const b = blankState();
    return Object.assign({}, s, {
      discovered: Array.isArray(s.discovered) ? s.discovered : b.discovered,
      contracted: Array.isArray(s.contracted) ? s.contracted : [],
      comp: Object.assign({}, b.comp, s.comp || {}),
      favor: s.favor || {},
    });
  } catch (e) { return blankState(); }
}
function saveState(st) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); } catch (e) { /* 保存できない環境 */ }
}

let state = loadState();

const store = {
  get: () => state,
  set: (patch) => { Object.assign(state, patch); saveState(state); },

  /* 詳細画面に契約ボタンを差し込む（スカウト画面ができるまでの仮動作） */
  onDetailOpen(c, extraEl, refresh) {
    if (!extraEl) return;
    const signed = state.contracted.includes(c.id);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = signed ? '契約を解除する（確認用）' : '契約する（確認用）';
    btn.addEventListener('click', () => {
      if (signed) {
        store.set({ contracted: state.contracted.filter((id) => id !== c.id) });
      } else {
        const comp = Object.assign({}, state.comp);
        if (comp[c.id] == null) comp[c.id] = c.comp != null ? c.comp : compGuess(c.rank);
        store.set({ contracted: state.contracted.concat(c.id), comp });
      }
      document.querySelector('.mkOverlay')?.remove();
      refresh();
    });
    extraEl.append(btn);
  },
};

/* ランクから完成度の初期値をつくる（tournament.js の compFromRank 相当） */
function compGuess(rank) {
  return { S: 90, A: 72, B: 50, C: 28, D: 12 }[rank] ?? 12;
}

const app = Meikan.mount(document.getElementById('meikan'), store);

/* ---------- 動作確認ボタン ---------- */
function discoverRandom(n) {
  const pool = JANDOLS.map((c) => c.id).filter((id) => !state.discovered.includes(id));
  for (let i = 0; i < n && pool.length; i++) {
    const k = Math.floor(Math.random() * pool.length);
    state.discovered.push(pool.splice(k, 1)[0]);
  }
  store.set({});
  app.refresh();
}
document.getElementById('dbgFind').addEventListener('click', () => discoverRandom(1));
document.getElementById('dbgFind10').addEventListener('click', () => discoverRandom(10));
document.getElementById('dbgAll').addEventListener('click', () => {
  store.set({ discovered: JANDOLS.concat(FREE_AGENTS).map((c) => c.id) });
  app.refresh();
});
document.getElementById('dbgReset').addEventListener('click', () => {
  state = blankState();
  saveState(state);
  app.refresh();
});
</script>
</body>
</html>
