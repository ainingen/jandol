  .dbg span{font-size:11px;color:#5c6d66;align-self:center}

<body>
<div id="office"></div>

<div class="dbg">
  <span>動作確認：</span>
  <button id="dbgNight">夜（日報）を見る</button>
  <button id="dbgMoney">1000万円足す</button>
  <button id="dbgPref">本拠地を選び直す</button>
  <button id="dbgRoster">8人契約させる</button>
  <button id="dbgReset">セーブを消す</button>
</div>

<script src="src/characters.js"></script>
<script src="src/geo.js"></script>
<script src="src/tournament.js"></script>
<script src="src/scout.js"></script>
<script src="src/offers.js"></script>
<script src="src/office.js"></script>
<script src="src/jansou-guests.js"></script>
<script src="src/jansou-floor.js"></script>
<script src="src/office-room.js"></script>
<script src="src/jansou.js"></script>
<script src="src/scoutshop.js"></script>
<script src="src/serifu.js"></script>
<script>
/* 単体ページ。本編と同じセーブを共有する。
   **`store.go` と `store.startDay` を入れていない。**入れられないのではなく、
   ここには行き先（他の画面）が無いから。office.js は無ければ入口の釦を
   disabled にするので、朝の見た目と夜の日報はこれで確かめられる。
   **店が無い日は、このページでも「今日を始める」で回せる**
   （雀荘へ委譲しないので行き先が要らない）。
   **店がある日を回すのは index.html 側**（雀荘の再生と実対局が要る）。 */
const SAVE_KEY = 'jandol_save_v1';

function blankState() {
  return {
    discovered: FREE_AGENTS.map((c) => c.id),
    contracted: [], comp: Object.fromEntries(FREE_AGENTS.map((c) => [c.id, c.comp])),
    compMax: {}, grades: {}, favor: {}, team: [], teamDecided: false,
    money: 0, playerRank: 'D', playerWins: 0, records: {}, recent: [],
    agency: 1, beaten: [],
    officeName: '', officePref: null,
    assign: {}, fatigue: {}, cond: {}, trip: null,
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return blankState();
    const s = JSON.parse(raw);
    const b = blankState();
    /* この画面が知らない項目も必ずそのまま残す */
    return Object.assign({}, s, {
      discovered: Array.isArray(s.discovered) ? s.discovered : b.discovered,
      contracted: Array.isArray(s.contracted) ? s.contracted : [],
      comp: Object.assign({}, b.comp, s.comp || {}),
      compMax: s.compMax || {},
      grades: s.grades || {},
      favor: s.favor || {},
      team: Array.isArray(s.team) ? s.team : [],
      money: typeof s.money === 'number' ? s.money : 0,
      agency: typeof s.agency === 'number' ? s.agency : 1,
      officeName: typeof s.officeName === 'string' ? s.officeName : '',
      officePref: typeof s.officePref === 'string' ? s.officePref : null,
      assign: s.assign && typeof s.assign === 'object' ? s.assign : {},
      trip: s.trip && typeof s.trip === 'object' ? s.trip : null,
      fatigue: s.fatigue && typeof s.fatigue === 'object' ? s.fatigue : {},
      cond: s.cond && typeof s.cond === 'object' ? s.cond : {},
    });
  } catch (e) { return blankState(); }
}
function saveState(st) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); } catch (e) {}
}

let state = loadState();

const store = {
  get: () => state,
  set: (patch) => { Object.assign(state, patch); saveState(state); },
};

const host = document.getElementById('office');
Office.mount(host, store);

/* ---------- 動作確認 ---------- */
document.getElementById('dbgNight').addEventListener('click', () => {
  Office.mount(host, store, { phase: 'night' });
});
document.getElementById('dbgMoney').addEventListener('click', () => {
  store.set({ money: (state.money || 0) + 10000000 }); location.reload();
});
document.getElementById('dbgPref').addEventListener('click', () => {
  store.set({ officePref: null }); location.reload();
});
document.getElementById('dbgRoster').addEventListener('click', () => {
  store.set({ contracted: JANDOLS.slice(0, 8).map((c) => c.id), money: 10000000 });
  location.reload();
});
document.getElementById('dbgReset').addEventListener('click', () => {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
});
</script>
</body>
</html>
