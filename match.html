<style>
  /* このページ専用。shell.html が対局中にしていることを最小限で再現する */
  html,body{height:100%}
  body{display:flex;flex-direction:column;align-items:center;height:100dvh;overflow:hidden}
  #matchRoot{display:flex;justify-content:center;width:100%}
  body.inMatch #matchRoot{flex:1;min-height:0}
  #matchRoot:empty{display:none}
  body.inMatch .dbg{display:none}
  .dbg{max-width:760px;margin:0 auto;padding:12px 8px 30px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .dbg button{
    font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer;
    border:1px solid var(--gold-dim);background:var(--felt);color:var(--ivory);
  }
  .dbg span,.dbg label{font-size:11px;color:var(--muted)}
  .dbg select{font-size:12px;background:#111;color:var(--ivory);border:1px solid var(--gold-dim);border-radius:3px;padding:3px 6px}

  /* 局の頭からの復帰（docs/design/match/resume-spec.md §6）。
     **`.dbg` の位置に出す。**出ているあいだ `.dbg` は隠す
     ——「破棄する」を押して初めて従来の画面に戻る（§6-4） */
  .dbgResume{max-width:760px;margin:0 auto;padding:12px 8px 30px}
  body.inMatch .dbgResume{display:none}
  .dbgResume h2{margin:0 0 4px;font-size:15px;color:var(--ivory)}
  .dbgResume p{margin:0 0 10px;font-size:12px;line-height:1.6;color:var(--muted)}
  .dbgResume button{
    font-size:12px;padding:6px 14px;border-radius:3px;cursor:pointer;margin-right:6px;
    border:1px solid var(--gold-dim);background:var(--felt);color:var(--ivory);
  }
  .dbgResume button.ghost{border-color:var(--muted);background:transparent;color:var(--muted)}

  /* ============================================================
     診断用：四人卓の3Dを段階的に外す（?flat=1|2|3）
     ------------------------------------------------------------
     **本番には入らない。**このページのインラインにだけ置くこと。
     `src/match.css` に書くと、GitHub Pages が `src/*.css` を10分キャッシュするので、
     実機で古いものを見たまま「効かない」と誤読する。
     `match.html` はURLにクエリが付くので必ず新しく取れる。

     `!important` は `src/match.css` と詳細度で競わせないため。診断用なので汚くてよい。
     `flat=2` は段1と段2、`flat=3` は三段とも積み上がる（`<body>` に flat1..flatN）。
     **絵が崩れてよい。**打てて落ちないかだけを見る。
     ============================================================ */

  /* 段1：牌の厚み（::before）を消す */
  body.flat1.inMatch.four .backs .tile::before,
  body.flat1.inMatch.four .river .tile::before,
  body.flat1.inMatch.four .opp .melds .tile::before{display:none !important}

  /* 段2：牌そのものの3Dをやめる */
  body.flat2.inMatch.four .backs .tile{
    transform:none !important;transform-style:flat !important}
  body.flat2.inMatch.four .river .tile,
  body.flat2.inMatch.four .opp .melds .tile{transform-style:flat !important}

  /* 段3：卓の傾きと遠近をやめる。**translate は残すこと**
     （消すと #felt が画面外へ飛ぶ） */
  body.flat3.inMatch.four #table{perspective:none !important}
  body.flat3.inMatch.four #felt{
    transform:translate(-50%,calc(-50% + var(--felt-y,0px))) !important;
    transform-style:flat !important}
  body.flat3.inMatch.four #center,
  body.flat3.inMatch.four .rslot,
  body.flat3.inMatch.four .river,
  body.flat3.inMatch.four .opp,
  body.flat3.inMatch.four .backs,
  body.flat3.inMatch.four .opp .melds,
  body.flat3.inMatch.four .meld,
  body.flat3.inMatch.four .meldSide{transform-style:flat !important}

  /* 読み直したときのブラックボックス（docs/design/match/crash-spec.md §3.3）。
     **`?bb=1` が無くても出す**——落ちて読み直された URL には旗が残るが、
     手で開き直したときも読めるように。**`#dbgResume` の下**に置く */
  .dbgBB{max-width:760px;margin:0 auto;padding:0 8px 24px}
  body.inMatch .dbgBB{display:none}
  .dbgBB h3{margin:0 0 4px;font-size:12px;color:var(--ivory)}
  .dbgBB pre{
    margin:0 0 8px;font:10px/1.5 ui-monospace,monospace;color:var(--muted);
    white-space:pre-wrap;word-break:break-all;
  }
  .dbgBB button{
    font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer;
    border:1px solid var(--muted);background:transparent;color:var(--muted);
  }

  /* 効いていることの印。**これが無いと「効かなかった」と「効いたけど落ちた」が
     区別できない**（実機では開発者ツールが使えない）。帯（z-index 8）より上に置く */
  #flatBadge{
    position:fixed;right:6px;bottom:4px;z-index:9999;pointer-events:none;
    font:11px/1.4 ui-monospace,monospace;letter-spacing:.04em;
    color:#fff;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.35);
    border-radius:3px;padding:2px 6px;
  }
</style>
</head>
<body>

<div id="matchRoot"></div>

<!-- 動作確認用。対局画面だけを開く。クエリで自動化できる：
       ?auto=1        おまかせ（最初から CPU が打つ）
       ?speed=200     進む速さ（0 = 最速）
       ?length=ikkyoku|tonpuu|hanchan
       ?seed=123      Math.random を固定する（同じ並びを何度も見るため）
       ?dealer=2      起家を固定する（Game の opts.startDealer）
       ?sfx=0.5       効果音の音量（0 で無音）
       ?discard=double 打牌を二度押しにする（既定は一度押し）
       ?start=1       開いた瞬間に始める（撮影用）。**復帰の控えがあるときは
                      始めない**（断りが見えないまま流れてしまうため。§6-5）
       ?flat=1|2|3    **診断用。**四人卓の3Dを段階的に外す（1=牌の厚み／
                      2=牌の3D／3=卓の傾きと遠近まで）。右下に flat=N の印が出る。
                      絵は崩れる。**本番には入らない**（このページのインラインだけ）
       ?nofit=1       **診断用。**卓の寸法を測り直す 500ms の見張りを止める。
                      **寸法は初回の一回だけで固定され、以後は追随しない**
                      （画面の向きを変えても直らない）。右下に nofit の印が出る
       ?bb=1          **診断用。**ブラックボックス（`docs/design/match/crash-spec.md` §3）。
                      対局のあいだ毎秒一行を `localStorage['jandol.bb']` に控え、
                      右下の印にその一行を出す。読み直したとき、閉じていない走行が
                      あれば直近5行を画面に出す（**この表示は旗が無くても出る**）
       ?fourjs=0      **診断用。**`.four` は付けたまま、JS 側の分岐だけを消す（§4）。
                      500ms の見張り（`?nofit=1` を含む）と `onOrientationChange` の
                      登録を落とし、`UI.localDelta` を素通しにする。
                      **寸法は初回の一回だけで固定され、FLIP の向きは狂う。**
                      落ちれば CSS、落ちなければ JS。右下に fourjs=0 の印が出る -->
<!-- 局の頭からの復帰の一言（docs/design/match/resume-spec.md §6）。
     控えがあるときだけ中身が入る。**「通信」とは書かない**（§1）
     ——原因は端末側で回線ではないので、Wi-Fi を疑わせると時間を無駄にさせる -->
<div class="dbgResume" id="dbgResume" hidden></div>

<div class="dbg">
  <span>対局の単体ページ：</span>
  <label>速さ <select id="dbgSpeed">
    <option value="900">ゆっくり</option><option value="520" selected>ふつう</option>
    <option value="200">速い</option><option value="0">最速</option></select></label>
  <label>長さ <select id="dbgLen">
    <option value="ikkyoku">一局</option><option value="tonpuu" selected>東風</option>
    <option value="hanchan">半荘</option></select></label>
  <button id="dbgPlay">自分で打つ</button>
  <button id="dbgAuto">おまかせで流す</button>
</div>

<!-- 診断用：?nofit=1 で「卓の寸法を測り直す 500ms の見張り」を止める。
     **`src/` の読み込みより前に仕込む。**`match.js:437` の
       const watch = setInterval(function(){ fitTable(); clampTableScroll(false); }, 500);
     は `Match.play()` の中で登録されるので、`window.setInterval` を差し替えて
     **間隔 500 の登録だけ握り潰す**のがいちばん浅い介入
     （`Match` は `fitFour` を外に出していないので、直に止められない）。
     登録は一度きりなので、**一本飲んだらすぐ元に戻す**。
     `clearInterval(0)` は何もしないので、後片づけ側も壊れない。

     **`?fourjs=0` はこれを含む**（`crash-spec.md` §4）。飲むのは**この一箇所だけ**
     ——旗を二つ立てたときに二本飲むと、`Match.play` の中の別の
     `setInterval` まで巻き添えになる。
     **本番には入らない。**このページのインラインだけ -->
<script>
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const nofit = q.get('nofit') === '1';
  const fourjs = q.get('fourjs') === '0';
  if (!nofit && !fourjs) return;
  const orig = window.setInterval;
  window.setInterval = function (fn, ms) {
    if (ms === 500) { window.setInterval = orig; return 0; }   // 一本だけ飲んで戻す
    return orig.apply(window, arguments);
  };
})();
</script>

<!-- 診断用：?fourjs=0 で **`.four` のクラスは付けたまま、JS 側の分岐だけを消す**
     （`crash-spec.md` §4）。落ちれば CSS、落ちなければ JS。

     `match.js` は `function onOrientationChange` と**名前付き**で定義していて、
     それを `resize` / `orientationchange` / `visualViewport` の `resize`・`scroll` の
     四つに登録している。**`src/` に触らないなら、名前で弾くのがいちばん浅い。**
     名前で拾うのは脆いが、**印が出ているのに `?bb=1` の `sp` が0でなければ
     効いていない**——そこで気づける（名前が変わったらここも直すこと）。

     ここで弾かないもの：段1（`?bb=1`）の自前の listener。**無名で登録している**ので、
     `name` は空文字になって素通しになる。
     **本番には入らない。**このページのインラインだけ -->
<script>
(function () {
  'use strict';
  if (new URLSearchParams(location.search).get('fourjs') !== '0') return;
  function guard(target) {
    if (!target || !target.addEventListener) return;
    const orig = target.addEventListener;
    target.addEventListener = function (type, fn) {
      if (fn && fn.name === 'onOrientationChange') return;   // 登録しない
      return orig.apply(this, arguments);
    };
  }
  guard(window);
  guard(window.screen && window.screen.orientation);
  guard(window.visualViewport);
})();
</script>
<!-- 診断用：?bb=1 のブラックボックス（`docs/design/match/crash-spec.md` §3.1）。
     **数える包みは `src/` を読む前に仕込む。**`getBoundingClientRect` は対局中に
     毎秒何百回も呼ばれるので、あとから包むと数え落とす。
     **旗が無ければ一切仕込まない**——包みが乗っているだけで測定そのものが誤差になる。
     `Math.random` には触らない（`?seed=` と干渉させない）。
     **本番には入らない。**このページのインラインだけ -->
<script>
(function () {
  'use strict';
  if (new URLSearchParams(location.search).get('bb') !== '1') return;

  /* カウンタは一つにまとめる（§3.1 の指示）。`w` / `wAt` は `src/` のあとの
     script が UI を包んで書き込む */
  const bb = window.__bb = { g: 0, sp: 0, ev: [0, 0, 0, 0], r: 0, w: '', wAt: 0 };

  /* `fitFour()` の代理指標。値は素通しで、数えるだけ */
  const rect = Element.prototype.getBoundingClientRect;
  Element.prototype.getBoundingClientRect = function () {
    bb.g++;
    return rect.apply(this, arguments);
  };

  /* `--side` `--side-w` `--felt-y` は全ツリーが参照する変数なので、
     書くたびにスタイルの再計算になる。**見張りを止めていても、
     イベント駆動で `fitFour` が走ったかどうかがここに出る** */
  const setProp = CSSStyleDeclaration.prototype.setProperty;
  CSSStyleDeclaration.prototype.setProperty = function (k) {
    if (k === '--side' || k === '--side-w' || k === '--felt-y') bb.sp++;
    return setProp.apply(this, arguments);
  };

  /* イベントは自前で数える（`match.js` の listener は包まない）。
     **無名の関数で登録すること**——`?fourjs=0` が
     `name === 'onOrientationChange'` の登録だけ弾くので、名前を付けると巻き添えになる */
  window.addEventListener('resize', function () { bb.ev[0]++; });
  window.addEventListener('orientationchange', function () { bb.ev[1]++; });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { bb.ev[2]++; });
    window.visualViewport.addEventListener('scroll', function () { bb.ev[3]++; });
  }
})();
</script>

<!-- 診断用：?bb=1 のブラックボックス（`docs/design/match/crash-spec.md` §3）。
     **`src/` のあと・下の本体より前**に置く。理由は二つ。

       1. `UI` と `Match` がここで初めて揃う（包む相手が要る）
       2. **`?start=1` は下の本体の中で `start()` を直に呼ぶ**ので、
          `window.startMatch` を外から包んでも間に合わない。
          走行を開け閉めする相手は `Match.play` そのものにしてある
          ——§3.2 の「`Match.play` が返ったとき閉じる」を素直に書いた形で、
          5本ある入口のどれから来ても同じところを通る

     **読み直したときの表示だけは旗が無くても動く**（§3.3）。
     落ちて読み直された URL には旗が残るが、手で開き直したときも読めるように。
     **本番には入らない。**このページのインラインだけ -->
<script>
(function () {
  'use strict';
  const KEY = 'jandol.bb';                 // Resume の鍵とは別（§7）
  const MAX = 60;                          // 直近60行の輪。要るのは落ちる直前の1分だけ

  /* ============================================================
     読み直したときの表示（§3.3）。**旗が無くても出す**
     ============================================================ */
  (function showLast() {
    let run = null;
    try { run = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { run = null; }
    const rows = run && Array.isArray(run.entries) ? run.entries : null;
    if (!rows || !rows.length) return;
    /* 閉じている走行（最後が `w:'end'`）は出さない。落ちていないので読む値が無い */
    if (rows[rows.length - 1].w === 'end') return;

    const box = document.createElement('div');
    box.className = 'dbgBB';
    box.id = 'dbgBB';
    const pre = document.createElement('pre');
    /* **整形はしない**（§3.3）。控えた行をそのまま出す */
    pre.textContent = rows.slice(-5).map((e) => JSON.stringify(e)).join('\n');
    const h = document.createElement('h3');
    h.textContent = '前の走行の記録（直近5行）';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'dbgBBClear';
    btn.textContent = '消す';
    btn.addEventListener('click', function () {
      try { localStorage.removeItem(KEY); } catch (e) { /* 投げても何もしない */ }
      box.remove();
    });
    box.appendChild(h); box.appendChild(pre); box.appendChild(btn);
    const anchor = document.getElementById('dbgResume');
    anchor.parentNode.insertBefore(box, anchor.nextSibling);
  })();

  if (new URLSearchParams(location.search).get('bb') !== '1') return;

  const bb = window.__bb;
  if (!bb) return;                          // 前の script が仕込めていない（旗の取り違え）

  /* ============================================================
     `w`（何の最中か）。**入口で名前と時刻を控えるだけ。戻りは控えない**（§3.1）
     ——落ちるのは同期処理の途中か、その直後の描画なので「最後に入ったもの」で足りる。
     **`UI.update` には乗せない**（局中に何十回も呼ばれる。§3.4）
     ============================================================ */
  ['render', 'flip', 'flyIn', 'showEnd', 'flyScores', 'result', 'event', 'say', 'modal']
    .forEach(function (k) {
      const orig = UI[k];
      if (typeof orig !== 'function') return;
      UI[k] = function () {
        bb.w = k; bb.wAt = performance.now();
        if (k === 'render') bb.r++;
        return orig.apply(this, arguments);   // 戻り値も this もそのまま（Promise は Promise のまま）
      };
    });

  /* ============================================================
     走行の開け閉め（§3.2）
     ============================================================ */
  let run = null, timer = 0, t0 = 0, prev = 0;

  function write() {
    if (!run) return;
    try { localStorage.setItem(KEY, JSON.stringify(run)); } catch (e) { /* 投げても対局を止めない */ }
  }

  /* 一行ぶん。**全部ただの数と短い識別子**（§3.4）。名前や配列を増やさないこと */
  function row(w, lag) {
    const g = UI.game;
    const app = document.getElementById('app');
    const cls = (el, want) => (el ? Array.prototype.filter.call(el.classList, want).join(' ') : '');
    const mem = (window.performance && performance.memory) ? performance.memory.usedJSHeapSize : 0;
    const vv = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const e = {
      t: Math.round((performance.now() - t0) / 1000),
      k: g ? g.kyoku + ':' + g.honba : '',
      d: UI.discardCount ? UI.discardCount() : 0,
      n: document.getElementsByTagName('*').length,
      img: document.getElementsByTagName('img').length,
      tn: UI._nodes ? UI._nodes.size : 0,
      g: bb.g, sp: bb.sp, r: bb.r,
      ev: bb.ev.slice(),
      lag: lag,
      w: w,
      ph: [
        cls(app, (c) => c === 'ending' || c.indexOf('end-') === 0 || c.indexOf('bust-') === 0),
        cls(document.body, (c) => c === 'four' || c === 'rotated' || c.indexOf('flat') === 0),
      ].filter(Boolean).join('|'),
      vv: Math.round(vv || 0),
      mem: Math.round(mem / 1048576),        // MB。Safari には performance.memory が無いので 0
    };
    bb.g = 0; bb.sp = 0; bb.r = 0; bb.ev = [0, 0, 0, 0];
    return e;
  }

  function push(w, lag) {
    if (!run) return;
    const e = row(w, lag);
    run.entries.push(e);
    while (run.entries.length > MAX) run.entries.shift();   // 輪。古いものから落とす
    write();
    return e;
  }

  /* 右下の印（§3.3）。**毎秒中身を一行で更新する**——実機で目に見えるので、
     落ちる瞬間に何が跳ねていたかをその場で読める。
     既存の `flat=N` / `nofit` の印は前に残す（`dataset.base`） */
  function badge(e) {
    const el = document.getElementById('flatBadge');
    if (!el || !e) return;
    /* 局名は `Resume.kyokuName` から取る（**式を書き写さない**）。
       印は一行なので `0本場` の側は落とす */
    let k = e.k;
    if (k && typeof Resume !== 'undefined') {
      const p = k.split(':');
      k = Resume.kyokuName(Number(p[0]), Number(p[1])).split(' ')[0];
    }
    el.textContent = [
      el.dataset.base || 'bb',
      e.t + 's', k, 'd' + e.d, 'n' + e.n, 'g' + e.g, 'lag' + e.lag,
      'w:' + String(e.w).split('+')[0],
    ].filter(Boolean).join(' ');
  }

  function tick() {
    const now = performance.now();
    const lag = Math.max(0, Math.round(now - prev - 1000));   // 予定より遅れた ms
    prev = now;
    const w = bb.w ? bb.w + '+' + Math.round(now - bb.wAt) : '';
    badge(push(w, lag));
  }

  function open() {
    if (run) return;
    t0 = prev = performance.now();
    run = {
      id: Date.now(),
      ua: navigator.userAgent,
      flags: location.search,
      entries: [],
    };
    timer = setInterval(tick, 1000);        // **1000。**`match.js` の 500 とは別（`?nofit=1` に食われない）
    tick();                                  // t=0 の一行。**開いた直後に落ちても空にしない**
  }

  function close() {
    if (!run) return;
    clearInterval(timer); timer = 0;
    push('end', 0);                          // **最後の行が `end`＝閉じた走行**（§3.3 の読み手はここを見る）
    run = null;
  }

  /* `Match.play` を包む。開くのは呼ぶ直前、閉じるのは返った直後（§3.2） */
  const play = Match.play;
  Match.play = function () {
    open();
    let p;
    try { p = play.apply(this, arguments); } catch (e) { close(); throw e; }
    Promise.resolve(p).then(close, close);
    return p;
  };

  /* **落ちたときはこれが来ない**（§3.2）。来ていれば、落ちたのではなく
     バックグラウンドに回っただけ——いままで「落ちた」と数えていたものの中に
     これが混ざっていないかも、ここで分かる */
  window.addEventListener('pagehide', function () { push('pagehide', 0); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') push('hidden', 0);
  });
})();
</script>

<!-- 診断用：?fourjs=0 の `src/` のあとのぶん（`crash-spec.md` §4）。
     **段1（`?bb=1`）の包みより後に置くこと。**`localDelta` は §3.1 の
     包みの対象ではないので順番だけの話だが、包まれた側を差し替えると
     `w` の印がその関数のぶんだけ消える。

     `UI.localDelta` は FLIP の差分を 36度と席の角度で回す算術で、
     **四人卓だけ通る。**素通しにすると左右の家の打牌が変な方向へ飛ぶ。
     **絵は崩れてよい。**打てて落ちないかだけを見る。
     **本番には入らない。**このページのインラインだけ -->
<script>
(function () {
  'use strict';
  if (new URLSearchParams(location.search).get('fourjs') !== '0') return;
  UI.localDelta = function (el, dx, dy) { return [dx, dy]; };
})();
</script>
<script>
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) && q.get(k) !== '' ? Number(q.get(k)) : d);

  /* 診断用：?flat=1|2|3 で四人卓の3Dを段階的に外す（上の <style> を見ること）。
     **本番には入らない。**クエリが無ければ何もしない——印も出ない */
  const flat = Math.max(0, Math.min(3, Math.floor(num('flat', 0)) || 0));
  for (let i = 1; i <= flat; i++) document.body.classList.add('flat' + i);
  /* ?nofit=1 / ?fourjs=0 / ?bb=1 は上の（`src/` より前の）script が仕込んでいる。ここは印だけ。
     **`bb` は毎秒この印を書き換える**（`crash-spec.md` §3.3）ので、
     旗の並び（`flat=N` / `nofit` / `bb`）は `dataset.base` に控えておく
     ——書き換える側がそれを頭に残す */
  const nofit = q.get('nofit') === '1';
  const fourjs = q.get('fourjs') === '0';
  const bb = q.get('bb') === '1';
  if (flat || nofit || fourjs || bb) {
    const badge = document.createElement('div');
    badge.id = 'flatBadge';
    badge.dataset.base = [flat ? 'flat=' + flat : '', nofit ? 'nofit' : '',
      fourjs ? 'fourjs=0' : '', bb ? 'bb' : '']
      .filter(Boolean).join(' ');
    badge.textContent = badge.dataset.base;
    document.body.appendChild(badge);
  }

  /* 種を固定できる。線形合同法（jansou.js と同じ式） */
  if (q.has('seed')) {
    let s = (Number(q.get('seed')) >>> 0) || 1;
    Math.random = function () {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* 卓の四人。自分（id 0）と、雀ドルから3人。種があれば同じ顔ぶれになる */
  function pickSeats() {
    const me = Object.assign({}, PLAYER, { face: 'p01' });
    const pool = JANDOLS.slice();
    const seats = [];
    while (seats.length < 3) {
      const i = Math.floor(Math.random() * pool.length);
      seats.push(pool.splice(i, 1)[0]);
    }
    /* 自分の席もばらす（大会の卓割りと同じく、どこに座るか分からない） */
    const at = Math.floor(Math.random() * 4);
    seats.splice(at, 0, me);
    return seats;
  }

  async function start(auto, speed, length) {
    Sound.init(); Sound.volume(num('sfx', 1)); Sound.load();
    document.body.classList.add('inMatch');
    const opts = { title: '単体の対局', speed, length, showHints: true, discardMode: q.get('discard') || 'single' };
    if (q.has('dealer')) opts.startDealer = Number(q.get('dealer'));
    const seats = pickSeats();
    const p = Match.play(document.getElementById('matchRoot'), seats, opts);
    if (auto) {
      /* おまかせ。最初の入力待ちを解いてから CPU に任せる */
      const tick = setInterval(() => {
        if (UI.game) { UI.giveUp(speed); clearInterval(tick); }
      }, 50);
    }
    const rank = await p;
    /* **控えを消すのはここ**（`taikai/resume-spec.md` §3）。
       `Match.play` は `done` を書くだけで消さなくなった——
       消す役目を呼び出し元へ移したので、`await` が返ったここで消す */
    if (typeof Resume !== 'undefined') Resume.clear();
    document.body.classList.remove('inMatch');
    window.lastRank = rank;
    console.log('rank', rank.map((r) => `${r.place} ${r.chara.name}`).join(' / '));
  }

  document.getElementById('dbgPlay').addEventListener('click', () => {
    start(false, Number(dbgSpeed.value), dbgLen.value);
  });
  document.getElementById('dbgAuto').addEventListener('click', () => {
    start(true, Number(dbgSpeed.value), dbgLen.value);
  });

  /* ============================================================
     局の頭からの復帰（docs/design/match/resume-spec.md §6）

     落ちた理由は分かっていない（§0）。**分からないまま、続きを打てるようにする。**
     その局の手は消えて配牌から引き直しになるので、**黙ってやらないこと**
     ——断りがあれば「そういう仕様」として飲み込めるが、
     何も言わずに手牌が変わると「バグった」と受け取られる（§1）。

     **「通信」とは書かない**（§1）。原因は端末の側で回線ではないので、
     通信のせいだと思った人は Wi-Fi を疑って無駄に時間を使う。
     ============================================================ */
  const box = document.getElementById('dbgResume');
  const dbg = document.querySelector('.dbg');

  /* 控えを読む。**捨てる条件は `Resume.load()` の中**（§5）
     ——版・24時間・数の合わない配列・maxKyoku 超え・引けないキャラ。
     当たったものは黙って消えて null で返る。**古い控えを
     「再開しますか」と聞かれても意味が分からない**ので、ここでは何も出さない */
  let saved = (typeof Resume !== 'undefined') ? Resume.load() : null;

  /* **`done` の付いた控えは黙って消す**（`taikai/resume-spec.md` §3）。
     打ち切ったあと、結果を見ている最中に落ちたときのもの。
     **結果画面を再現する価値は無い**ので、一言も出さずに従来の画面へ。
     （本編の大会は同じ `done` を「打たずに結果として使う」——段2以降） */
  if (saved && saved.done) { Resume.clear(); saved = null; }

  /* 保存の席から打ち直す。**`PLAYER` / `JANDOLS` を引き直す**（§6-3）
     ——控えているのは id だけで、キャラそのものではない。
     `Resume.load()` が §5 の確認で既に引いているので、それをそのまま使う。
     自分（id 0）だけは `pickSeats` と同じ形（顔を足す）にそろえる */
  function seatsOf(rec) {
    return rec.charas.map((c) => (c.id === 0 ? Object.assign({}, c, { face: 'p01' }) : c));
  }

  async function resume(rec) {
    box.hidden = true;
    Sound.init(); Sound.volume(num('sfx', 1)); Sound.load();
    document.body.classList.add('inMatch');
    /* 控えた `opts`（長さ・速さ・ヒント・打牌の押し方・見出し）に
       **局の頭の値を足して渡す**（§6-3）。`Match.play` がそのまま `Game` へ流す（§7）。
       控えは消さない——**ここでもう一度落ちたら、また同じ局から始めたい。**
       消すのは半荘を打ち切ったとき（`Match.play` の中。§4） */
    const opts = Object.assign({}, rec.opts, {
      startDealer: rec.startDealer,
      kyoku: rec.kyoku,
      honba: rec.honba,
      riichiSticks: rec.riichiSticks,
      scores: rec.scores,
    });
    const rank = await Match.play(document.getElementById('matchRoot'), seatsOf(rec), opts);
    if (typeof Resume !== 'undefined') Resume.clear();     // 上と同じ（§3）
    document.body.classList.remove('inMatch');
    window.lastRank = rank;
    console.log('rank', rank.map((r) => `${r.place} ${r.chara.name}`).join(' / '));
  }

  if (saved) {
    /* 局名は控えた `kyoku` / `honba` から組む（§6-2）。
       表示は `((kyoku-1)%4)+1`、`kyoku > 4` なら南——`game.js` の帯と同じ式で、
       `Resume.kyokuName` が一箇所で持っている */
    box.innerHTML = '<h2>この局をやり直します</h2>'
      + '<p>一時的に画面が止まったため、' + Resume.kyokuName(saved.kyoku, saved.honba)
      + ' の最初から再開します</p>'
      + '<button type="button" id="dbgResumeGo">再開する</button>'
      + '<button type="button" class="ghost" id="dbgResumeDrop">破棄する</button>';
    box.hidden = false;
    /* 出ているあいだは従来の釦を隠す。**「破棄する」で従来の画面に戻る**（§6-4） */
    dbg.hidden = true;
    document.getElementById('dbgResumeGo').addEventListener('click', () => { resume(saved); });
    document.getElementById('dbgResumeDrop').addEventListener('click', () => {
      Resume.clear();
      box.hidden = true;
      dbg.hidden = false;
    });
  }

  window.startMatch = start;
  window.resumeMatch = resume;
  /* **控えがあるときは `?start=1` でも始めない**（§6-5）。
     落ちて読み直されたとき `start=1` は URL に残っているので、
     放っておくと**断りが見えないまま次の対局が始まる**——
     そのうえ控えは新しい対局に上書きされて、戻る先が消える */
  if (q.get('start') === '1' && !saved) {
    start(q.get('auto') === '1', num('speed', 520), q.get('length') || 'tonpuu');
  }
})();
</script>
</body>
</html>
