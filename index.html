/* ===== match.js ===== */
/* ============================================================
   実対局 — match.js
   依存：engine.js / ai.js / game.js / ui.js / style.css
        characters.js / tournament.js（打ち筋の係数）

   ui.js は『忍雀』の画面をそのまま使っているので、卓のDOMを
   自分で組んでから UI に渡す。ここが対局の入口と後始末を持つ。

   使い方：
     const rank = await Match.play(root, seats, opts);

     seats … 4人の配列。席順そのまま。プレイヤーは { id:0 } を含む。
             それぞれ characters.js の雀ドル（style と comp を持つ）
     rank  … [{ chara, place }, ...] を place 順で返す

   大会から呼ぶときは taikai.js の playRealMatch がこれを包む。
   ============================================================ */

const Match = (() => {
  'use strict';

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  /* ui.js が触るidを全部そろえた卓。style.css の指定に合わせてある */
  const TABLE_HTML = `
    <div id="app">
      <div id="table">
        <div id="top" class="opp"></div>
        <div id="left" class="opp vert"></div>
        <div id="right" class="opp vert"></div>
        <div id="center">
          <div id="river-top" class="river"></div>
          <div id="river-left" class="river side"></div>
          <div id="info"></div>
          <div id="river-right" class="river side"></div>
          <div id="river-bottom" class="river"></div>
        </div>
      </div>
      <div id="myarea">
        <div id="melds-row"></div>
        <div id="handrow"></div>
        <div id="hintbox"></div>
        <div id="actions"></div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="overlay"><div class="panel"></div></div>
    <div id="rotateHint">
      <div class="rotateBox">
        <div class="rotateIcon"></div>
        <div class="rotateText">横にしてください</div>
        <p class="rotateSub">牌が大きくなり、卓が見やすくなります。<br>
          縦のままでも打てます。</p>
        <button type="button" class="rotateGo">このまま縦で打つ</button>
      </div>
    </div>`;

  /* ------------------------------------------------------------
     画面の向き

     Webでは向きを固定できない。screen.orientation.lock() は
     フルスクリーン中のAndroid Chromeでしか効かず、iOS Safari は非対応。
     PLiCyはiframeで動くのでフルスクリーン権限も取れない。
     そこで「試すだけ試して、駄目なら横にしてもらう」形にしてある。
     縦でも打てるので、閉じる道は必ず残すこと。
  ------------------------------------------------------------ */
  let dismissed = false;

  function isPortrait() {
    return window.matchMedia('(orientation:portrait)').matches;
  }

  /* 列レイアウトにしてから縦でも問題なく読めるようになったので、
     横持ちの誘導は出さない。仕組みは残してあるので、
     出したくなったら needRotate を付ける条件を戻すだけでよい */
  function updateRotate() {
    document.body.classList.remove('needRotate');
    fitTable();
    clampTableScroll();
  }

  /* 向きが変わると卓の中身の高さが変わる。
     横持ちでスクロールした位置がそのまま残ると、縦にしたときに
     一番上の家が隠れたまま戻せなくなる（縦は余白が余っていて戻せない）。
     行きすぎを詰めるだけでは足りないことがあるので、
     向きが変わったときは必ず先頭に戻す。 */
  /* 端末の寸法は千差万別で、余白を詰めても収まらないことがある。
     はみ出していたら河を少しずつ縮めて、卓の中に収める。
     前の値から増減させると縮んだまま戻らなくなるので、毎回1から測り直す。 */
  function fitTable() {
    const t = document.getElementById('table');
    const last = document.getElementById('river-bottom');
    if (!t || !last) return;
    const body = document.body;

    /* scrollHeight は四隅の飾りなども拾ってしまうので、
       一番下の行（自分の捨て牌）が卓の底より下に出ているかで判定する */
    const overflow = () =>
      last.getBoundingClientRect().bottom - t.getBoundingClientRect().bottom;

    body.style.setProperty('--rw-fit', '1');
    if (overflow() <= 1) { body.style.removeProperty('--rw-fit'); return; }
    for (let f = 0.94; f >= 0.48; f -= 0.06) {
      body.style.setProperty('--rw-fit', f.toFixed(2));
      if (overflow() <= 1) return;
    }
    /* ここまで縮めても収まらない端末では、卓のスクロールで見てもらう */
  }

  function clampTableScroll(toTop) {
    const t = document.getElementById('table');
    if (!t) return;
    if (toTop) { t.scrollTop = 0; return; }
    const max = Math.max(0, t.scrollHeight - t.clientHeight);
    if (t.scrollTop > max) t.scrollTop = max;
  }

  function onOrientationChange() {
    updateRotate();
    /* 回り終わって寸法が確定してからもう一度戻す。
       端末によっては change の時点でまだ古い寸法が返る */
    clampTableScroll(true);
    setTimeout(function () { fitTable(); clampTableScroll(true); }, 120);
    setTimeout(function () { fitTable(); clampTableScroll(true); }, 400);
  }

  async function tryLockLandscape() {
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
        return true;
      }
    } catch (e) { /* 効かない環境のほうが多い。黙って諦める */ }
    return false;
  }

  function releaseLock() {
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    } catch (e) { /* 何もしない */ }
  }

  /* ------------------------------------------------------------
     一半荘（東風戦）を実際に打つ
  ------------------------------------------------------------ */
  async function play(root, seats, opts) {
    opts = opts || {};

    /* ui.js と game.js は「人間＝seat 0」を前提にしている。
       大会の卓割りはプレイヤーが何番目に来るか分からないので、
       ここで席順を回してプレイヤーを先頭に持ってくる。
       返す着順もこの並びで作るため、呼び出し側は気にしなくてよい */
    const at = seats.findIndex((c) => c && c.id === 0);
    if (at > 0) seats = seats.slice(at).concat(seats.slice(0, at));

    /* ui.js は document 直下のidを見るので、卓は body 直下に置く。
       #overlay や #toast が position:fixed なのも同じ理由 */
    const host = document.createElement('div');
    host.className = 'matchHost';
    host.innerHTML = TABLE_HTML;
    (root || document.body).append(host);

    const g = new Game(UI, {
      length: opts.length || 'tonpuu',
      foes: seats.slice(1).map((c) => c.name),
    });

    /* 打ち筋の係数を配る。人間（id 0）には入れない。
       入れなければ従来どおりの打ち方になる */
    seats.forEach((c, i) => {
      if (!c) return;
      /* 顔。プレイヤーは p01〜p12、雀ドルは3桁の番号 */
      g.players[i].face = c.id === 0
        ? `img/${c.face || 'p01'}.webp`
        : `img/${String(c.id).padStart(3, '0')}.webp`;
      if (c.id === 0) return;
      g.players[i].name = c.name;
      if (typeof paramsOf === 'function' && c.style) {
        g.players[i].ai = paramsOf(c, STYLES);
      }
    });

    /* 向きの誘導。閉じたら二度と出さない（局ごとに出ると邪魔） */
    dismissed = false;
    host.querySelector('.rotateGo').addEventListener('click', () => {
      dismissed = true;
      updateRotate();
    });
    await tryLockLandscape();
    updateRotate();
    window.addEventListener('resize', onOrientationChange);
    if (screen.orientation) screen.orientation.addEventListener('change', onOrientationChange);

    /* 局が変わると河が空になり、卓の中身が縮む。
       そのときも取り残されたスクロールを詰める */
    const watch = setInterval(function () { fitTable(); clampTableScroll(false); }, 500);

    UI.game = g;
    UI._lastRank = null;
    UI.speed = opts.speed === undefined ? 520 : opts.speed;
    UI.showHints = opts.showHints !== false;

    await g.run();
    const rank = UI._lastRank || g.rankings();

    /* 結果を見せてから片付ける */
    await showResult(rank, seats, opts);

    clearInterval(watch);
    document.body.style.removeProperty('--rw-fit');
    window.removeEventListener('resize', onOrientationChange);
    if (screen.orientation) screen.orientation.removeEventListener('change', onOrientationChange);
    document.body.classList.remove('needRotate');
    releaseLock();
    host.remove();
    UI.game = null;

    return rank.map((r, i) => ({ chara: seats[r.seat], place: i + 1 }));
  }

  async function showResult(rank, seats, opts) {
    const rows = rank.map((r, i) => {
      const c = seats[r.seat] || {};
      const mine = r.seat === 0;
      return `<div class="rank-row"${mine ? ' style="color:var(--gold)"' : ''}>
        <span class="r">${i + 1}位</span>
        <span>${esc(c.name || r.name)}</span>
        <span>${r.score}</span>
      </div>`;
    }).join('');
    await UI.modal(
      `<h2>${esc(opts.title || '対局終了')}</h2>${rows}`,
      [{ v: 'x', label: '結果へ', primary: true }]
    );
  }

  return { play, TABLE_HTML };
})();

/* ===== tournament.js ===== */
/* ============================================================
   雀ドルを探せ — 育成と大会
   ・完成度(comp) 0〜100 が実際のCPUの打ち筋を決める
   ・大会は毎回64人。プレイヤーチーム4人＋抽選60人
   ============================================================ */

/* ---------- 完成度と段位 ---------- */
const GRADE_TABLE = [
  { rank: 'D', min: 0 }, { rank: 'C', min: 20 }, { rank: 'B', min: 40 },
  { rank: 'A', min: 65 }, { rank: 'S', min: 85 },
];
function gradeOf(comp) {
  let r = 'D';
  for (const g of GRADE_TABLE) if (comp >= g.min) r = g.rank;
  return r;
}

/* 成長タイプごとの伸び方。同じ経験値でも曲線が違う */
const GROWTH_CURVE = {
  '早熟型':            (c) => c < 45 ? 1.6 : c < 70 ? 0.7 : 0.35,
  '晩成型':            (c) => c < 35 ? 0.5 : c < 65 ? 1.0 : 1.5,
  '安定成長型':        () => 1.0,
  '爆発成長型':        (c) => (Math.random() < 0.25 ? 3.0 : 0.6),
  '守備特化成長':      () => 1.0,
  '攻撃特化成長':      () => 1.0,
  '対局経験で伸びる型': () => 1.0,   // 対局数ボーナスは addExp 側で加算
  '大舞台で伸びる型':  () => 1.0,   // 大会補正は addExp 側で加算
  '人気先行型':        (c) => c < 50 ? 1.1 : 0.6,
  '伸び悩み型':        (c) => c < 40 ? 1.2 : 0.4,
  '完成型':            () => 0.15,
};

/* 対局後の成長。stage は 'practice' | 'league' | 'title' | 'final' */
function addExp(chara, place, stage) {
  if (chara.comp === undefined) chara.comp = compFromRank(chara.rank);
  const base = { 1: 3.2, 2: 2.0, 3: 1.2, 4: 0.8 }[place] || 1;
  const stageMul = { practice: 0.6, league: 1.0, title: 1.4, final: 2.0 }[stage] || 1;
  const curve = (GROWTH_CURVE[chara.growth] || (() => 1))(chara.comp);
  let gain = base * stageMul * curve * 0.55;
  if (chara.growth === '対局経験で伸びる型') gain *= 1.25;
  if (chara.growth === '大舞台で伸びる型' && (stage === 'title' || stage === 'final')) gain *= 1.8;
  // 伸びしろは「今からどれだけ伸びるか」。初期値に加算した位置が天井
  if (chara.compMax === undefined) {
    chara.compMax = Math.min(100, chara.comp + (chara.pot === undefined ? 40 : chara.pot));
  }
  const ceiling = chara.compMax;
  if (chara.comp >= ceiling - 8) gain *= 0.3;
  const before = gradeOf(chara.comp);
  chara.comp = Math.min(ceiling, chara.comp + gain);   // 伸びしろが天井
  const after = gradeOf(chara.comp);
  chara.rank = after;
  return { gain, promoted: before !== after ? after : null };
}

function compFromRank(rank) {
  return { D: 12, C: 28, B: 52, A: 74, S: 90 }[rank] || 12;
}

/* ---------- 完成度からCPUの係数を作る ---------- */
/* 未熟なうちは「押しすぎる・守りが甘い・終盤が雑・ムラが大きい」 */
function rawParams(ideal) {
  return {
    push: Math.min(1, ideal.push * 0.55 + 0.42),
    call: ideal.call * 0.5 + 0.32,
    riichi: ideal.riichi * 0.5 + 0.28,
    defense: ideal.defense * 0.32,
    speed: ideal.speed * 0.72,
    value: ideal.value * 0.7 + 0.08,
    variance: Math.min(0.85, ideal.variance + 0.38),
    endgame: ideal.endgame * 0.22,
  };
}

function paramsOf(chara, STYLES) {
  const ideal = STYLES[chara.style];
  if (!ideal) return null;
  const raw = rawParams(ideal);
  const t = Math.max(0, Math.min(1, (chara.comp === undefined ? compFromRank(chara.rank) : chara.comp) / 100));
  const out = {};
  for (const k of ['push', 'call', 'riichi', 'defense', 'speed', 'value', 'variance', 'endgame']) {
    out[k] = raw[k] + (ideal[k] - raw[k]) * t;
  }
  /* 判断の正確さ。係数の傾きだけでは打牌の順位がほとんど変わらず、
     完成度を上げても強くならなかったので、完成度そのものを渡す。
     ai.js はこれを使って、未熟なほど最善でない牌を選ぶ */
  out.skill = t;
  return out;
}

/* 実力の目安。組み合わせ抽選と自動卓の結果に使う */
function strengthOf(chara, STYLES) {
  const p = paramsOf(chara, STYLES);
  if (!p) return 50;
  const comp = chara.comp === undefined ? compFromRank(chara.rank) : chara.comp;
  const judge = p.defense * 30 + p.endgame * 25 + (1 - p.variance) * 15;
  return comp * 0.42 + judge * 0.45;
}

/* ---------- 大会の格 ---------- */
const TOURNAMENTS = {
  rookie: { name: '新人戦', size: 16, stage: 'practice', prize: 200000,
    band: ['D', 'C'], strict: true, note: 'C級以下だけの十六人' },
  local: { name: '地方リーグ', size: 16, stage: 'league', prize: 500000,
    band: ['D', 'C', 'B'], strict: true, byRegion: true, note: '地元の十六人' },
  open: { name: '全国オープン', size: 64, stage: 'league', prize: 1200000,
    band: ['C', 'B', 'A'], strict: false, note: '誰でも出られる六十四人' },
  title: { name: 'タイトル戦', size: 64, stage: 'title', prize: 3000000,
    band: ['B', 'A', 'S'], strict: false, note: '上位陣が本気で来る六十四人' },
  eight: { name: '雀エイト選抜戦', size: 64, stage: 'final', prize: 8000000,
    band: ['A', 'S'], strict: false, note: '八人の座を賭ける六十四人' },
};

/* ---------- 64人の枠を組む ---------- */
/* team は プレイヤー＋仲間3人 の配列。pool は残りの雀ドル全部 */
function buildField(tierId, team, pool, opts = {}) {
  const tier = TOURNAMENTS[tierId];
  const teamIds = new Set(team.map((c) => c.id));
  const candidates = pool.filter((c) => !teamIds.has(c.id));

  // 大会の格に合う相手を厚く、外れた相手も少しは混ぜる
  const rankOf = (c) => gradeOf(c.comp === undefined ? compFromRank(c.rank) : c.comp);
  let usable = candidates;
  if (tier.strict) {
    const inBand = candidates.filter((c) => tier.band.includes(rankOf(c)));
    const regional = (tier.byRegion && opts.region)
      ? inBand.filter((c) => c.region === opts.region) : inBand;
    // 出場資格を満たす者が足りるならその中だけで組む
    const needed = (tier.size || 64) - team.length;
    usable = regional.length >= needed ? regional
      : (inBand.length >= needed ? inBand : candidates);
  }
  const weighted = usable.map((c) => {
    let w = tier.band.includes(rankOf(c)) ? 12 : 1;
    if (!tier.strict) w *= 0.4 + strengthOf(c, opts.STYLES || {}) / 60;  // 格が上の大会ほど強者が集まる
    if (opts.region && c.region === opts.region) w *= 2.2;
    if (opts.recent && opts.recent.includes(c.id)) w *= 0.35;
    return { c, w: Math.max(0.05, w) };
  });

  const need = (tier.size || 64) - team.length;
  const picked = [];
  const bag = weighted.slice();
  while (picked.length < need && bag.length) {
    const total = bag.reduce((a, x) => a + x.w, 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < bag.length; i++) { r -= bag[i].w; if (r <= 0) { idx = i; break; } }
    picked.push(bag.splice(idx, 1)[0].c);
  }
  // それでも足りなければプールを使い回す（人数が増えれば自然に解消する）
  let i = 0;
  while (picked.length < need && candidates.length) {
    const c = candidates[i % candidates.length];
    picked.push(Object.assign({}, c, { id: c.id, dup: true }));
    i++;
  }
  return team.concat(picked);
}

/* ---------- 卓割りと勝ち上がり ---------- */
/* 64人 → 16卓 → 各卓のトップだけ通過 → 4卓 → 決勝卓 */
function makeTables(field) {
  const shuffled = field.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const tables = [];
  for (let i = 0; i < shuffled.length; i += 4) tables.push(shuffled.slice(i, i + 4));
  return tables;
}

/* プレイヤーが座っていない卓は数字で処理する */
function simulateTable(table, STYLES) {
  const scored = table.map((c) => {
    const s = c.id === 0 ? (c.playerStrength || 55) : strengthOf(c, STYLES);
    // 麻雀の分散。実力差はあっても番狂わせは普通に起きる
    const noise = -Math.log(-Math.log(Math.random())) * 52;
    return { c, score: s + noise };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.map((x, i) => ({ chara: x.c, place: i + 1 }));
}

function roundName(remaining) {
  return { 64: '一回戦', 16: '準決勝', 4: '決勝卓' }[remaining] || `${remaining}人`;
}

/* ===== title.js ===== */
/* ============================================================
   トップページとプレイヤー設定 — title.js
   依存：characters.js / theme.css / meikan.css / title.css

   使い方：
     Title.mount(root, store)
     store は { get, set, onStart(), onContinue() } を持つ。

   プレイヤーも女性の雀士。開始時に名前と顔を決める。
   顔は img/p1.webp 〜 p4.webp を読む。無ければシルエットに落ちるので、
   画像が届く前でも最後まで通る。

   state に足すもの：
     playerName  プレイヤーの名前
     playerFace  'p01'〜'p12'（画像のファイル名。idではないので雀ドルの番号と衝突しない）
   ============================================================ */

const Title = (() => {
  'use strict';

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const pad3 = (id) => String(id).padStart(3, '0');
  const yen = (n) => n.toLocaleString('ja-JP') + '円';

  /* 顔の候補。増やすときはここに足して img/<key>.webp を置くだけ */
  const FACES = [
    { key: 'p01', note: '黒髪のボブ・黒いニット' },
    { key: 'p02', note: '黒髪のロング・トレンチコート' },
    { key: 'p03', note: '茶髪のショート・グレーの上着' },
    { key: 'p04', note: '黒髪のポニーテール・白いシャツ' },
    { key: 'p05', note: '黒髪のボブ・黒いリブ' },
    { key: 'p06', note: '黒髪のボブ・振り返り' },
    { key: 'p07', note: '黒髪のロング・正面' },
    { key: 'p08', note: '黒髪のロング・やわらかい表情' },
    { key: 'p09', note: '茶髪のショート・微笑み' },
    { key: 'p10', note: '茶髪のまとめ髪・微笑み' },
    { key: 'p11', note: 'ポニーテール・腕時計' },
    { key: 'p12', note: 'ポニーテール・腕組み' },
  ];
  const DEFAULT_FACE = 'p01';

  const DEFAULT_NAME = '沢渡 ちはる';

  /* 表紙の題字。PLiCyのサムネイルはcanvasの中身だけを撮るので、
     表紙の絵はDOMではなくcanvasに描く（公式FAQ：
     「スクリーンショットにはCanvas以外の内容は撮影されません」）。
     canvasは常にDOMに置いたままにして、いつ撮影されても絵が出るようにする。 */
  const TITLE = '雀ドル発掘放浪記';
  const SUBTITLE = 'その雀荘に、まだ見ぬ雀ドルがいる';

  /* 4:3。サムネイルの縦横比がそのままこの比率になる */
  const COVER_W = 1200, COVER_H = 900;
  const COVER_COLS = 6, COVER_ROWS = 3;

  function loadImage(src) {
    return new Promise((resolve) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = src;
    });
  }

  async function drawCover(canvas, ids) {
    const g = canvas.getContext('2d');
    canvas.width = COVER_W; canvas.height = COVER_H;

    /* 下地。画像が一枚も読めなくても成立するように先に塗る */
    g.fillStyle = '#0d1f1a';
    g.fillRect(0, 0, COVER_W, COVER_H);

    const cw = COVER_W / COVER_COLS, ch = COVER_H / COVER_ROWS;
    const imgs = await Promise.all(ids.slice(0, COVER_COLS * COVER_ROWS).map(loadImage));

    imgs.forEach((im, n) => {
      const x = (n % COVER_COLS) * cw, y = Math.floor(n / COVER_COLS) * ch;
      if (!im) { g.fillStyle = '#164236'; g.fillRect(x, y, cw, ch); return; }
      /* cover 相当。顔が上寄りなので少し上を残して切る */
      const s = Math.max(cw / im.width, ch / im.height);
      const dw = im.width * s, dh = im.height * s;
      g.drawImage(im, x + (cw - dw) / 2, y + (ch - dh) * 0.12, dw, dh);
    });

    /* 上下から漆をかけて題字を乗せる場所を作る */
    const veil = g.createLinearGradient(0, 0, 0, COVER_H);
    veil.addColorStop(0, 'rgba(8,16,16,.30)');
    veil.addColorStop(0.24, 'rgba(8,16,16,.04)');
    veil.addColorStop(0.52, 'rgba(8,16,16,.42)');
    veil.addColorStop(0.78, 'rgba(8,16,16,.90)');
    veil.addColorStop(1, '#081010');
    g.fillStyle = veil;
    g.fillRect(0, 0, COVER_W, COVER_H);

    /* 看板の灯り */
    const glow = g.createRadialGradient(COVER_W / 2, COVER_H * 0.76, 10,
                                        COVER_W / 2, COVER_H * 0.76, COVER_W * 0.46);
    glow.addColorStop(0, 'rgba(255,58,140,.24)');
    glow.addColorStop(1, 'rgba(255,58,140,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, COVER_W, COVER_H);

    const glow2 = g.createRadialGradient(COVER_W / 2, COVER_H * 0.90, 10,
                                         COVER_W / 2, COVER_H * 0.90, COVER_W * 0.34);
    glow2.addColorStop(0, 'rgba(60,220,255,.14)');
    glow2.addColorStop(1, 'rgba(60,220,255,0)');
    g.fillStyle = glow2;
    g.fillRect(0, 0, COVER_W, COVER_H);

    /* 題字。ネオン管に見えるよう、外側から内側へ重ねて描く */
    const fam = '"Maru","Hiragino Maru Gothic ProN","M PLUS Rounded 1c",sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';

    g.font = '800 118px ' + fam;
    const ty = COVER_H * 0.76;
    [[26, 'rgba(255,58,140,.95)'], [16, 'rgba(255,58,140,1)'], [6, '#ffffff']]
      .forEach(([blur, color]) => {
        g.shadowColor = color; g.shadowBlur = blur;
        g.fillStyle = '#ffe9f3';
        g.fillText(TITLE, COVER_W / 2, ty);
      });
    g.shadowBlur = 0;

    /* 副題は水色。看板の桃色に対して、店内の緑と反対側の色を当てる */
    g.font = '700 44px ' + fam;
    [[20, 'rgba(60,220,255,.95)'], [10, 'rgba(60,220,255,1)']].forEach(([blur, color]) => {
      g.shadowColor = color; g.shadowBlur = blur;
      g.fillStyle = '#c9f6ff';
      g.fillText(SUBTITLE, COVER_W / 2, ty + 74);
    });
    g.shadowBlur = 0;
  }

  /* 埋め込みフォントが届く前に描くと、丸ゴにならない */
  async function readyFont() {
    if (!document.fonts || !document.fonts.load) return;
    try {
      await Promise.all([
        document.fonts.load('800 118px Maru', TITLE),
        document.fonts.load('700 34px Maru', SUBTITLE),
      ]);
      await document.fonts.ready;
    } catch (e) { /* 読めなくても既定の書体で描く */ }
  }

  /* 外枠から呼ぶ。canvasは画面を移っても消さない */
  async function paintCover(canvas, st) {
    const ids = wallIds(st || {}, COVER_COLS * COVER_ROWS);
    await readyFont();
    await drawCover(canvas, ids.map((id) => `img/${pad3(id)}.webp`));
  }

  /* 表紙に並べる顔。発見済みがいればそこから、いなければ全員から選ぶ */
  function wallIds(st, n) {
    const found = (st.discovered || []).filter((id) => id <= 73);
    const pool = found.length >= n ? found : JANDOLS.map((c) => c.id);
    const out = [];
    const bag = pool.slice();
    while (out.length < n && bag.length) {
      out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
    }
    return out;
  }

  function faceSrc(key) { return `img/${normalizeFace(key)}.webp`; }

  /* 雀ドルの総数。characters.js に足せば自動で追随する。
     題字と副題に数を入れていないのも同じ理由（増やすたびに嘘になるうえ、
     埋め込みフォントは使う文字だけを切り出しているので数字を足すと崩れる） */
  function TOTAL() { return JANDOLS.length + FREE_AGENTS.length; }

  /* 候補を4枚から12枚に増やしたとき、古いセーブの p1〜p4 が
     別人を指してしまうので、知らないキーは既定に寄せる */
  function normalizeFace(key) {
    return FACES.some((f) => f.key === key) ? key : DEFAULT_FACE;
  }

  /* ------------------------------------------------------------
     マウント
  ------------------------------------------------------------ */
  function mount(root, store) {
    ensureSilVar();
    root.innerHTML = '';
    root.classList.add('ttRoot');

    let screen = 'top';
    let name = store.get().playerName || DEFAULT_NAME;
    let face = normalizeFace(store.get().playerFace);

    /* ---------- 表紙 ---------- */
    function renderTop() {
      const st = store.get();
      const started = !!st.teamDecided;
      let state = '';
      if (started) {
        const mates = (st.contracted || []).slice(0, 5);
        state = `<div class="ttState">
          <div class="ttStateT">事務所の様子</div>
          <div class="ttStateRow">
            <span class="ttStateItem">所属 <b>${(st.contracted || []).length}</b>人</span>
            <span class="ttStateItem">所持金 <b>${yen(st.money || 0)}</b></span>
            <span class="ttStateItem">段位 <b>${st.playerRank || 'D'}</b></span>
            <span class="ttStateItem">発見 <b>${(st.discovered || []).length}</b>／${TOTAL()}</span>
          </div>
          <div class="ttRoster">${mates.map((id) =>
            `<span><img src="img/${pad3(id)}.webp" alt="" onerror="this.remove()"></span>`).join('')}</div>
        </div>`;
      }

      /* 表紙の絵は #cover のcanvasが受け持つ。ここには文字を置かない */
      root.innerHTML = `
        <div class="ttBody">
          ${state}
          <p class="ttLead">全国の雀荘を歩いて雀ドルを見つけ、口説き、育てて、大会に出す。
            最後は最強の八人「雀エイト」を、あなたの事務所で独占する。</p>
          <div class="ttActions">
            ${started ? `<button type="button" class="ttBtn" data-act="continue">続きから</button>` : ''}
            <button type="button" class="ttBtn${started ? ' ghost' : ''}" data-act="new">
              ${started ? '最初からはじめる' : 'はじめる'}</button>
          </div>
          <p class="ttFoot">本格麻雀。イカサマなし、牌操作なし。</p>
        </div>`;
    }

    /* ---------- プレイヤー設定 ---------- */
    function renderSetup() {
      root.innerHTML = `
        <div class="ttSetup">
          <h1 class="ttSetupT">あなたのこと</h1>
          <p class="ttNote">事務所を開くのはあなたです。名前と顔を決めてください。あとから変えられます。</p>

          <div class="ttField">
            <label class="ttLabel" for="ttName">名前</label>
            <input class="ttInput" id="ttName" type="text" maxlength="12" value="${esc(name)}"
              autocomplete="off" spellcheck="false">
            <p class="ttNote">名鑑や大会の着順表にこの名前で出ます。</p>
          </div>

          <div class="ttField">
            <span class="ttLabel">顔</span>
            <div class="ttFaces">
              ${FACES.map((f) => `<button type="button" class="ttFace sil" data-face="${f.key}"
                  aria-pressed="${face === f.key}" aria-label="${esc(f.note)}">
                <img src="${faceSrc(f.key)}" alt="" onerror="this.remove()"></button>`).join('')}
            </div>
            <p class="ttNote">押すと大きく見られます。十二人から選べます。あとから変えられます。</p>
          </div>

          <hr class="kinsen">
          <button type="button" class="ttBtn" data-act="go">この人ではじめる</button>
          <button type="button" class="ttBtn ghost" data-act="back" style="margin-top:8px">戻る</button>
        </div>`;
      const input = root.querySelector('#ttName');
      input.addEventListener('input', () => { name = input.value; });
    }

    /* ---------- 操作 ---------- */
    /* 一覧の顔は小さいので、押したら大きく見てから決められるようにする */
    function showFace(key) {
      const info = FACES.find((f) => f.key === key) || FACES[0];
      const ov = document.createElement('div');
      ov.className = 'popup';
      ov.innerHTML = `<div class="popupBox" role="dialog" aria-modal="true"
          aria-label="${esc(info.note)}">
        <button type="button" class="popupClose" aria-label="閉じる">✕</button>
        <div class="popupPhoto">
          <span class="mkFace sil"><img src="${faceSrc(key)}" alt="" onerror="this.remove()"></span>
        </div>
        <div class="popupBody">
          <div class="popupNote">${esc(info.note)}</div>
          <button type="button" class="ttBtn" data-take="${key}">この顔にする</button>
        </div>
      </div>`;

      function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      ov.addEventListener('click', (e) => {
        if (e.target === ov || e.target.closest('.popupClose')) { close(); return; }
        const take = e.target.closest('[data-take]');
        if (take) {
          face = take.dataset.take;
          root.querySelectorAll('[data-face]').forEach((b) =>
            b.setAttribute('aria-pressed', b.dataset.face === face));
          close();
        }
      });
      document.addEventListener('keydown', onKey);
      document.body.append(ov);
      ov.querySelector('[data-take]').focus();
    }

    root.addEventListener('click', (e) => {
      const f = e.target.closest('[data-face]');
      if (f) { showFace(f.dataset.face); return; }
      const act = e.target.closest('[data-act]');
      if (!act) return;

      if (act.dataset.act === 'continue') {
        if (typeof store.onContinue === 'function') store.onContinue();
      } else if (act.dataset.act === 'new') {
        screen = 'setup';
        renderSetup();
        window.scrollTo(0, 0);
      } else if (act.dataset.act === 'back') {
        screen = 'top';
        renderTop();
        window.scrollTo(0, 0);
      } else if (act.dataset.act === 'go') {
        const clean = (name || '').trim() || DEFAULT_NAME;
        store.set({ playerName: clean, playerFace: face });
        if (typeof store.onStart === 'function') store.onStart(clean, face);
      }
    });

    renderTop();
    return {
      refresh: function () { if (screen === 'top') renderTop(); else renderSetup(); },
    };
  }

  function ensureSilVar() {
    if (document.documentElement.style.getPropertyValue('--sil-img')) return;
    const svg = encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<g fill="#0d1f1a"><circle cx="50" cy="30" r="17"/>' +
      '<path d="M14 100 C17 66 36 54 50 54 C64 54 83 66 86 100 Z"/></g></svg>'
    );
    document.documentElement.style.setProperty('--sil-img', `url("data:image/svg+xml,${svg}")`);
  }

  return {
    mount, FACES, DEFAULT_NAME, DEFAULT_FACE, faceSrc, normalizeFace,
    TITLE, SUBTITLE, paintCover, COVER_W, COVER_H,
  };
})();

/* ===== meikan.js ===== */
/* ============================================================
   雀ドル名鑑 — meikan.js
   依存：characters.js（JANDOLS / FREE_AGENTS / STYLES / REGIONS /
        CONTRACTS / RANK_INFO）と meikan.css

   使い方：
     Meikan.mount(rootElement, store)
     store は { get() → state, set(patch) } を持つオブジェクト。
     state はすべて id で持つ（引き継ぎ書 §5 のセーブ方針）：
       discovered : number[]  発見済みの雀ドルid
       contracted : number[]  契約済みの雀ドルid
       comp       : { [id]: 0-100 }  完成度（契約済みのみ意味を持つ）
       favor      : { [id]: 0-100 }  好感度（未使用。枠だけ確保）

   画像は img/<3桁>.webp。読めない場合はシルエットに自動で落ちる。
   ============================================================ */

const Meikan = (() => {
  'use strict';

  const ALL = () => JANDOLS.concat(FREE_AGENTS);

  /* プレイヤー本人。雀ドルと番号がぶつからないよう id 0、画像は img/p01.webp など */
  function playerEntry(st) {
    return {
      id: 0,
      name: st.playerName || 'あなた',
      face: Title.normalizeFace(st.playerFace),
      rank: st.playerRank || 'D',
      region: '—',
      isPlayer: true,
    };
  }
  const pad3 = (id) => String(id).padStart(3, '0');
  /* プレイヤーは番号ではなく face キーで画像を引く */
  const imgSrc = (c) => (c && c.isPlayer) ? `img/${c.face}.webp` : `img/${pad3(c.id != null ? c.id : c)}.webp`;

  /* 段位。tournament.js の閾値と同じ（D:0-19 C:20-39 B:40-64 A:65-84 S:85-100） */
  function gradeOfComp(comp) {
    if (comp >= 85) return 'S';
    if (comp >= 65) return 'A';
    if (comp >= 40) return 'B';
    if (comp >= 20) return 'C';
    return 'D';
  }

  /* 打ち筋バーの表示項目 */
  const BAR_KEYS = [
    ['push', '押し'], ['defense', '守備'],
    ['speed', '速度'], ['value', '打点'],
    ['call', '鳴き'], ['riichi', '立直'],
    ['endgame', '終盤'], ['variance', 'ムラ'],
  ];

  /* シルエット（胸像）。CSS変数として1回だけ注入する */
  const SIL_SVG = encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
    '<g fill="#0d1f1a">' +
    '<circle cx="50" cy="30" r="17"/>' +
    '<path d="M14 100 C17 66 36 54 50 54 C64 54 83 66 86 100 Z"/>' +
    '</g></svg>'
  );
  function injectSilVar() {
    document.documentElement.style.setProperty('--sil-img', `url("data:image/svg+xml,${SIL_SVG}")`);
  }

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  const yen = (n) => n > 0 ? `${n.toLocaleString('ja-JP')}円` : 'なし';

  /* tournament.js が読まれていない単体ページでも落ちないようにする */
  function tierName(key) {
    return (typeof TOURNAMENTS !== 'undefined' && TOURNAMENTS[key]) ? TOURNAMENTS[key].name : key;
  }

  /* ------------------------------------------------------------
     マウント
  ------------------------------------------------------------ */
  function mount(root, store) {
    injectSilVar();

    const view = { show: 'all', rank: 'all', region: 'all' };
    let openId = null;

    root.innerHTML = '';
    root.classList.add('mkRoot');

    const head = document.createElement('div');
    const filters = document.createElement('div');
    const grid = document.createElement('div');
    head.className = 'mkHead';
    filters.className = 'mkFilters';
    grid.className = 'mkGrid';
    root.append(head, filters, grid);

    /* ---------- 見出し ---------- */
    function renderHead() {
      const st = store.get();
      const total = ALL().length;
      head.innerHTML =
        `<h1 class="mkTitle">雀ドル名鑑<small>全国${total}名</small></h1>` +
        `<div class="mkCounts">` +
        `<span class="mkCount">発見 <b>${st.discovered.length}</b>／${total}</span>` +
        `<span class="mkCount">契約 <b>${st.contracted.length}</b></span>` +
        `</div>`;
    }

    /* ---------- 絞り込み ---------- */
    function chip(label, pressed, onTap) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mkChip';
      b.textContent = label;
      b.setAttribute('aria-pressed', pressed);
      b.addEventListener('click', onTap);
      return b;
    }
    function renderFilters() {
      filters.innerHTML = '';
      [['all', 'すべて'], ['found', '発見済み'], ['signed', '契約済み']].forEach(([k, label]) => {
        filters.append(chip(label, view.show === k, () => { view.show = k; refresh(); }));
      });
      const sep = document.createElement('span');
      sep.className = 'mkSep';
      filters.append(sep);

      ['all', 'S', 'A', 'B', 'C', 'D'].forEach((r) => {
        filters.append(chip(r === 'all' ? '全級' : r + '級', view.rank === r,
          () => { view.rank = r; refresh(); }));
      });

      const sel = document.createElement('select');
      sel.className = 'mkSelect';
      sel.setAttribute('aria-label', '地域で絞り込む');
      sel.innerHTML = '<option value="all">全地域</option>' +
        REGIONS.map((r) => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
      sel.value = view.region;
      sel.addEventListener('change', () => { view.region = sel.value; refresh(); });
      filters.append(sel);
    }

    /* ---------- 一覧 ---------- */
    function faceHTML(c, discovered) {
      if (!discovered) return `<div class="mkFace sil"></div>`;
      /* 画像が読めなければ img を消してシルエットが残る */
      return `<div class="mkFace sil"><img src="${imgSrc(c)}" alt="" loading="lazy"
        onerror="this.remove()"></div>`;
    }

    function cardHTML(c, st) {
      const discovered = c.isPlayer || st.discovered.includes(c.id);
      const signed = !c.isPlayer && st.contracted.includes(c.id);
      const cls = ['mkCard'];
      if (!discovered) cls.push('unknown');
      if (signed) cls.push('signed');

      let inner = faceHTML(c, discovered) +
        `<span class="mkNo">${c.isPlayer ? '自分' : 'No.' + pad3(c.id)}</span>`;
      if (discovered) {
        inner +=
          `<span class="mkRank rk-${c.rank}">${c.rank}</span>` +
          `<span class="mkBar"><span class="mkName">${esc(c.name)}</span>` +
          `<span class="mkStyle">${c.isPlayer ? '事務所の主' : esc(STYLES[c.style].name)}</span></span>`;
        if (signed) inner += `<span class="mkSeal">契<br>約</span>`;
      } else {
        inner += `<span class="mkQ">？</span>`;
      }
      const label = discovered ? `${c.name}の詳細` : `未発見 No.${pad3(c.id)}`;
      return `<button type="button" class="${cls.join(' ')}" data-id="${c.id}" aria-label="${esc(label)}">${inner}</button>`;
    }

    function filtered(st) {
      const me = playerEntry(st);
      const showMe = (view.show !== 'signed')
        && (view.rank === 'all' || view.rank === me.rank)
        && (view.region === 'all');
      const rest = ALL().filter((c) => {
        const d = st.discovered.includes(c.id);
        const s = st.contracted.includes(c.id);
        if (view.show === 'found' && !d) return false;
        if (view.show === 'signed' && !s) return false;
        if (view.rank !== 'all' && (!d || c.rank !== view.rank)) return false;
        if (view.region !== 'all' && (!d || c.region !== view.region)) return false;
        return true;
      });
      return showMe ? [me].concat(rest) : rest;
    }

    function renderGrid() {
      const st = store.get();
      const list = filtered(st);
      grid.innerHTML = list.length
        ? list.map((c) => cardHTML(c, st)).join('')
        : `<div class="mkEmpty">この条件に当てはまる雀ドルはまだいません</div>`;
    }

    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.mkCard');
      if (btn) openDetail(Number(btn.dataset.id));
    });

    /* ---------- 詳細 ---------- */
    function barsHTML(styleKey) {
      const s = STYLES[styleKey];
      return `<div class="mkBars">` + BAR_KEYS.map(([k, label]) =>
        `<div class="mkBarRow"><span>${label}</span>` +
        `<span class="mkTrack"><span class="mkFill" style="width:${Math.round(s[k] * 100)}%"></span></span></div>`
      ).join('') + `</div>`;
    }

    function detailHTML(c, st) {
      const discovered = c.isPlayer || st.discovered.includes(c.id);
      const signed = !c.isPlayer && st.contracted.includes(c.id);

      /* プレイヤーは打ち筋の係数を持たない（人間なので実際の打牌で決まる） */
      if (c.isPlayer) {
        const wins = st.playerWins || 0;
        const recs = Object.entries(st.records || {});
        return `<div class="mkPortrait"><div class="mkFace sil">
            <img src="${imgSrc(c)}" alt="${esc(c.name)}" onerror="this.remove()"></div></div>
          <div class="mkBody">
            <div class="mkNameRow"><span class="mkBigNo">事務所の主</span>
              <span class="mkBigName">${esc(c.name)}</span></div>
            <p class="mkCopy">――「ここから八人を揃える」</p>
            <div class="mkTags"><span class="mkTag rank">${esc(c.rank)}級</span>
              <span class="mkTag">所属 ${(st.contracted || []).length}人</span></div>
            <h2 class="mkSecT">成績</h2>
            <dl>
              <div class="mkRow"><dt>段位</dt><dd>${esc(c.rank)}級</dd></div>
              <div class="mkRow"><dt>次の段位まで</dt><dd>あと${Math.max(0, ({D:2,C:3,B:4,A:6}[c.rank] || 0) - wins)}回優勝</dd></div>
            </dl>
            ${recs.length ? '<h2 class="mkSecT">大会</h2>' + recs.map(([k, r]) =>
              `<div class="mkRow"><dt>${esc(tierName(k))}</dt>
               <dd>${r.entries}回出場　最高 ${esc(r.best)}</dd></div>`).join('')
              : '<p class="mkQuiet">まだ大会に出ていません。</p>'}
            <p class="mkQuiet">あなたの打ち筋は決まっていません。実際に打った牌がそのまま結果になります。</p>
          </div>`;
      }

      if (!discovered) {
        return `<div class="mkPortrait"><div class="mkFace sil" style="filter:brightness(.55) saturate(.6)"></div>
          <span class="mkQ">？</span></div>
          <div class="mkBody">
            <div class="mkNameRow"><span class="mkBigNo">No.${pad3(c.id)}</span>
            <span class="mkBigName">？？？</span></div>
            <p class="mkQuiet">まだ出会っていない雀ドル。<br>【${esc(c.region)}】の雀荘で噂されている。</p>
          </div>`;
      }

      const info = RANK_INFO[c.rank];
      const comp = st.comp[c.id];
      const compRow = signed && comp != null
        ? `<h2 class="mkSecT">育成</h2>
           <div class="mkComp"><span class="mkGrade">${gradeOfComp(comp)}段位</span>
           <span class="mkTrack"><span class="mkFill" style="width:${comp}%"></span></span>
           <span>完成度 ${comp}</span></div>
           <p class="mkQuiet">伸びしろ ${c.pot} ｜ 上限 ${Math.min(100, comp + c.pot)}</p>`
        : '';

      return `<div class="mkPortrait"><div class="mkFace sil">
          <img src="${imgSrc(c)}" alt="${esc(c.name)}" onerror="this.remove()"></div>
          ${signed ? '<span class="mkSealBig">契約</span>' : ''}</div>
        <div class="mkBody">
          <div class="mkNameRow">
            <span class="mkBigNo">No.${pad3(c.id)}</span>
            <span class="mkBigName">${esc(c.name)}</span>
            <span class="mkKana">${esc(c.kana)}</span>
          </div>
          <p class="mkCopy">――「${esc(c.copy)}」</p>
          <div class="mkTags">
            <span class="mkTag rank">${info.name}・${info.label}</span>
            <span class="mkTag">${esc(c.region)}</span>
            <span class="mkTag">${c.age}歳</span>
            <span class="mkTag">${esc(c.sell)}</span>
          </div>

          <h2 class="mkSecT">打ち筋 ─ ${esc(STYLES[c.style].name)}</h2>
          ${barsHTML(c.style)}

          <h2 class="mkSecT">人物</h2>
          <dl>
            <div class="mkRow"><dt>性格</dt><dd>${esc(c.chara)}</dd></div>
            <div class="mkRow"><dt>成長タイプ</dt><dd>${esc(c.growth)}</dd></div>
            <div class="mkRow"><dt>人気</dt><dd>${c.pop}</dd></div>
          </dl>

          ${compRow}

          <h2 class="mkSecT">契約</h2>
          <dl>
            <div class="mkRow"><dt>条件</dt><dd>${esc(CONTRACTS[c.contract])}</dd></div>
            <div class="mkRow"><dt>契約金の目安</dt><dd>${yen(info.scoutCost)}</dd></div>
            <div class="mkRow"><dt>年俸</dt><dd>${yen(c.salary)}</dd></div>
          </dl>
          <div class="mkExtra" data-extra="${c.id}"></div>
        </div>`;
    }

    function openDetail(id) {
      const st0 = store.get();
      const c = id === 0 ? playerEntry(st0) : ALL().find((x) => x.id === id);
      if (!c) return;
      openId = id;

      const overlay = document.createElement('div');
      overlay.className = 'mkOverlay';
      const st = store.get();
      const signed = id !== 0 && st.contracted.includes(id);
      overlay.innerHTML =
        `<div class="mkSheet${signed ? ' signed' : ''}" role="dialog" aria-modal="true" aria-label="${esc(c.name || '未発見')}">
          <button type="button" class="mkClose" aria-label="閉じる">✕</button>
          ${detailHTML(c, st)}
        </div>`;

      function close() {
        overlay.remove();
        openId = null;
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay || e.target.closest('.mkClose')) close();
      });
      document.addEventListener('keydown', onKey);
      document.body.append(overlay);
      overlay.querySelector('.mkClose').focus();

      /* 呼び出し側が詳細にボタン等を差し込める（デバッグや契約処理用） */
      if (typeof store.onDetailOpen === 'function') {
        store.onDetailOpen(c, overlay.querySelector(`[data-extra="${id}"]`), refresh);
      }
    }

    /* ---------- 再描画 ---------- */
    function refresh() {
      renderHead();
      renderFilters();
      renderGrid();
    }
    refresh();

    return {
      refresh,
      get openId() { return openId; },
    };
  }

  return { mount, gradeOfComp, pad3, imgSrc };
})();

/* ===== team.js ===== */
/* ============================================================
   チーム編成 — team.js
   依存：characters.js（FREE_AGENTS / STYLES / PLAYER）
        tournament.js（paramsOf / strengthOf / gradeOf）
        meikan.css（シルエットとランクバッジを共有）と team.css

   使い方：
     Team.mount(rootElement, store)
     store は { get() → state, set(patch), onDecided(ids) } を持つ。
     state.team … 選んだ仲間3人のid配列（順不同）

   初期メンバー10人（id 64〜73）から3人を選ぶ。全員D級・契約金なしで、
   打ち筋が全員違う。ここが実質のチュートリアルなので、
   「どれを選んでも間違いではないが、選び方で色が変わる」ことを見せる。
   ============================================================ */

const Team = (() => {
  'use strict';

  const SEATS = 3;                 // プレイヤー以外の枠
  const KAZE = ['東', '南', '西', '北'];

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const pad3 = (id) => String(id).padStart(3, '0');

  /* 講評メーター。
     打ち筋の完成形（STYLES）で測る。未熟な時点の係数(rawParams)は
     全員「押しすぎ・守り甘い」に寄るので、どの三人を選んでも同じ講評になる。
     ここで見せたいのは「この三人が育つとどういう事務所になるか」なので完成形を使う。 */
  const METERS = [
    ['攻め',   (p) => (p.push * 0.6 + p.value * 0.4)],
    ['守り',   (p) => p.defense],
    ['速さ',   (p) => (p.speed * 0.65 + p.call * 0.35)],
    ['終盤',   (p) => p.endgame],
    ['安定',   (p) => 1 - p.variance],
  ];

  function teamMeters(list) {
    if (!list.length) return METERS.map(([label]) => [label, 0]);
    return METERS.map(([label, fn]) => {
      const avg = list.reduce((a, c) => a + fn(STYLES[c.style]), 0) / list.length;
      return [label, Math.max(0, Math.min(1, avg))];
    });
  }

  /* 3人そろったときの講評。優劣ではなく「どういう色になったか」を返す。
     しきい値は120通り（10C3）の実分布の四分位で決めてある */
  function verdict(list) {
    const m = Object.fromEntries(teamMeters(list));
    const potAvg = list.reduce((a, c) => a + c.pot, 0) / list.length;
    const gap = m['攻め'] - m['守り'];

    let line, note;
    if (gap > 0.08) {
      line = '攻めに寄った布陣';
      note = '押し合いに強い代わりに、放銃が増えます。'
        + '大会は合計点の勝負なので、誰かが大きく沈むと取り返しが利きません。';
    } else if (gap < -0.18) {
      line = '守りに寄った布陣';
      note = '大負けしにくい代わりに、トップが遠くなります。'
        + '賞金は順位で決まるので、序盤は資金が伸び悩むかもしれません。';
    } else {
      line = '攻守の釣り合いが取れた布陣';
      note = '尖りがないぶん、どの大会でも形になります。'
        + '色は育成で後からいくらでも付けられます。';
    }

    const extra = [];
    if (potAvg >= 74.5) extra.push('伸びしろが大きい三人です。今は弱くても、育てば化けます。');
    else if (potAvg <= 70.5) extra.push('今すぐ戦える三人です。そのぶん天井は低めになります。');
    if (m['速さ'] >= 0.62) extra.push('仕掛けが速く、短期決戦向きです。');
    else if (m['速さ'] <= 0.45) extra.push('手が遅いぶん、和了ったときは大きい編成です。');
    if (m['安定'] >= 0.84) extra.push('ムラが小さく、成績が読みやすい編成です。');
    else if (m['安定'] <= 0.77) extra.push('ムラが大きく、大会ごとの上下が激しくなります。');
    if (m['終盤'] >= 0.67) extra.push('終盤の条件戦に強く、僅差の勝負で伸びます。');

    return { line, note: note + (extra.length ? '　' + extra.join('　') : '') };
  }

  /* ------------------------------------------------------------
     マウント
  ------------------------------------------------------------ */
  function mount(root, store) {
    /* シルエットのCSS変数は名鑑と共有。単体で開いたときのために念のため */
    if (typeof Meikan !== 'undefined' && !document.documentElement.style.getPropertyValue('--sil-img')) {
      Meikan.mount; // 参照だけ。実際の注入は下の fallback で行う
    }
    ensureSilVar();

    const picked = (store.get().team || []).slice(0, SEATS);

    root.innerHTML = '';
    root.classList.add('tmRoot');
    const head = document.createElement('div');
    head.className = 'tmHead';
    head.innerHTML =
      `<h1 class="tmTitle">チームを組む</h1>` +
      `<p class="tmLead">事務所を開いたばかりのあなたに、三人まで面倒を見る余裕があります。` +
      `全員D級・契約金なし。打ち筋は十人とも違うので、選んだ三人がそのまま事務所の色になります。` +
      `大会では四人が別々の卓に散り、合計点で勝ち上がります。</p>`;

    const table = document.createElement('div');
    table.className = 'tmTable';

    const secT = document.createElement('h2');
    secT.className = 'tmSecT';
    secT.textContent = '入所希望者　十名';

    const grid = document.createElement('div');
    grid.className = 'tmGrid';

    const hint = document.createElement('p');
    hint.className = 'tmHint';
    hint.textContent = 'カードを押すと大きく見られます。卓の×でも外せます。';

    root.append(head, table, secT, grid, hint);

    const byId = (id) => FREE_AGENTS.find((c) => c.id === id);

    /* ---------- 卓 ---------- */
    function renderTable() {
      const list = picked.map(byId).filter(Boolean);
      const me = store.get();
      const myName = me.playerName || 'あなた';
      const myFace = Title.normalizeFace(me.playerFace);
      const seats = [`<button type="button" class="tmSeat you" disabled>
          <span class="tmSeatKaze">${KAZE[0]}</span>
          <span class="mkFace sil"><img src="img/${myFace}.webp" alt="" onerror="this.remove()"></span>
          <span class="tmSeatBar"><span class="tmSeatName">${esc(myName)}</span>
          <span class="tmSeatStyle">あなた</span></span></button>`];

      for (let i = 0; i < SEATS; i++) {
        const c = list[i];
        if (!c) {
          seats.push(`<button type="button" class="tmSeat" disabled>
            <span class="tmSeatKaze">${KAZE[i + 1]}</span>
            <span class="tmSeatEmpty">空席</span></button>`);
        } else {
          seats.push(`<button type="button" class="tmSeat filled" data-drop="${c.id}"
              aria-label="${esc(c.name)}を外す">
            <span class="tmSeatKaze">${KAZE[i + 1]}</span>
            <span class="mkFace sil"><img src="img/${pad3(c.id)}.webp" alt=""
              onerror="this.remove()"></span>
            <span class="tmSeatDrop" aria-hidden="true">✕</span>
            <span class="tmSeatBar"><span class="tmSeatName" data-full="${esc(c.name)}"
              >${esc(c.name)}</span>
            <span class="tmSeatStyle">${esc(STYLES[c.style].name)}</span></span></button>`);
        }
      }

      const meters = teamMeters(list);
      const metersHTML = `<div class="tmMeters">` + meters.map(([label, v]) =>
        `<div class="tmMeterRow"><span>${label}</span>
         <span class="tmTrack"><span class="tmFill" style="width:${Math.round(v * 100)}%"></span></span></div>`
      ).join('') + `</div>`;

      let verdictHTML;
      if (list.length < SEATS) {
        verdictHTML = `<div class="tmVerdict">
          <div class="tmVerdictLine">あと${SEATS - list.length}人</div>
          <div class="tmVerdictNote">三人そろうと、この編成の講評が出ます。</div>
          ${metersHTML}</div>`;
      } else {
        const v = verdict(list);
        verdictHTML = `<div class="tmVerdict">
          <div class="tmVerdictLine">${esc(v.line)}</div>
          <div class="tmVerdictNote">${esc(v.note)}</div>
          ${metersHTML}</div>`;
      }

      table.innerHTML = `<div class="tmSeats">${seats.join('')}</div>${verdictHTML}
        <button type="button" class="tmGo" ${list.length < SEATS ? 'disabled' : ''}>この三人で始める</button>`;
    }

    /* ---------- 候補 ---------- */
    function renderCandidates() {
      grid.innerHTML = FREE_AGENTS.map((c) => {
        const on = picked.includes(c.id);
        const full = picked.length >= SEATS && !on;
        return `<button type="button" class="tmCand${on ? ' picked' : ''}${full ? ' dim' : ''}"
            data-id="${c.id}" aria-pressed="${on}">
          <span class="tmCandFace"><span class="mkFace sil"><img src="img/${pad3(c.id)}.webp"
            alt="" loading="lazy" onerror="this.remove()"></span></span>
          <span class="tmCandBody">
            <span class="tmCandName">${esc(c.name)}</span>
            <span class="tmCandStyle">${esc(STYLES[c.style].name)}</span>
            <span class="tmCandCopy">「${esc(c.copy)}」</span>
            <span class="tmCandMeta">
              <span class="tmMini">${esc(c.region)}</span>
              <span class="tmMini">${esc(c.growth)}</span>
              <span class="tmMini pot">伸びしろ ${c.pot}</span>
            </span>
          </span></button>`;
      }).join('');
    }

    function refresh() { renderTable(); renderCandidates(); }

    /* ---------- 操作 ---------- */
    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.tmCand');
      if (!btn) return;
      showCandidate(Number(btn.dataset.id));
    });

    /* 席に着ける／外す。ポップアップと卓の×から呼ぶ */
    function toggle(id) {
      const at = picked.indexOf(id);
      if (at >= 0) picked.splice(at, 1);
      else if (picked.length < SEATS) picked.push(id);
      store.set({ team: picked.slice() });
      refresh();
    }

    /* 札は小さいので、押したら大きく見てから決められるようにする */
    function showCandidate(id) {
      const c = byId(id);
      if (!c) return;
      const on = picked.includes(id);
      const full = picked.length >= SEATS && !on;
      const meters = METERS.map(([label, fn]) => {
        const v = Math.max(0, Math.min(1, fn(STYLES[c.style])));
        return `<div class="tmMeterRow"><span>${label}</span>
          <span class="tmTrack"><span class="tmFill" style="width:${Math.round(v * 100)}%"></span></span></div>`;
      }).join('');

      const ov = document.createElement('div');
      ov.className = 'popup';
      ov.innerHTML = `<div class="popupBox" role="dialog" aria-modal="true" aria-label="${esc(c.name)}">
        <button type="button" class="popupClose" aria-label="閉じる">✕</button>
        <div class="popupPhoto">
          <span class="mkFace sil"><img src="img/${pad3(c.id)}.webp" alt="" onerror="this.remove()"></span>
          <span class="tmPopName">${esc(c.name)}</span>
        </div>
        <div class="popupBody tmPopBody">
          <div class="tmPopStyle">${esc(STYLES[c.style].name)}</div>
          <div class="tmPopCopy">「${esc(c.copy)}」</div>
          <div class="tmCandMeta tmPopMeta">
            <span class="tmMini">${esc(c.region)}</span>
            <span class="tmMini">${esc(c.growth)}</span>
            <span class="tmMini pot">伸びしろ ${c.pot}</span>
          </div>
          <div class="tmMeters tmPopMeters">${meters}</div>
          ${full
            ? '<p class="tmPopFull">卓は三人まで。誰かを外してから声をかけてください。</p>'
            : `<button type="button" class="tmGo" data-take="${c.id}" style="margin-top:12px">${
                on ? '卓から外す' : '卓に着いてもらう'}</button>`}
        </div>
      </div>`;

      function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      ov.addEventListener('click', (e) => {
        if (e.target === ov || e.target.closest('.popupClose')) { close(); return; }
        const take = e.target.closest('[data-take]');
        if (take) { close(); toggle(Number(take.dataset.take)); }
      });
      document.addEventListener('keydown', onKey);
      document.body.append(ov);
      const btn = ov.querySelector('[data-take]') || ov.querySelector('.popupClose');
      btn.focus();
    }

    table.addEventListener('click', (e) => {
      const drop = e.target.closest('[data-drop]');
      if (drop) { toggle(Number(drop.dataset.drop)); return; }
      const go = e.target.closest('.tmGo');
      if (go && !go.disabled) confirmTeam();
    });

    /* ---------- 確認 ---------- */
    function confirmTeam() {
      const list = picked.map(byId);
      const overlay = document.createElement('div');
      overlay.className = 'mkOverlay';
      overlay.innerHTML = `<div class="mkSheet" role="dialog" aria-modal="true" aria-label="チームの確認">
        <div class="mkBody">
          <h2 class="mkSecT">この三人で始めます</h2>
          <p class="mkQuiet">${list.map((c) => esc(c.name)).join('　／　')}</p>
          <p class="mkQuiet">選ばなかった七人は名鑑に残り、資金ができてから改めて契約できます。</p>
          <div style="display:flex;gap:8px;margin-top:14px">
            <button type="button" class="tmGo" data-yes style="margin:0">始める</button>
            <button type="button" class="tmGo" data-no
              style="margin:0;background:transparent;color:var(--ivory-2);border-color:var(--gold-dim)">選び直す</button>
          </div>
        </div></div>`;
      overlay.addEventListener('click', (e) => {
        if (e.target.closest('[data-no]') || e.target === overlay) { overlay.remove(); return; }
        if (e.target.closest('[data-yes]')) {
          overlay.remove();
          decide();
        }
      });
      document.body.append(overlay);
      overlay.querySelector('[data-yes]').focus();
    }

    function decide() {
      const st = store.get();
      const comp = Object.assign({}, st.comp);
      picked.forEach((id) => {
        const c = byId(id);
        if (comp[id] == null) comp[id] = c.comp;
      });
      const contracted = (st.contracted || []).slice();
      picked.forEach((id) => { if (!contracted.includes(id)) contracted.push(id); });
      const discovered = (st.discovered || []).slice();
      picked.forEach((id) => { if (!discovered.includes(id)) discovered.push(id); });

      store.set({ team: picked.slice(), contracted, comp, discovered, teamDecided: true });
      if (typeof store.onDecided === 'function') store.onDecided(picked.slice());
    }

    refresh();
    return { refresh, get picked() { return picked.slice(); } };
  }

  /* 名鑑と同じシルエット。単体でも動くように自前で持つ */
  function ensureSilVar() {
    if (document.documentElement.style.getPropertyValue('--sil-img')) return;
    const svg = encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<g fill="#0d1f1a"><circle cx="50" cy="30" r="17"/>' +
      '<path d="M14 100 C17 66 36 54 50 54 C64 54 83 66 86 100 Z"/></g></svg>'
    );
    document.documentElement.style.setProperty('--sil-img', `url("data:image/svg+xml,${svg}")`);
  }

  return { mount, verdict, teamMeters };
})();

/* ===== taikai.js ===== */
/* ============================================================
   大会 — taikai.js
   依存：characters.js / tournament.js / meikan.css / taikai.css

   使い方：
     Taikai.mount(root, store)
     store = {
       get() → state, set(patch),
       playRealMatch?(table, ctx) → Promise<[{chara, place}, ...]>
     }

   自分が座る卓だけ実対局、他の卓は simulateTable で確率処理する
   （引き継ぎ書 §3）。store.playRealMatch を渡さなければ自分の卓も
   simulateTable で処理するので、実対局を繋ぐ前でも大会の流れは通る。

   実対局を繋ぐときは playRealMatch を次の形で書く：

     async playRealMatch(table, ctx) {
       const g = new Game(UI, { length: 'tonpuu' });
       // 席順は table のとおり。自分（id 0）を seat 0 に置く
       table.forEach((c, i) => {
         if (c.id === 0) return;                       // 人間は係数を持たない
         g.players[i].ai = paramsOf(c, STYLES);        // ← これで打ち筋が反映される
         g.players[i].name = c.name;
       });
       await g.run();
       return g.rankings().map((r, i) => ({ chara: table[r.seat], place: i + 1 }));
     }

   p.ai を入れないと従来どおりの打ち方になる（全員同じ）。

   state（すべてidで保存）：
     money        所持金
     playerRank   プレイヤーの段位（出られる大会が広がる）
     team         仲間3人のid
     comp         { id: 完成度 }
     recent       直近の大会で当たった相手のid（再戦しにくくする）
     records      { tierId: { entries, best } }
   ============================================================ */

const Taikai = (() => {
  'use strict';

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const pad3 = (id) => String(id).padStart(3, '0');
  const yen = (n) => n.toLocaleString('ja-JP') + '円';

  /* プレイヤーの段位ごとの実力の目安。人間なので係数は動かせない（引き継ぎ書 §3）。
     自動処理される卓での扱いにだけ使う */
  const PLAYER_STRENGTH = { D: 46, C: 54, B: 62, A: 70, S: 78 };
  const RANK_ORDER = ['D', 'C', 'B', 'A', 'S'];
  /* 段位を上げるのに必要な優勝回数（D→C, C→B, B→A, A→S） */
  const WINS_TO_PROMOTE = [2, 3, 4, 6];

  /* 賞金の配分。tier.prize を優勝賞金として、そこからの割合。
     四人とも別々に出るので、一人ぶんの期待値を4倍した額が事務所の収入になる。
     負け残りを厚くすると出るだけで儲かってしまうので、下位は薄くしてある */
  const PAYOUT = [
    { key: 'win',    label: '優勝',   rate: 1.00 },
    { key: 'second', label: '準優勝', rate: 0.32 },
    { key: 'final',  label: '決勝卓', rate: 0.12 },
    { key: 'semi',   label: '準決勝', rate: 0.035 },
    { key: 'first',  label: '一回戦', rate: 0.008 },
  ];

  /* 出場資格。大会の band に自分の段位が入っていれば出られる */
  function canEnter(tierId, playerRank) {
    const t = TOURNAMENTS[tierId];
    if (!t.strict) {
      // 格上の大会は「band の一番下」から出られる
      const min = t.band.reduce((a, r) => Math.min(a, RANK_ORDER.indexOf(r)), 9);
      return RANK_ORDER.indexOf(playerRank) >= min;
    }
    return t.band.includes(playerRank);
  }

  /* ------------------------------------------------------------
     大会を1回まわす。画面を持たない純粋な進行なのでテストできる
  ------------------------------------------------------------ */
  /* 組み合わせだけ作る。出走表を見せてから打ち始めたいので、
     ここでは対局を進めない（実対局が出走表より先に始まってしまう） */
  function prepare(tierId, opts) {
    const tier = TOURNAMENTS[tierId];
    const field = buildField(tierId, opts.team, opts.pool, {
      STYLES, region: tier.byRegion ? opts.region : null, recent: opts.recent || [],
    });
    return { tierId, tier, field, team: opts.team };
  }

  /* 組んだ枠で実際に勝ち上がりを進める */
  async function runTournament(prepared, opts) {
    const { tier, tierId, field, team } = prepared;

    const teamIds = new Set(team.map((c) => c.id));
    const rounds = [];
    let alive = field.slice();
    const eliminatedAt = new Map();         // id → 敗退したラウンド番号
    const lastPlace = new Map();            // id → 最後に打った卓での着順（育成に使う）
    const met = new Set();                  // 当たった相手（次回の抑制に使う）
    const beaten = new Set();               // 同じ卓で自分より下だった相手（契約条件に使う）

    let ri = 0;
    while (alive.length > 4) {
      const tables = makeTables(alive);
      const results = [];
      for (const t of tables) {
        const hasPlayer = t.some((c) => c.id === 0);
        if (hasPlayer) t.forEach((c) => { if (c.id !== 0) met.add(c.id); });
        /* 実対局が用意されていない、または「自動で処理する」設定のときは
           playRealMatch が何も返さないので、そのまま数値処理に落とす */
        let r = null;
        if (hasPlayer && opts.playRealMatch) {
          r = await opts.playRealMatch(t, { round: ri, tier, name: roundName(alive.length) });
        }
        if (!r) r = simulateTable(t, STYLES);
        if (hasPlayer) recordBeaten(r, beaten);
        results.push({ table: t, result: r, hasPlayer, hasTeam: t.some((c) => teamIds.has(c.id)) });
      }
      rounds.push({ name: roundName(alive.length), size: alive.length, results });

      const next = [];
      for (const r of results) {
        for (const x of r.result) {
          lastPlace.set(x.chara.id, x.place);
          if (x.place === 1) next.push(x.chara);
          else eliminatedAt.set(x.chara.id, ri);
        }
      }
      alive = next;
      ri++;
    }

    /* 決勝卓 */
    const finalTable = alive;
    const hasPlayer = finalTable.some((c) => c.id === 0);
    if (hasPlayer) finalTable.forEach((c) => { if (c.id !== 0) met.add(c.id); });
    let finalResult = null;
    if (hasPlayer && opts.playRealMatch) {
      finalResult = await opts.playRealMatch(finalTable, {
        round: ri, tier, name: '決勝卓', isFinal: true,
      });
    }
    if (!finalResult) finalResult = simulateTable(finalTable, STYLES);
    if (hasPlayer) recordBeaten(finalResult, beaten);
    finalResult.forEach((x) => lastPlace.set(x.chara.id, x.place));
    rounds.push({
      name: '決勝卓', size: 4, isFinal: true,
      results: [{ table: finalTable, result: finalResult, hasPlayer, hasTeam: finalTable.some((c) => teamIds.has(c.id)) }],
    });

    /* 各人の最終成績を出す */
    const totalRounds = rounds.length;          // 決勝卓を含む
    function outcomeOf(id) {
      const fin = finalResult.find((x) => x.chara.id === id);
      if (fin) {
        if (fin.place === 1) return { key: 'win', label: '優勝', place: 1 };
        if (fin.place === 2) return { key: 'second', label: '準優勝', place: 2 };
        return { key: 'final', label: `決勝卓${fin.place}位`, place: fin.place };
      }
      const at = eliminatedAt.get(id);
      if (at === undefined) return null;
      // 最後から2番目のラウンドで敗退 → 準決勝敗退
      if (at === totalRounds - 2) return { key: 'semi', label: '準決勝敗退', place: null };
      return { key: 'first', label: `${rounds[at].name}敗退`, place: null };
    }

    const placeOf = (id) => lastPlace.get(id) || 4;
    return {
      tier, tierId, field, rounds, finalResult, outcomeOf, placeOf,
      met: [...met], beaten: [...beaten],
    };
  }

  /* 同じ卓で自分より着順が下だった相手を控えておく。
     「ライバル撃破が条件」の雀ドルの判定に使う */
  function recordBeaten(result, into) {
    const me = result.find((x) => x.chara.id === 0);
    if (!me) return;
    result.forEach((x) => { if (x.chara.id !== 0 && x.place > me.place) into.add(x.chara.id); });
  }

  /* 賞金。チーム全員ぶんを合算する */
  function prizeFor(run, team) {
    const rows = team.map((c) => {
      const o = run.outcomeOf(c.id);
      const rate = o ? (PAYOUT.find((p) => p.key === o.key) || {}).rate || 0 : 0;
      return { chara: c, outcome: o, amount: Math.round(run.tier.prize * rate) };
    });
    return { rows, total: rows.reduce((a, r) => a + r.amount, 0) };
  }

  /* ------------------------------------------------------------
     画面
  ------------------------------------------------------------ */
  function mount(root, store) {
    ensureSilVar();
    root.innerHTML = '';
    root.classList.add('tkRoot');

    let screen = 'select';
    let run = null, prize = null, growth = null, lastPromotion = null;

    const ALL = () => JANDOLS.concat(FREE_AGENTS);

    function playerCard() {
      const st = store.get();
      return Object.assign({}, PLAYER, {
        name: st.playerName || PLAYER.name,
        face: Title.normalizeFace(st.playerFace),
        isPlayer: true,
        rank: st.playerRank || 'D',
        playerStrength: PLAYER_STRENGTH[st.playerRank || 'D'],
      });
    }
    function teamCards() {
      const st = store.get();
      const mates = (st.team || []).map((id) => {
        const base = ALL().find((c) => c.id === id);
        if (!base) return null;
        return Object.assign({}, base, {
          comp: st.comp[id] != null ? st.comp[id] : base.comp,
          compMax: (st.compMax || {})[id],
          rank: (st.grades || {})[id] || base.rank,
        });
      }).filter(Boolean);
      return [playerCard()].concat(mates);
    }
    function poolCards() {
      const st = store.get();
      const teamIds = new Set([0].concat(st.team || []));
      return ALL().filter((c) => !teamIds.has(c.id)).map((c) => {
        const comp = st.comp[c.id];
        return comp != null ? Object.assign({}, c, { comp }) : Object.assign({}, c);
      });
    }

    /* ---------- 大会を選ぶ ---------- */
    function renderSelect() {
      const st = store.get();
      const rank = st.playerRank || 'D';
      const team = teamCards();
      const ready = team.length === 4;

      const cards = Object.keys(TOURNAMENTS).map((id) => {
        const t = TOURNAMENTS[id];
        const ok = canEnter(id, rank);
        const rec = (st.records || {})[id];
        return `<button type="button" class="tkTier${ok ? '' : ' locked'}" data-tier="${id}"
            ${ok && ready ? '' : 'disabled'}>
          <span class="tkTierHead">
            <span class="tkTierName">${esc(t.name)}</span>
            <span class="tkTierSize">${t.size}人</span>
          </span>
          <span class="tkTierNote">${esc(t.note)}</span>
          <span class="tkTierFoot">
            <span class="tkPrize">優勝 ${yen(t.prize)}</span>
            <span class="tkBand">${t.band.join('・')}級${t.strict ? 'のみ' : '中心'}</span>
          </span>
          ${rec ? `<span class="tkRec">出場${rec.entries}回　最高 ${esc(rec.best)}</span>` : ''}
          ${ok ? '' : `<span class="tkLock">${t.band[0]}級から出場できます</span>`}
        </button>`;
      }).join('');

      root.innerHTML = `
        <div class="tkHead">
          <h1 class="tkTitle">大会に出る</h1>
          <div class="tkStatus">
            <span class="tkStat money">所持金 <b>${yen(st.money || 0)}</b></span>
            <span class="tkStat">${esc(st.playerName || 'あなた')}の段位 <b>${rank}</b></span>
          </div>
        </div>
        ${ready ? '' : `<p class="tkWarn">先にチームを組んでください。あなたを含めて四人で出場します。</p>`}
        <div class="tkRoster">${team.map((c) => `<span class="tkChip">${esc(c.name)}</span>`).join('')}</div>
        <div class="tkTiers">${cards}</div>
        <section class="tkSettings">
          <h2 class="tkSecT">対局の設定</h2>
          <div class="tkSetRow">
            <span class="tkSetLabel">自分の卓</span>
            <span class="tkSeg">
              <button type="button" data-set="auto:0" aria-pressed="${!st.autoMatch}">自分で打つ</button>
              <button type="button" data-set="auto:1" aria-pressed="${!!st.autoMatch}">自動で処理</button>
            </span>
          </div>
          <div class="tkSetRow">
            <span class="tkSetLabel">進む速さ</span>
            <span class="tkSeg">
              ${[[900, 'ゆっくり'], [520, 'ふつう'], [200, '速い'], [0, '最速']].map(([v, n]) =>
                `<button type="button" data-set="speed:${v}"
                  aria-pressed="${(st.matchSpeed === undefined ? 520 : st.matchSpeed) === v}">${n}</button>`).join('')}
            </span>
          </div>
          <div class="tkSetRow">
            <span class="tkSetLabel">補助表示</span>
            <span class="tkSeg">
              <button type="button" data-set="hint:1" aria-pressed="${st.showHints !== false}">出す</button>
              <button type="button" data-set="hint:0" aria-pressed="${st.showHints === false}">出さない</button>
            </span>
          </div>
          <p class="tkHint">${st.autoMatch
            ? 'すべての卓を結果だけで処理します。'
            : '自分が座る卓だけ実際に打ちます。他の卓は結果だけが出ます。'}
            シャンテン数と危険度の目安が補助表示です。</p>
        </section>`;
    }

    /* ---------- 出走表 ---------- */
    function renderField() {
      const st = store.get();
      const teamIds = new Set([0].concat(st.team || []));
      const byRank = {};
      prepared.field.forEach((c) => {
        const r = c.id === 0 ? '—' : gradeOf(c.comp != null ? c.comp : compFromRank(c.rank));
        (byRank[r] = byRank[r] || []).push(c);
      });
      const order = ['S', 'A', 'B', 'C', 'D', '—'];
      const groups = order.filter((r) => byRank[r]).map((r) => `
        <div class="tkGroup">
          <div class="tkGroupT">${r === '—' ? 'あなた' : r + '級'}　<span>${byRank[r].length}名</span></div>
          <div class="tkNames">${byRank[r].map((c) =>
            `<span class="tkName${teamIds.has(c.id) ? ' own' : ''}">${esc(c.name)}</span>`).join('')}</div>
        </div>`).join('');

      root.innerHTML = `
        <div class="tkHead"><h1 class="tkTitle">${esc(prepared.tier.name)}　出走表</h1>
          <div class="tkStatus"><span class="tkStat">${prepared.field.length}名</span></div></div>
        <p class="tkHint">金色があなたの事務所の四人です。</p>
        ${groups}
        <button type="button" class="tkGo" data-act="start">卓に着く</button>`;
    }

    /* ---------- 進行 ---------- */
    function renderRounds() {
      const st = store.get();
      const teamIds = new Set([0].concat(st.team || []));

      const blocks = run.rounds.map((rd) => {
        /* 決勝卓は自事務所がいなくても必ず見せる。優勝者が分からなくなる */
        const own = rd.isFinal ? rd.results : rd.results.filter((r) => r.hasTeam);
        const ownHTML = own.map((r) => {
          const rows = r.result.map((x) => `
            <div class="tkSeatRow${teamIds.has(x.chara.id) ? ' own' : ''}">
              <span class="tkPlace p${x.place}">${x.place}位</span>
              <span class="tkSeatName">${esc(x.chara.name)}</span>
              <span class="tkSeatStyle">${x.chara.id === 0 ? '' : esc(STYLES[x.chara.style].name)}</span>
            </div>`).join('');
          const label = rd.isFinal
            ? (r.hasPlayer ? 'あなたの決勝卓' : '決勝卓')
            : (r.hasPlayer ? 'あなたの卓' : '仲間の卓');
          return `<div class="tkTable${r.hasPlayer ? ' mine' : ''}">
            <div class="tkTableT">${label}</div>${rows}</div>`;
        }).join('');

        const others = rd.results.length - own.length;
        return `<section class="tkRound">
          <h2 class="tkRoundT">${esc(rd.name)}<span>${rd.size}名 / ${rd.results.length}卓</span></h2>
          ${ownHTML || '<p class="tkQuiet">この回戦に残っている自事務所の雀ドルはいません。</p>'}
          ${others > 0 ? `<p class="tkQuiet">他 ${others}卓は同時に進行しました。</p>` : ''}
        </section>`;
      }).join('');

      root.innerHTML = `
        <div class="tkHead"><h1 class="tkTitle">${esc(run.tier.name)}</h1></div>
        ${blocks}
        <button type="button" class="tkGo" data-act="result">結果を見る</button>`;
    }

    /* ---------- 結果 ---------- */
    function renderResult() {
      const rows = prize.rows.map((r) => `
        <div class="tkPrizeRow">
          <span class="tkPrizeName">${esc(r.chara.name)}</span>
          <span class="tkPrizeOut">${r.outcome ? esc(r.outcome.label) : '不出場'}</span>
          <span class="tkPrizeYen">${r.amount ? yen(r.amount) : '—'}</span>
        </div>`).join('');

      const gr = growth.length ? `
        <h2 class="tkSecT">育成</h2>
        ${growth.map((g) => `
          <div class="tkGrowRow">
            <span class="tkGrowName">${esc(g.name)}</span>
            <span class="tkTrack"><span class="tkFill" style="width:${Math.round(g.after)}%"></span></span>
            <span class="tkGrowNum">完成度 ${g.before.toFixed(1)} → ${g.after.toFixed(1)}<span class="tkCeil">／上限 ${Math.round(g.ceiling)}</span></span>
          </div>
          ${g.promoted ? `<div class="tkPromote">${esc(g.name)} が ${g.promoted}級に上がりました</div>` : ''}
        `).join('')}` : '';

      const st = store.get();
      const promo = lastPromotion
        ? `<div class="tkPromote">あなたの段位が ${lastPromotion}級に上がりました。出られる大会が増えます。</div>`
        : '';
      root.innerHTML = `
        <div class="tkHead"><h1 class="tkTitle">${esc(run.tier.name)}　結果</h1></div>
        <div class="tkChampion">優勝　${esc(run.finalResult[0].chara.name)}</div>
        ${promo}
        <h2 class="tkSecT">賞金</h2>
        ${rows}
        <div class="tkPrizeTotal">合計 <b>${yen(prize.total)}</b>　／　所持金 ${yen(st.money || 0)}</div>
        ${gr}
        <button type="button" class="tkGo" data-act="back">大会を選ぶ</button>`;
    }

    /* ---------- 進行の実処理 ---------- */
    let prepared = null;

    function start(tierId) {
      const st = store.get();
      prepared = prepare(tierId, {
        team: teamCards(), pool: poolCards(),
        region: st.region || (teamCards()[1] || {}).region || null,
        recent: st.recent || [],
      });
      run = null;
      screen = 'field';
      renderField();
    }

    /* 「卓に着く」を押してから対局に入る。
       自分の卓は実対局、他の卓は数値処理（taikai の runTournament が振り分ける） */
    async function playRounds() {
      root.innerHTML = `<p class="tkQuiet tkLoading">卓が立ちました…</p>`;
      run = await runTournament(prepared, { playRealMatch: store.playRealMatch });
      screen = 'rounds';
      renderRounds();
    }

    function finish() {
      const st = store.get();
      const team = teamCards();
      prize = prizeFor(run, team);

      /* 育成。仲間だけ（プレイヤーは係数を持たない）。
         compMax は必ず保存すること。毎回 comp + pot で計算し直すと
         天井が現在地に付いて回り、際限なく上がってしまう（引き継ぎ書 §4 の罠） */
      const comp = Object.assign({}, st.comp);
      const compMax = Object.assign({}, st.compMax || {});
      const grades = Object.assign({}, st.grades || {});
      growth = [];
      team.filter((c) => c.id !== 0).forEach((c) => {
        const o = run.outcomeOf(c.id);
        if (!o) return;
        const target = Object.assign({}, c, {
          comp: comp[c.id] != null ? comp[c.id] : c.comp,
          compMax: compMax[c.id],
          rank: grades[c.id] || c.rank,
        });
        const before = target.comp;
        const res = addExp(target, run.placeOf(c.id), run.tier.stage);
        comp[c.id] = target.comp;
        compMax[c.id] = target.compMax;
        grades[c.id] = target.rank;
        growth.push({
          name: c.name, before, after: target.comp,
          ceiling: target.compMax, promoted: res.promoted,
        });
      });

      /* プレイヤーの段位。人間なので係数は動かせない（引き継ぎ書 §3）。
         優勝を重ねると上がり、出られる大会が広がる。
         優勝1回ごとに上げると四回でS級になってしまうので、段ごとに必要数を増やす */
      const mine = run.outcomeOf(0);
      let playerRank = st.playerRank || 'D';
      let playerWins = st.playerWins || 0;
      let promotedRank = null;
      if (mine && mine.key === 'win') {
        playerWins += 1;
        const i = RANK_ORDER.indexOf(playerRank);
        if (i < RANK_ORDER.length - 1 && playerWins >= WINS_TO_PROMOTE[i]) {
          playerRank = RANK_ORDER[i + 1];
          playerWins = 0;
          promotedRank = playerRank;
        }
      }

      const records = Object.assign({}, st.records || {});
      const rec = records[run.tierId] || { entries: 0, best: '—' };
      rec.entries += 1;
      const bestRank = (label) => PAYOUT.findIndex((p) => p.label === label);
      if (mine && (rec.best === '—' || PAYOUT.findIndex((p) => p.key === mine.key) < bestRank(rec.best))) {
        rec.best = (PAYOUT.find((p) => p.key === mine.key) || {}).label || rec.best;
      }
      records[run.tierId] = rec;

      /* 撃破した相手は積み上げる（一度勝てば条件は満たしたまま） */
      const beaten = Array.from(new Set((st.beaten || []).concat(run.beaten)));

      store.set({
        money: (st.money || 0) + prize.total,
        comp, compMax, grades, playerRank, playerWins, records, beaten,
        recent: run.met.slice(0, 40),
      });
      lastPromotion = promotedRank;
      screen = 'result';
      renderResult();
    }

    /* ---------- 操作 ---------- */
    root.addEventListener('click', (e) => {
      const set = e.target.closest('[data-set]');
      if (set) {
        const [key, val] = set.dataset.set.split(':');
        if (key === 'auto') store.set({ autoMatch: val === '1' });
        if (key === 'speed') store.set({ matchSpeed: Number(val) });
        if (key === 'hint') store.set({ showHints: val === '1' });
        renderSelect();
        return;
      }
      const tier = e.target.closest('[data-tier]');
      if (tier && !tier.disabled) { start(tier.dataset.tier); return; }
      const act = e.target.closest('[data-act]');
      if (!act) return;
      if (act.dataset.act === 'start') { playRounds(); }
      else if (act.dataset.act === 'result') finish();
      else if (act.dataset.act === 'back') { screen = 'select'; renderSelect(); }
    });

    renderSelect();
    return { refresh: () => { if (screen === 'select') renderSelect(); } };
  }

  function ensureSilVar() {
    if (document.documentElement.style.getPropertyValue('--sil-img')) return;
    const svg = encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<g fill="#0d1f1a"><circle cx="50" cy="30" r="17"/>' +
      '<path d="M14 100 C17 66 36 54 50 54 C64 54 83 66 86 100 Z"/></g></svg>'
    );
    document.documentElement.style.setProperty('--sil-img', `url("data:image/svg+xml,${svg}")`);
  }

  return { mount, prepare, runTournament, prizeFor, canEnter, PAYOUT, PLAYER_STRENGTH };
})();

/* ===== scout.js ===== */
/* ============================================================
   スカウト — scout.js
   依存：characters.js / tournament.js / meikan.css / scout.css

   使い方：
     Scout.mount(root, store)

   やること二つ：
     探す   … 地域を選んで足を運び、未発見の雀ドルを見つける
     口説く … 発見済みの雀ドルの契約条件を判定して、満たしていれば契約する

   契約条件（characters.js の CONTRACTS）の判定はすべて
   evaluate() に集約してある。純粋関数なのでテストできる。

   state に足すもの：
     agency   事務所ランク 1〜5（定員と、契約できる相手が広がる）
     beaten   同じ卓で自分より下だった相手のid（taikai.js が記録する）
     scouted  この画面で使った探索回数（地域ごと）
   ============================================================ */

const Scout = (() => {
  'use strict';

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const pad3 = (id) => String(id).padStart(3, '0');
  const yen = (n) => n.toLocaleString('ja-JP') + '円';
  const RANK_ORDER = ['D', 'C', 'B', 'A', 'S'];

  /* ---------- 事務所 ---------- */
  /* 賞金の使い道であり、上位の雀ドルに手が届くようになる段階でもある */
  const AGENCY = [
    { lv: 1, name: '雑居ビルの一室', capacity: 4,  cost: 0 },
    { lv: 2, name: '駅前の小さな事務所', capacity: 6,  cost: 3000000 },
    { lv: 3, name: '看板を出せる事務所', capacity: 8,  cost: 9000000 },
    { lv: 4, name: '一棟借りの事務所',   capacity: 11, cost: 25000000 },
    { lv: 5, name: '業界に名の通った事務所', capacity: 14, cost: 60000000 },
  ];
  const agencyOf = (lv) => AGENCY[Math.max(0, Math.min(AGENCY.length - 1, (lv || 1) - 1))];

  /* ---------- 探索 ---------- */
  const SCOUT_COST = 30000;         // 一度足を運ぶ費用

  /* ---------- 契約条件の判定 ----------
     返り値 { ok, label, detail }
     ok=false のときは detail に「あと何が足りないか」を入れる     */
  function evaluate(chara, st, roster) {
    const info = RANK_INFO[chara.rank];
    const agency = st.agency || 1;
    const money = st.money || 0;

    /* 共通の前提：事務所ランクと定員 */
    if (agency < info.minAgency) {
      return { ok: false, label: '事務所が小さい',
        detail: `${chara.rank}級と契約するには事務所ランク${info.minAgency}が必要です。`, cost: null };
    }
    if (roster.length >= agencyOf(agency).capacity) {
      return { ok: false, label: '定員いっぱい',
        detail: `いまの事務所は${agencyOf(agency).capacity}人までです。`, cost: null };
    }

    const cost = costOf(chara);
    const rule = RULES[chara.contract];
    const res = rule ? rule(chara, st, roster) : { ok: true, detail: '' };
    if (!res.ok) return { ok: false, label: CONTRACTS[chara.contract], detail: res.detail, cost };
    if (money < cost) {
      return { ok: false, label: '資金が足りない',
        detail: `あと ${yen(cost - money)} 必要です。`, cost };
    }
    return { ok: true, label: res.detail || CONTRACTS[chara.contract], detail: '', cost };
  }

  /* 契約金。free は「条件なし」であって「ただ」ではない。
     0円にすると cheap（半額）より安くなって逆転する */
  function costOf(chara) {
    const base = RANK_INFO[chara.rank].scoutCost;
    if (chara.contract === 'cheap') return Math.round(base * 0.5);
    if (chara.contract === 'money') return base * 2;
    return base;
  }

  /* 条件ごとの判定。数値は後から触りやすいよう一か所にまとめてある */
  const POP_NEEDED = { S: 480, A: 320, B: 190, C: 90, D: 40 };
  const RESULT_NEEDED = { S: 'eight', A: 'title', B: 'open', C: 'local', D: 'rookie' };

  const RULES = {
    free:  () => ({ ok: true, detail: '相場どおりで契約できます' }),
    cheap: () => ({ ok: true, detail: '低額で契約できます' }),
    money: () => ({ ok: true, detail: '相場の倍を要求されています' }),

    rank: (c, st) => {
      const need = RANK_INFO[c.rank].minAgency;
      return (st.agency || 1) >= need
        ? { ok: true, detail: `事務所ランク${need}を満たしています` }
        : { ok: false, detail: `事務所ランク${need}が必要です。` };
    },

    result: (c, st) => {
      const tierId = RESULT_NEEDED[c.rank];
      const rec = (st.records || {})[tierId];
      const won = rec && rec.best === '優勝';
      return won
        ? { ok: true, detail: `${TOURNAMENTS[tierId].name}の優勝を認めています` }
        : { ok: false, detail: `${TOURNAMENTS[tierId].name}で優勝すると話を聞いてもらえます。` };
    },

    pop: (c, st, roster) => {
      const need = POP_NEEDED[c.rank];
      const have = roster.reduce((a, x) => a + (x.pop || 0), 0);
      return have >= need
        ? { ok: true, detail: `事務所の人気${have}が届いています` }
        : { ok: false, detail: `事務所の人気が${need}必要です（いま${have}）。` };
    },

    aisho: (c, st, roster) => {
      const same = roster.find((x) => x.region === c.region);
      return same
        ? { ok: true, detail: `同郷の${same.name}が話をつけてくれました` }
        : { ok: false, detail: `${c.region}の雀ドルが事務所にいると話が早くなります。` };
    },

    rival: (c, st) => {
      const beaten = st.beaten || [];
      return beaten.includes(c.id)
        ? { ok: true, detail: '直接倒した相手です' }
        : { ok: false, detail: '大会で同じ卓に着き、自分より下の着順に沈めてください。' };
    },

    area: (c, st, roster) => {
      const covered = new Set(roster.map((x) => x.region));
