<style>
/* ===== title.css ===== */
/* ============================================================
   title.css — トップページとプレイヤー設定
   ============================================================ */

.ttRoot{width:100%;max-width:760px;margin:0 auto;padding:0 0 30px}

/* ---------- 表紙 ----------
   絵はすべて #cover のcanvasが描く。
   PLiCyはcanvasの中身しかサムネイルに撮らないため、
   顔の壁も題字もDOMではなくcanvas側にある。            */
#coverWrap{
  display:none;                 /* 表紙のときだけ出す。撮影用にDOMからは消さない */
  width:100%;line-height:0;border-bottom:1px solid var(--gold-dim);
  background:#081010;
}
#cover{width:100%;height:auto;display:block}
body.onTitle #coverWrap{display:block}

/* ---------- 本体 ---------- */
.ttBody{padding:16px 12px 0}

.ttActions{display:grid;gap:9px;margin-bottom:16px}
.ttBtn{
  display:block;width:100%;padding:14px;cursor:pointer;border-radius:5px;
  font-family:var(--maru);font-weight:800;font-size:16px;letter-spacing:.05em;
  border:1px solid var(--gold-lo);color:var(--ink);
  background:linear-gradient(150deg,var(--gold-hi),var(--gold) 42%,var(--gold-lo));
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 10px rgba(0,0,0,.5);
}
.ttBtn.ghost{
  background:transparent;color:var(--ivory-2);border-color:var(--gold-dim);
  box-shadow:none;font-size:14px;padding:11px;
}
.ttBtn:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

/* 事務所の現状 */
.ttState{
  border:1px solid var(--gold-dim);border-radius:6px;padding:11px 13px;margin-bottom:14px;
  background:linear-gradient(var(--urushi-2),rgba(19,36,32,.4));
}
.ttStateT{font-family:var(--maru);font-weight:700;font-size:12px;color:var(--gold);letter-spacing:.05em;margin-bottom:7px}
.ttStateRow{display:flex;flex-wrap:wrap;gap:6px}
.ttStateItem{
  font-size:11.5px;color:var(--muted);
  border:1px solid var(--gold-dim);border-radius:3px;padding:3px 8px;background:rgba(0,0,0,.28);
}
.ttStateItem b{font-family:var(--maru);font-weight:800;font-size:13.5px;color:var(--ivory);margin:0 2px}
.ttRoster{display:flex;gap:5px;margin-top:9px}
.ttRoster span{
  width:44px;height:58px;border-radius:3px;overflow:hidden;display:block;
  border:1px solid var(--gold-dim);background:linear-gradient(160deg,var(--back),var(--back-2));
}
.ttRoster img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}

.ttLead{font-size:12.5px;color:var(--muted);line-height:1.8;margin:0 2px 14px}
.ttFoot{
  font-family:var(--maru);font-weight:700;font-size:11.5px;color:var(--muted);
  letter-spacing:.03em;text-align:center;margin:18px 0 0;opacity:.75;
}
/* 表紙は縦に間延びしやすいので、中身を上下に散らさず上に寄せる */
body.onTitle #view{min-height:0}

/* ---------- プレイヤー設定 ---------- */
.ttSetup{padding:14px 12px 0}
.ttSetupT{
  font-family:var(--maru);font-weight:800;font-size:22px;letter-spacing:.03em;margin:0 0 6px;
  background:var(--kin);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.ttField{margin:16px 0 6px}
.ttLabel{
  display:block;font-family:var(--maru);font-weight:700;font-size:12.5px;color:var(--gold);
  letter-spacing:.07em;margin-bottom:6px;
}
.ttInput{
  width:100%;padding:11px 12px;border-radius:4px;
  font-family:var(--maru);font-weight:800;font-size:17px;letter-spacing:.03em;
  border:1px solid var(--gold-dim);background:rgba(0,0,0,.35);color:var(--ivory);
}
.ttInput:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.ttNote{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}

/* 12枚。4列3行で一画面に収まる */
.ttFaces{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:560px){.ttFaces{grid-template-columns:repeat(6,1fr)}}
.ttFace{
  position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;cursor:pointer;
  border:1px solid var(--gold-dim);background:linear-gradient(160deg,var(--back),var(--back-2));
  padding:0;width:100%;
}
.ttFace img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block;position:relative;z-index:1}
.ttFace.sil::after{
  content:"";position:absolute;inset:0;z-index:0;
  background:var(--sil-img) center 62%/78% no-repeat;opacity:.85;
}
.ttFace[aria-pressed="true"]{
  border-color:var(--gold);
  box-shadow:inset 0 0 0 1px var(--urushi-3),inset 0 0 0 2px var(--gold),0 0 12px rgba(201,162,74,.3);
}
.ttFace[aria-pressed="true"]::before{
  content:"選択";position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:2px 0;text-align:center;
  font-family:var(--maru);font-weight:800;font-size:9.5px;letter-spacing:.06em;
  color:var(--ink);background:var(--gold);
}
.ttFace:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

@media(min-width:560px){
  .ttWall{grid-template-columns:repeat(8,1fr)}
}

<!-- 表紙の絵。PLiCyのサムネイルはこのcanvasの中身を撮る。

<script>
/* ===== title.js ===== */
/* ============================================================
   トップページとプレイヤー設定 — title.js
   依存：characters.js / theme.css / meikan.css / title.css

   使い方：
     Title.mount(root, store)
     store は { get, set, onStart(), onContinue() } を持つ。

   プレイヤーも女性の雀士。開始時に名前と顔を決める。
   顔は img/p1.webp 〜 p4.webp を読む。無ければシルエットに落ちるので、
   画像が届く前でも最後まで通る。

   state に足すもの：
     playerName  プレイヤーの名前
     playerFace  'p01'〜'p12'（画像のファイル名。idではないので雀ドルの番号と衝突しない）
   ============================================================ */

const Title = (() => {
  'use strict';

  const esc = (s) => String(s).replace(/[&<>"']/g,
    (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const pad3 = (id) => String(id).padStart(3, '0');
  const yen = (n) => n.toLocaleString('ja-JP') + '円';

  /* 顔の候補。増やすときはここに足して img/<key>.webp を置くだけ */
  const FACES = [
    { key: 'p01', note: '黒髪のボブ・黒いニット' },
    { key: 'p02', note: '黒髪のロング・トレンチコート' },
    { key: 'p03', note: '茶髪のショート・グレーの上着' },
    { key: 'p04', note: '黒髪のポニーテール・白いシャツ' },
    { key: 'p05', note: '黒髪のボブ・黒いリブ' },
    { key: 'p06', note: '黒髪のボブ・振り返り' },
    { key: 'p07', note: '黒髪のロング・正面' },
    { key: 'p08', note: '黒髪のロング・やわらかい表情' },
    { key: 'p09', note: '茶髪のショート・微笑み' },
    { key: 'p10', note: '茶髪のまとめ髪・微笑み' },
    { key: 'p11', note: 'ポニーテール・腕時計' },
    { key: 'p12', note: 'ポニーテール・腕組み' },
  ];
  const DEFAULT_FACE = 'p01';

  const DEFAULT_NAME = '沢渡 ちはる';

  /* 表紙の題字。PLiCyのサムネイルはcanvasの中身だけを撮るので、
     表紙の絵はDOMではなくcanvasに描く（公式FAQ：
     「スクリーンショットにはCanvas以外の内容は撮影されません」）。
     canvasは常にDOMに置いたままにして、いつ撮影されても絵が出るようにする。 */
  const TITLE = '雀ドル発掘放浪記';
  const SUBTITLE = 'その雀荘に、まだ見ぬ雀ドルがいる';

  /* 4:3。サムネイルの縦横比がそのままこの比率になる */
  const COVER_W = 1200, COVER_H = 900;
  const COVER_COLS = 6, COVER_ROWS = 3;

  function loadImage(src) {
    return new Promise((resolve) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = src;
    });
  }

  async function drawCover(canvas, ids) {
    const g = canvas.getContext('2d');
    canvas.width = COVER_W; canvas.height = COVER_H;

    /* 下地。画像が一枚も読めなくても成立するように先に塗る */
    g.fillStyle = '#0d1f1a';
    g.fillRect(0, 0, COVER_W, COVER_H);

    const cw = COVER_W / COVER_COLS, ch = COVER_H / COVER_ROWS;
    const imgs = await Promise.all(ids.slice(0, COVER_COLS * COVER_ROWS).map(loadImage));

    imgs.forEach((im, n) => {
      const x = (n % COVER_COLS) * cw, y = Math.floor(n / COVER_COLS) * ch;
      if (!im) { g.fillStyle = '#164236'; g.fillRect(x, y, cw, ch); return; }
      /* cover 相当。顔が上寄りなので少し上を残して切る */
      const s = Math.max(cw / im.width, ch / im.height);
      const dw = im.width * s, dh = im.height * s;
      g.drawImage(im, x + (cw - dw) / 2, y + (ch - dh) * 0.12, dw, dh);
    });

    /* 上下から漆をかけて題字を乗せる場所を作る */
    const veil = g.createLinearGradient(0, 0, 0, COVER_H);
    veil.addColorStop(0, 'rgba(8,16,16,.30)');
    veil.addColorStop(0.24, 'rgba(8,16,16,.04)');
    veil.addColorStop(0.52, 'rgba(8,16,16,.42)');
    veil.addColorStop(0.78, 'rgba(8,16,16,.90)');
    veil.addColorStop(1, '#081010');
    g.fillStyle = veil;
    g.fillRect(0, 0, COVER_W, COVER_H);

    /* 看板の灯り */
    const glow = g.createRadialGradient(COVER_W / 2, COVER_H * 0.76, 10,
                                        COVER_W / 2, COVER_H * 0.76, COVER_W * 0.46);
    glow.addColorStop(0, 'rgba(255,58,140,.24)');
    glow.addColorStop(1, 'rgba(255,58,140,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, COVER_W, COVER_H);

    const glow2 = g.createRadialGradient(COVER_W / 2, COVER_H * 0.90, 10,
                                         COVER_W / 2, COVER_H * 0.90, COVER_W * 0.34);
    glow2.addColorStop(0, 'rgba(60,220,255,.14)');
    glow2.addColorStop(1, 'rgba(60,220,255,0)');
    g.fillStyle = glow2;
    g.fillRect(0, 0, COVER_W, COVER_H);

    /* 題字。ネオン管に見えるよう、外側から内側へ重ねて描く */
    const fam = '"Maru","Hiragino Maru Gothic ProN","M PLUS Rounded 1c",sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';

    g.font = '800 118px ' + fam;
    const ty = COVER_H * 0.76;
    [[26, 'rgba(255,58,140,.95)'], [16, 'rgba(255,58,140,1)'], [6, '#ffffff']]
      .forEach(([blur, color]) => {
        g.shadowColor = color; g.shadowBlur = blur;
        g.fillStyle = '#ffe9f3';
        g.fillText(TITLE, COVER_W / 2, ty);
      });
    g.shadowBlur = 0;

    /* 副題は水色。看板の桃色に対して、店内の緑と反対側の色を当てる */
    g.font = '700 44px ' + fam;
    [[20, 'rgba(60,220,255,.95)'], [10, 'rgba(60,220,255,1)']].forEach(([blur, color]) => {
      g.shadowColor = color; g.shadowBlur = blur;
      g.fillStyle = '#c9f6ff';
      g.fillText(SUBTITLE, COVER_W / 2, ty + 74);
    });
    g.shadowBlur = 0;
  }

  /* 埋め込みフォントが届く前に描くと、丸ゴにならない */
  async function readyFont() {
    if (!document.fonts || !document.fonts.load) return;
    try {
      await Promise.all([
        document.fonts.load('800 118px Maru', TITLE),
        document.fonts.load('700 34px Maru', SUBTITLE),
      ]);
      await document.fonts.ready;
    } catch (e) { /* 読めなくても既定の書体で描く */ }
  }

  /* 外枠から呼ぶ。canvasは画面を移っても消さない */
  async function paintCover(canvas, st) {
    const ids = wallIds(st || {}, COVER_COLS * COVER_ROWS);
    await readyFont();
    await drawCover(canvas, ids.map((id) => `img/${pad3(id)}.webp`));
  }

  /* 表紙に並べる顔。発見済みがいればそこから、いなければ全員から選ぶ */
  function wallIds(st, n) {
    const found = (st.discovered || []).filter((id) => id <= 73);
    const pool = found.length >= n ? found : JANDOLS.map((c) => c.id);
    const out = [];
    const bag = pool.slice();
    while (out.length < n && bag.length) {
      out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
    }
    return out;
  }

  function faceSrc(key) { return `img/${normalizeFace(key)}.webp`; }

  /* 雀ドルの総数。characters.js に足せば自動で追随する。
     題字と副題に数を入れていないのも同じ理由（増やすたびに嘘になるうえ、
     埋め込みフォントは使う文字だけを切り出しているので数字を足すと崩れる） */
  function TOTAL() { return JANDOLS.length + FREE_AGENTS.length; }

  /* 候補を4枚から12枚に増やしたとき、古いセーブの p1〜p4 が
     別人を指してしまうので、知らないキーは既定に寄せる */
  function normalizeFace(key) {
    return FACES.some((f) => f.key === key) ? key : DEFAULT_FACE;
  }

  /* ------------------------------------------------------------
     マウント
  ------------------------------------------------------------ */
  function mount(root, store) {
    ensureSilVar();
    root.innerHTML = '';
    root.classList.add('ttRoot');

    let screen = 'top';
    let name = store.get().playerName || DEFAULT_NAME;
    let face = normalizeFace(store.get().playerFace);

    /* ---------- 表紙 ---------- */
    function renderTop() {
      const st = store.get();
      const started = !!st.teamDecided;
      let state = '';
      if (started) {
        const mates = (st.contracted || []).slice(0, 5);
        state = `<div class="ttState">
          <div class="ttStateT">事務所の様子</div>
          <div class="ttStateRow">
            <span class="ttStateItem">所属 <b>${(st.contracted || []).length}</b>人</span>
            <span class="ttStateItem">所持金 <b>${yen(st.money || 0)}</b></span>
            <span class="ttStateItem">段位 <b>${st.playerRank || 'D'}</b></span>
            <span class="ttStateItem">発見 <b>${(st.discovered || []).length}</b>／${TOTAL()}</span>
          </div>
          <div class="ttRoster">${mates.map((id) =>
            `<span><img src="img/${pad3(id)}.webp" alt="" onerror="this.remove()"></span>`).join('')}</div>
        </div>`;
      }

      /* 表紙の絵は #cover のcanvasが受け持つ。ここには文字を置かない */
      root.innerHTML = `
        <div class="ttBody">
          ${state}
          <p class="ttLead">全国の雀荘を歩いて雀ドルを見つけ、口説き、育てて、大会に出す。
            最後は最強の八人「雀エイト」を、あなたの事務所で独占する。</p>
          <div class="ttActions">
            ${started ? `<button type="button" class="ttBtn" data-act="continue">続きから</button>` : ''}
            <button type="button" class="ttBtn${started ? ' ghost' : ''}" data-act="new">
              ${started ? '最初からはじめる' : 'はじめる'}</button>
          </div>
          <p class="ttFoot">本格麻雀。イカサマなし、牌操作なし。</p>
        </div>`;
    }

    /* ---------- プレイヤー設定 ---------- */
    function renderSetup() {
      root.innerHTML = `
        <div class="ttSetup">
          <h1 class="ttSetupT">あなたのこと</h1>
          <p class="ttNote">事務所を開くのはあなたです。名前と顔を決めてください。あとから変えられます。</p>

          <div class="ttField">
            <label class="ttLabel" for="ttName">名前</label>
            <input class="ttInput" id="ttName" type="text" maxlength="12" value="${esc(name)}"
              autocomplete="off" spellcheck="false">
            <p class="ttNote">名鑑や大会の着順表にこの名前で出ます。</p>
          </div>

          <div class="ttField">
            <span class="ttLabel">顔</span>
            <div class="ttFaces">
              ${FACES.map((f) => `<button type="button" class="ttFace sil" data-face="${f.key}"
                  aria-pressed="${face === f.key}" aria-label="${esc(f.note)}">
                <img src="${faceSrc(f.key)}" alt="" onerror="this.remove()"></button>`).join('')}
            </div>
            <p class="ttNote">押すと大きく見られます。十二人から選べます。あとから変えられます。</p>
          </div>

          <hr class="kinsen">
          <button type="button" class="ttBtn" data-act="go">この人ではじめる</button>
          <button type="button" class="ttBtn ghost" data-act="back" style="margin-top:8px">戻る</button>
        </div>`;
      const input = root.querySelector('#ttName');
      input.addEventListener('input', () => { name = input.value; });
    }

    /* ---------- 操作 ---------- */
    /* 一覧の顔は小さいので、押したら大きく見てから決められるようにする */
    function showFace(key) {
      const info = FACES.find((f) => f.key === key) || FACES[0];
      const ov = document.createElement('div');
      ov.className = 'popup';
      ov.innerHTML = `<div class="popupBox" role="dialog" aria-modal="true"
          aria-label="${esc(info.note)}">
        <button type="button" class="popupClose" aria-label="閉じる">✕</button>
        <div class="popupPhoto">
          <span class="mkFace sil"><img src="${faceSrc(key)}" alt="" onerror="this.remove()"></span>
        </div>
        <div class="popupBody">
          <div class="popupNote">${esc(info.note)}</div>
          <button type="button" class="ttBtn" data-take="${key}">この顔にする</button>
        </div>
      </div>`;

      function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      ov.addEventListener('click', (e) => {
        if (e.target === ov || e.target.closest('.popupClose')) { close(); return; }
        const take = e.target.closest('[data-take]');
        if (take) {
          face = take.dataset.take;
          root.querySelectorAll('[data-face]').forEach((b) =>
            b.setAttribute('aria-pressed', b.dataset.face === face));
          close();
        }
      });
      document.addEventListener('keydown', onKey);
      document.body.append(ov);
      ov.querySelector('[data-take]').focus();
    }

    root.addEventListener('click', (e) => {
      const f = e.target.closest('[data-face]');
      if (f) { showFace(f.dataset.face); return; }
      const act = e.target.closest('[data-act]');
      if (!act) return;

      if (act.dataset.act === 'continue') {
        if (typeof store.onContinue === 'function') store.onContinue();
      } else if (act.dataset.act === 'new') {
        screen = 'setup';
        renderSetup();
        window.scrollTo(0, 0);
      } else if (act.dataset.act === 'back') {
        screen = 'top';
        renderTop();
        window.scrollTo(0, 0);
      } else if (act.dataset.act === 'go') {
        const clean = (name || '').trim() || DEFAULT_NAME;
        store.set({ playerName: clean, playerFace: face });
        if (typeof store.onStart === 'function') store.onStart(clean, face);
      }
    });

    renderTop();
    return {
      refresh: function () { if (screen === 'top') renderTop(); else renderSetup(); },
    };
  }

  function ensureSilVar() {
    if (document.documentElement.style.getPropertyValue('--sil-img')) return;
    const svg = encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<g fill="#0d1f1a"><circle cx="50" cy="30" r="17"/>' +
      '<path d="M14 100 C17 66 36 54 50 54 C64 54 83 66 86 100 Z"/></g></svg>'
    );
    document.documentElement.style.setProperty('--sil-img', `url("data:image/svg+xml,${svg}")`);
  }

  return {
    mount, FACES, DEFAULT_NAME, DEFAULT_FACE, faceSrc, normalizeFace,
    TITLE, SUBTITLE, paintCover, COVER_W, COVER_H,
  };
})();
</script>
<script src="src/meikan.js"></script>
<script src="src/team.js"></script>
<script src="src/taikai.js"></script>
<script src="src/scout.js"></script>
<script src="src/jansou-guests.js"></script>
<script src="src/jansou-floor.js"></script>
<script src="src/jansou.js"></script>
<script src="src/serifu.js"></script>

<script>
/* ============================================================
   外枠 — セーブと画面の切り替え
   セーブはすべてidで持つ（引き継ぎ書 §5）。
   localStorage が使えない環境では毎回最初から。
   ============================================================ */
(function () {
  'use strict';
  var SAVE_KEY = 'jandol_save_v1';

  function blankState() {
    return {
      discovered: FREE_AGENTS.map(function (c) { return c.id; }),
      contracted: [],
      comp: Object.fromEntries(FREE_AGENTS.map(function (c) { return [c.id, c.comp]; })),
      compMax: {}, grades: {}, favor: {},
      team: [], teamDecided: false,
      money: 0, playerRank: 'D', playerWins: 0, records: {}, recent: [],
      agency: 1, beaten: [],
      autoMatch: false, matchSpeed: 520, showHints: true,
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return blankState();
      var s = JSON.parse(raw), b = blankState();
      /* 知らない項目もそのまま残す。拾い直した項目だけを返すと、
         あとから足した項目を消してしまう */
      return Object.assign({}, s, {
        discovered: Array.isArray(s.discovered) ? s.discovered : b.discovered,
        contracted: Array.isArray(s.contracted) ? s.contracted : [],
        comp: Object.assign({}, b.comp, s.comp || {}),
        compMax: s.compMax || {}, grades: s.grades || {}, favor: s.favor || {},
        team: Array.isArray(s.team) ? s.team : [],
        money: typeof s.money === 'number' ? s.money : 0,
        playerRank: s.playerRank || 'D',
        playerWins: typeof s.playerWins === 'number' ? s.playerWins : 0,
        records: s.records || {},
        recent: Array.isArray(s.recent) ? s.recent : [],
        agency: typeof s.agency === 'number' ? s.agency : 1,
        beaten: Array.isArray(s.beaten) ? s.beaten : [],
        playerFace: Title.normalizeFace(s.playerFace),
        autoMatch: !!s.autoMatch,
        matchSpeed: typeof s.matchSpeed === 'number' ? s.matchSpeed : 520,
        showHints: s.showHints !== false,
      });
    } catch (e) { return blankState(); }
  }

  var canSave = true;
  function saveState(st) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); }
    catch (e) { canSave = false; }
  }

  var state = loadState();

  var store = {
    get: function () { return state; },
    set: function (patch) { Object.assign(state, patch); saveState(state); paintTop(); },

    /* チーム編成が終わったら大会へ送る */
    onDecided: function () { go('taikai'); },

    /* 表紙から */
    onContinue: function () { go(state.teamDecided ? 'taikai' : 'team'); },
    onStart: function () {
      /* 「最初からはじめる」は進行だけ消す。名前と顔は今決めたものを残す */
      var keep = { playerName: state.playerName, playerFace: state.playerFace };
      state = Object.assign(blankState(), keep);
      saveState(state);
      go('team');
    },
    onSigned: function () { paintTop(); },

    /* 自分が座る卓だけ実際に打つ。他の卓は taikai.js が確率処理する。
       設定で切れるようにしてあり、切ると全部の卓が自動処理になる。 */
    playRealMatch: function (table, ctx) {
      if (state.autoMatch) return null;      // 「自分の卓も自動で処理する」設定
      document.body.classList.add('inMatch');
      return Match.play(document.getElementById('matchRoot'), table, {
        title: ctx.tier.name + '　' + ctx.name,
        speed: state.matchSpeed || 520,
        showHints: state.showHints !== false,
      }).then(function (rank) {
        document.body.classList.remove('inMatch');
        return rank;
      }, function (e) {
        document.body.classList.remove('inMatch');
        throw e;
      });
    },
  };

  var view = document.getElementById('view');
  var nav = document.getElementById('nav');
  var current = null;

  function paintTop() {
    var el = document.getElementById('appMoney');
    var txt = '所持金 <b>' + (state.money || 0).toLocaleString('ja-JP') + '</b>円';
    if (!canSave) txt += '　（この環境では保存できません）';
    el.innerHTML = txt;
    if (current === 'title') return;
    /* チームを決めるまで他の画面は開けない */
    Array.prototype.forEach.call(nav.querySelectorAll('[data-go]'), function (b) {
      var locked = !state.teamDecided && b.dataset.go !== 'team';
      b.disabled = locked;
      b.setAttribute('aria-current', b.dataset.go === current ? 'page' : 'false');
    });
  }

  function go(name) {
    /* ポップアップ類は body に足しているので、画面を替えるときに自分で消す。
       残したままだと次の画面の上に覆いが被さったままになる */
    Array.prototype.forEach.call(
      document.querySelectorAll('.popup,.mkOverlay,.scReveal'),
      function (el) { el.remove(); }
    );
    current = name;
    view.innerHTML = '';
    var root = document.createElement('div');
    view.appendChild(root);
    document.body.classList.toggle('onTitle', name === 'title');
    if (name === 'title') Title.mount(root, store);
    else if (name === 'meikan') Meikan.mount(root, store);
    else if (name === 'team') Team.mount(root, store);
    else if (name === 'taikai') Taikai.mount(root, store);
    else if (name === 'jansou') Jansou.mount(root, store);
    else if (name === 'scout') Scout.mount(root, store);
    paintTop();
    window.scrollTo(0, 0);
  }

  nav.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b && !b.disabled) go(b.dataset.go);
  });

  document.getElementById('appReset').addEventListener('click', function () {
    if (!window.confirm('セーブを消して最初からやり直します。よろしいですか。')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    state = blankState();
    go('team');
  });

  document.getElementById('appHome').addEventListener('click', function () { go('title'); });

  /* 表紙の絵は起動時に一度だけ描く。以降どの画面にいても撮影できる */
  Title.paintCover(document.getElementById('cover'), state);

  go('title');
})();
</script>
