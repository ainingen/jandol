<body>

<div class="appTop" id="appTop">
  <button class="appTitle" id="appHome" type="button">雀ドル発掘放浪記</button>
  <span class="appMoney" id="appMoney"></span>
</div>

<!-- 表紙の絵。PLiCyのサムネイルはこのcanvasの中身を撮る。
     複数のcanvasを置くと撮影が乱れるため、タグとしてのcanvasはこれ一枚だけにすること。 -->
<div id="coverWrap"><canvas id="cover" width="1200" height="900"></canvas></div>

<!-- 実対局のときだけ使う。ui.js は document 直下のidを見るので、
     #view の外に置いて、対局中は他をすべて隠す -->
<div id="matchRoot"></div>

<div id="view"></div>

<div class="appReset"><button id="appReset">最初からやり直す</button></div>

<nav id="nav" aria-label="画面の切り替え">
  <button data-go="team">チーム</button>
  <button data-go="taikai">大会</button>
  <button data-go="jansou">雀荘</button>
  <button data-go="scout">スカウト</button>
  <button data-go="meikan">名鑑</button>
</nav>

<script>
/* ===== engine.js ===== */
/* ============================================================
   麻雀エンジン — 牌表現・シャンテン・和了判定・役・符・点数
   牌種(kind) 0-8:萬 9-17:筒 18-26:索 27-33:東南西北白發中
   牌ID(id)   kind*4 + copy (0-135)、赤5は id 16 / 52 / 88
   ============================================================ */

const KINDS = 34;
const RED_IDS = new Set([16, 52, 88]);

const kindOf = (id) => id >> 2;
const isRed = (id) => RED_IDS.has(id);
const isHonor = (k) => k >= 27;
const isTerminal = (k) => k < 27 && (k % 9 === 0 || k % 9 === 8);
const isYaochu = (k) => isHonor(k) || isTerminal(k);
const isGreen = (k) => [19, 20, 21, 23, 25, 32].includes(k); // 23s46s8s + 發

const TILE_NAMES = (() => {
  const n = [];
  const suits = ['m', 'p', 's'];
  for (const s of suits) for (let i = 1; i <= 9; i++) n.push(i + s);
  return n.concat(['東', '南', '西', '北', '白', '發', '中']);
})();

function countsFromKinds(kinds) {
  const c = new Array(KINDS).fill(0);
  for (const k of kinds) c[k]++;
  return c;
}
function countsFromIds(ids) {
  return countsFromKinds(ids.map(kindOf));
}

/* ---------------- シャンテン数 ---------------- */

function shantenStandard(counts, meldCount) {
  const c = counts.slice();
  let best = 8;
  let sets = 0, partials = 0, pair = 0;

  function record() {
    let p = partials;
    let blocks = sets + meldCount + p + pair;
    if (blocks > 5) p -= blocks - 5;
    let s = 8 - 2 * (sets + meldCount) - p - pair;
    if (sets + meldCount + p + pair === 5 && pair === 0) s += 1;
    if (s < best) best = s;
  }

  function dfs(i) {
    while (i <= 33 && c[i] === 0) i++;
    if (i > 33) { record(); return; }
    if (sets + meldCount + partials + pair > 5) { record(); return; }

    if (c[i] >= 3) { c[i] -= 3; sets++; dfs(i); sets--; c[i] += 3; }
    if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--; sets++; dfs(i); sets--; c[i]++; c[i + 1]++; c[i + 2]++;
    }
    if (c[i] >= 2 && pair === 0) { c[i] -= 2; pair = 1; dfs(i); pair = 0; c[i] += 2; }
    if (c[i] >= 2) { c[i] -= 2; partials++; dfs(i); partials--; c[i] += 2; }
    if (i < 27 && i % 9 <= 7 && c[i + 1] > 0) {
      c[i]--; c[i + 1]--; partials++; dfs(i); partials--; c[i]++; c[i + 1]++;
    }
    if (i < 27 && i % 9 <= 6 && c[i + 2] > 0) {
      c[i]--; c[i + 2]--; partials++; dfs(i); partials--; c[i]++; c[i + 2]++;
    }
    c[i]--; dfs(i); c[i]++;
  }
  dfs(0);
  return best;
}

function shantenChiitoi(counts) {
  let pairs = 0, kinds = 0;
  for (let i = 0; i < KINDS; i++) {
    if (counts[i] >= 1) kinds++;
    if (counts[i] >= 2) pairs++;
  }
  return 6 - pairs + Math.max(0, 7 - kinds);
}

function shantenKokushi(counts) {
  let kinds = 0, hasPair = 0;
  for (let i = 0; i < KINDS; i++) {
    if (!isYaochu(i)) continue;
    if (counts[i] >= 1) kinds++;
    if (counts[i] >= 2) hasPair = 1;
  }
  return 13 - kinds - hasPair;
}

// melds: 副露の配列（長さが副露数）。門前なら []
function shanten(counts, melds) {
  const m = melds.length;
  let s = shantenStandard(counts, m);
  if (m === 0) {
    s = Math.min(s, shantenChiitoi(counts), shantenKokushi(counts));
  }
  return s;
}

/* ---------------- 手牌の分解（4面子1雀頭） ---------------- */

function decompose(counts, needSets = 4) {
  const c = counts.slice();
  const results = [];
  const cur = [];
  let head = -1;

  function dfs(i, sets) {
    while (i <= 33 && c[i] === 0) i++;
    if (i > 33) {
      if (sets === needSets && head >= 0) results.push({ sets: cur.slice(), pair: head });
      return;
    }
    if (c[i] >= 3) {
      c[i] -= 3; cur.push({ type: 'pon', tile: i, closed: true }); dfs(i, sets + 1);
      cur.pop(); c[i] += 3;
    }
    if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--;
      cur.push({ type: 'chi', tile: i, closed: true }); dfs(i, sets + 1);
      cur.pop(); c[i]++; c[i + 1]++; c[i + 2]++;
    }
    if (c[i] >= 2 && head < 0) {
      c[i] -= 2; head = i; dfs(i, sets); head = -1; c[i] += 2;
    }
  }
  dfs(0, 0);
  // 重複除去
  const seen = new Set();
  return results.filter((r) => {
    const key = r.pair + '|' + r.sets.map((s) => s.type + s.tile).sort().join(',');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function isKokushiHand(counts) {
  let kinds = 0, pair = 0, total = 0;
  for (let i = 0; i < KINDS; i++) {
    total += counts[i];
    if (counts[i] === 0) continue;
    if (!isYaochu(i)) return false;
    kinds++;
    if (counts[i] === 2) pair++;
    else if (counts[i] > 2) return false;
  }
  return total === 14 && kinds === 13 && pair === 1;
}

function isChiitoiHand(counts) {
  let pairs = 0, total = 0;
  for (let i = 0; i < KINDS; i++) {
    total += counts[i];
    if (counts[i] === 2) pairs++;
    else if (counts[i] !== 0) return false;
  }
  return total === 14 && pairs === 7;
}

/* ---------------- 待ち（テンパイ時の和了牌） ---------------- */

function winningTiles(counts, melds) {
  const res = [];
  const c = counts.slice();
  for (let k = 0; k < KINDS; k++) {
    if (c[k] >= 4) continue;
    c[k]++;
    if (isComplete(c, melds)) res.push(k);
    c[k]--;
  }
  return res;
}

function isComplete(counts, melds) {
  if (melds.length === 0) {
    if (isKokushiHand(counts)) return true;
    if (isChiitoiHand(counts)) return true;
  }
  return decompose(counts, 4 - melds.length).length > 0;
}

/* ---------------- ドラ ---------------- */

function doraFromIndicator(k) {
  if (k < 27) {
    const suit = Math.floor(k / 9), num = k % 9;
    return suit * 9 + ((num + 1) % 9);
  }
  if (k <= 30) return 27 + ((k - 27 + 1) % 4); // 東南西北
  return 31 + ((k - 31 + 1) % 3); // 白發中
}

/* ---------------- 役判定 ----------------
   ctx: {
     handIds, melds:[{type:'chi'|'pon'|'ankan'|'minkan'|'kakan', tile, tiles:[ids], from}],
     winTile(kind), winId, tsumo, riichi, doubleRiichi, ippatsu, chankan,
     rinshan, haitei, houtei, bakaze, jikaze, doraIndicators, uraIndicators,
     tenhou, chihou
   }
------------------------------------------------------- */

const YAKUHAI_NAME = { 31: '役牌 白', 32: '役牌 發', 33: '役牌 中' };
const KAZE_NAME = { 27: '東', 28: '南', 29: '西', 30: '北' };

function evaluateHand(ctx) {
  const melds = ctx.melds || [];
  const menzen = melds.every((m) => m.type === 'ankan');
  const handKinds = ctx.handIds.map(kindOf);
  const counts = countsFromKinds(handKinds);

  // 手牌(counts)には和了牌を含む前提
  const candidates = [];

  if (menzen && isKokushiHand(counts)) {
    const thirteen = counts[ctx.winTile] === 2;
    candidates.push(makeResult(ctx, null, [
      thirteen
        ? { name: '国士無双十三面', han: 2, yakuman: 2 }
        : { name: '国士無双', han: 1, yakuman: 1 },
    ], 25, menzen));
  }
  if (menzen && isChiitoiHand(counts)) {
    const yaku = chiitoiYaku(ctx, counts, menzen);
    if (yaku) candidates.push(makeResult(ctx, null, yaku, 25, menzen));
  }
  for (const d of decompose(counts, 4 - melds.length)) {
    const parsed = buildParsed(ctx, d, melds);
    const yaku = standardYaku(ctx, parsed, menzen, counts);
    if (!yaku || yaku.length === 0) continue;
    const fu = calcFu(ctx, parsed, menzen, yaku);
    candidates.push(makeResult(ctx, parsed, yaku, fu, menzen));
  }
  if (candidates.length === 0) return null;
  candidates.sort((a, b) => b.score.total - a.score.total || b.han - a.han || b.fu - a.fu);
  return candidates[0];
}

function buildParsed(ctx, d, melds) {
  // 手の内の面子 + 副露面子を統一形式に
  const sets = [];
  let winUsed = false;
  for (const s of d.sets) {
    sets.push({ type: s.type, tile: s.tile, open: false, kan: false });
  }
  for (const m of melds) {
    if (m.type === 'chi') sets.push({ type: 'chi', tile: Math.min(...m.tiles.map(kindOf)), open: true, kan: false });
    else if (m.type === 'pon') sets.push({ type: 'pon', tile: m.tile, open: true, kan: false });
    else if (m.type === 'ankan') sets.push({ type: 'pon', tile: m.tile, open: false, kan: true });
    else sets.push({ type: 'pon', tile: m.tile, open: true, kan: true });
  }
  return { sets, pair: d.pair, handSets: d.sets };
}

function chiitoiYaku(ctx, counts, menzen) {
  const y = [{ name: '七対子', han: 2 }];
  addCommonYaku(ctx, y, menzen);
  // 断幺九 / 混一色 / 清一色 / 字一色
  const kinds = [];
  for (let i = 0; i < KINDS; i++) if (counts[i]) kinds.push(i);
  if (kinds.every((k) => !isYaochu(k))) y.push({ name: '断幺九', han: 1 });
  if (kinds.every((k) => isHonor(k))) return [{ name: '字一色', han: 1, yakuman: 1 }];
  if (kinds.every((k) => isYaochu(k))) y.push({ name: '混老頭', han: 2 });
  const suits = new Set(kinds.filter((k) => k < 27).map((k) => Math.floor(k / 9)));
  const hasHonor = kinds.some(isHonor);
  if (suits.size === 1 && !hasHonor) y.push({ name: '清一色', han: 6 });
  else if (suits.size === 1 && hasHonor) y.push({ name: '混一色', han: 3 });
  return y;
}

function addCommonYaku(ctx, y, menzen) {
  if (ctx.doubleRiichi) y.push({ name: 'ダブル立直', han: 2 });
  else if (ctx.riichi) y.push({ name: '立直', han: 1 });
  if (ctx.ippatsu) y.push({ name: '一発', han: 1 });
  if (ctx.tsumo && menzen) y.push({ name: '門前清自摸和', han: 1 });
  if (ctx.rinshan) y.push({ name: '嶺上開花', han: 1 });
  if (ctx.chankan) y.push({ name: '槍槓', han: 1 });
  if (ctx.haitei) y.push({ name: '海底摸月', han: 1 });
  if (ctx.houtei) y.push({ name: '河底撈魚', han: 1 });
}

function standardYaku(ctx, parsed, menzen, counts) {
  const sets = parsed.sets;
  const y = [];
  const allKinds = [];
  for (const s of sets) {
    if (s.type === 'chi') allKinds.push(s.tile, s.tile + 1, s.tile + 2);
    else allKinds.push(s.tile, s.tile, s.tile);
  }
  allKinds.push(parsed.pair, parsed.pair);

  // ---- 役満 ----
  const yakuman = [];
  const triplets = sets.filter((s) => s.type === 'pon');
  const concealedTriplets = triplets.filter((s) => {
    if (s.kan) return !s.open;
    if (s.open) return false;
    // 手の内の刻子：ロン和了で完成した刻子は明刻扱い
    if (!ctx.tsumo && s.tile === ctx.winTile && isRonCompletedTriplet(ctx, parsed, s)) return false;
    return true;
  });
  const dragons = triplets.filter((s) => s.tile >= 31);
  const winds = triplets.filter((s) => s.tile >= 27 && s.tile <= 30);

  if (dragons.length === 3) yakuman.push({ name: '大三元', han: 1, yakuman: 1 });
  if (concealedTriplets.length === 4) {
    const tanki = parsed.pair === ctx.winTile && ctx.winTile !== undefined;
    yakuman.push(tanki
      ? { name: '四暗刻単騎', han: 2, yakuman: 2 }
      : { name: '四暗刻', han: 1, yakuman: 1 });
  }
  if (allKinds.every(isHonor)) yakuman.push({ name: '字一色', han: 1, yakuman: 1 });
  if (allKinds.every(isTerminal)) yakuman.push({ name: '清老頭', han: 1, yakuman: 1 });
  if (allKinds.every(isGreen)) yakuman.push({ name: '緑一色', han: 1, yakuman: 1 });
  if (winds.length === 4) yakuman.push({ name: '大四喜', han: 2, yakuman: 2 });
  else if (winds.length === 3 && parsed.pair >= 27 && parsed.pair <= 30) {
    yakuman.push({ name: '小四喜', han: 1, yakuman: 1 });
  }
  if (sets.filter((s) => s.kan).length === 4) yakuman.push({ name: '四槓子', han: 1, yakuman: 1 });
  if (menzen) {
    const ch = chuurenType(counts, ctx.winTile);
    if (ch === 2) yakuman.push({ name: '純正九蓮宝燈', han: 2, yakuman: 2 });
    else if (ch === 1) yakuman.push({ name: '九蓮宝燈', han: 1, yakuman: 1 });
  }
  if (ctx.tenhou) yakuman.push({ name: '天和', han: 1, yakuman: 1 });
  if (ctx.chihou) yakuman.push({ name: '地和', han: 1, yakuman: 1 });
  if (yakuman.length) return yakuman;

  // ---- 通常役 ----
  addCommonYaku(ctx, y, menzen);

  // 役牌
  for (const s of triplets) {
    if (s.tile >= 31) y.push({ name: YAKUHAI_NAME[s.tile], han: 1 });
    if (s.tile === ctx.bakaze) y.push({ name: '場風 ' + KAZE_NAME[s.tile], han: 1 });
    if (s.tile === ctx.jikaze) y.push({ name: '自風 ' + KAZE_NAME[s.tile], han: 1 });
  }
  // 平和
  if (menzen && isPinfu(ctx, parsed)) y.push({ name: '平和', han: 1 });
  // 断幺九
  if (allKinds.every((k) => !isYaochu(k))) y.push({ name: '断幺九', han: 1 });
  // 一盃口 / 二盃口
  if (menzen) {
    const runs = sets.filter((s) => s.type === 'chi').map((s) => s.tile).sort((a, b) => a - b);
    let iipeiko = 0;
    for (let i = 0; i < runs.length - 1; i++) {
      if (runs[i] === runs[i + 1]) { iipeiko++; i++; }
    }
    if (iipeiko === 2) y.push({ name: '二盃口', han: 3 });
    else if (iipeiko === 1) y.push({ name: '一盃口', han: 1 });
  }
  // 三色同順
  const runTiles = sets.filter((s) => s.type === 'chi').map((s) => s.tile);
  for (const t of runTiles) {
    if (t >= 27) continue;
    const num = t % 9;
    if (num > 6) continue;
    const need = [num, num + 9, num + 18];
    if (need.every((n) => runTiles.includes(n))) {
      y.push({ name: '三色同順', han: menzen ? 2 : 1 });
      break;
    }
  }
  // 一気通貫
  for (let suit = 0; suit < 3; suit++) {
    const base = suit * 9;
    if ([base, base + 3, base + 6].every((n) => runTiles.includes(n))) {
      y.push({ name: '一気通貫', han: menzen ? 2 : 1 });
      break;
    }
  }
  // 三色同刻
  const ponTiles = triplets.map((s) => s.tile);
  for (const t of ponTiles) {
    if (t >= 27) continue;
    const num = t % 9;
    const need = [num, num + 9, num + 18];
    if (need.every((n) => ponTiles.includes(n))) { y.push({ name: '三色同刻', han: 2 }); break; }
  }
  // 対々和 / 三暗刻 / 三槓子
  if (triplets.length === 4) y.push({ name: '対々和', han: 2 });
  if (concealedTriplets.length === 3) y.push({ name: '三暗刻', han: 2 });
  const kans = sets.filter((s) => s.kan).length;
  if (kans === 3) y.push({ name: '三槓子', han: 2 });
  // 小三元
  if (dragons.length === 2 && parsed.pair >= 31) y.push({ name: '小三元', han: 2 });
  // 混老頭
  const allYaochu = allKinds.every(isYaochu);
  if (allYaochu) y.push({ name: '混老頭', han: 2 });
  // 全帯幺 / 純全帯幺
  if (!allYaochu) {
    const blocks = sets.map((s) => (s.type === 'chi' ? [s.tile, s.tile + 1, s.tile + 2] : [s.tile]));
    blocks.push([parsed.pair]);
    const everyBlockHasYaochu = blocks.every((b) => b.some(isYaochu));
    if (everyBlockHasYaochu) {
      const anyHonor = allKinds.some(isHonor);
      if (anyHonor) y.push({ name: '混全帯幺九', han: menzen ? 2 : 1 });
      else y.push({ name: '純全帯幺九', han: menzen ? 3 : 2 });
    }
  }
  // 染め手
  const suits = new Set(allKinds.filter((k) => k < 27).map((k) => Math.floor(k / 9)));
  const hasHonor = allKinds.some(isHonor);
  if (suits.size === 1 && !hasHonor) y.push({ name: '清一色', han: menzen ? 6 : 5 });
  else if (suits.size === 1 && hasHonor) y.push({ name: '混一色', han: menzen ? 3 : 2 });

  return y;
}

function isRonCompletedTriplet(ctx, parsed, s) {
  // 和了牌が手の内の刻子に使われている場合、その刻子は明刻扱い（1組のみ）
  const inHand = parsed.handSets.some((h) => h.type === 'pon' && h.tile === s.tile);
  return inHand;
}

function chuurenType(counts, winTile) {
  for (let suit = 0; suit < 3; suit++) {
    const base = suit * 9;
    let ok = true, total = 0;
    for (let i = 0; i < KINDS; i++) {
      if (i >= base && i < base + 9) { total += counts[i]; continue; }
      if (counts[i] > 0) { ok = false; break; }
    }
    if (!ok || total !== 14) continue;
    const need = [3, 1, 1, 1, 1, 1, 1, 1, 3];
    let extra = -1, valid = true;
    for (let i = 0; i < 9; i++) {
      const diff = counts[base + i] - need[i];
      if (diff < 0) { valid = false; break; }
      if (diff === 1) { if (extra >= 0) { valid = false; break; } extra = i; }
      else if (diff !== 0) { valid = false; break; }
    }
    if (valid && extra >= 0) {
      const pureWait = counts[winTile] - need[winTile - base] === 1 && base + extra === winTile;
      // 純正：和了前が 1112345678999 の形（＝和了牌がどの数でも9面待ち）
      return pureWait ? 2 : 1;
    }
  }
  return 0;
}

function isPinfu(ctx, parsed) {
  if (parsed.sets.some((s) => s.type !== 'chi')) return false;
  if (parsed.sets.some((s) => s.open || s.kan)) return false;
  const p = parsed.pair;
  if (p >= 31) return false;
  if (p === ctx.bakaze || p === ctx.jikaze) return false;
  // 両面待ちか
  return parsed.handSets.some((s) => {
    if (s.type !== 'chi') return false;
    const t = s.tile;
    if (ctx.winTile === t && (t % 9) !== 6) return true;       // 下側で受け＝両面
    if (ctx.winTile === t + 2 && (t % 9) !== 0) return true;   // 上側で受け＝両面
    return false;
  });
}

/* ---------------- 符計算 ---------------- */

function calcFu(ctx, parsed, menzen, yaku) {
  if (yaku.some((v) => v.name === '平和')) return ctx.tsumo ? 20 : 30;
  let fu = 20;
  if (!ctx.tsumo && menzen) fu += 10;
  if (ctx.tsumo) fu += 2;
  if (!menzen && !ctx.tsumo) {
    // 喰い平和形の30符固定は後段でチェック
  }
  let ronTripletUsed = false;
  for (const s of parsed.sets) {
    if (s.type === 'chi') continue;
    const yao = isYaochu(s.tile) ? 2 : 1;
    let concealed = !s.open;
    if (!ctx.tsumo && !s.open && !s.kan && s.tile === ctx.winTile && !ronTripletUsed) {
      const inHand = parsed.handSets.some((h) => h.type === 'pon' && h.tile === s.tile);
      if (inHand) { concealed = false; ronTripletUsed = true; }
    }
    if (s.kan) fu += (concealed ? 16 : 8) * yao;
    else fu += (concealed ? 4 : 2) * yao;
  }
  // 雀頭
  if (parsed.pair >= 31) fu += 2;
  if (parsed.pair === ctx.bakaze) fu += 2;
  if (parsed.pair === ctx.jikaze) fu += 2;
  // 待ち
  fu += waitFu(ctx, parsed);

  let total = Math.ceil(fu / 10) * 10;
  if (!menzen && total === 20) total = 30; // 喰い平和
  return total;
}

function waitFu(ctx, parsed) {
  if (parsed.pair === ctx.winTile) {
    const usedElsewhere = parsed.handSets.some(
      (s) => s.type === 'pon' && s.tile === ctx.winTile
    );
    if (!usedElsewhere) return 2; // 単騎
  }
  let bonus = 0;
  for (const s of parsed.handSets) {
    if (s.type !== 'chi') continue;
    const t = s.tile;
    if (ctx.winTile === t + 1) return 2; // 嵌張
    if (ctx.winTile === t && t % 9 === 6) bonus = 2; // 辺張(789の7待ち)
    if (ctx.winTile === t + 2 && t % 9 === 0) bonus = 2; // 辺張(123の3待ち)
  }
  return bonus;
}

/* ---------------- 点数 ---------------- */

function makeResult(ctx, parsed, yaku, fu, menzen) {
  const yakumanCount = yaku.reduce((a, v) => a + (v.yakuman || 0), 0);
  let han = yaku.reduce((a, v) => a + v.han, 0);
  const extras = [];

  if (!yakumanCount) {
    const dora = countDora(ctx);
    if (dora.dora) extras.push({ name: 'ドラ', han: dora.dora });
    if (dora.aka) extras.push({ name: '赤ドラ', han: dora.aka });
    if (dora.ura) extras.push({ name: '裏ドラ', han: dora.ura });
    han += extras.reduce((a, v) => a + v.han, 0);
  }
  const all = yaku.concat(extras);
  const score = calcScore(han, fu, ctx.isDealer, ctx.tsumo, yakumanCount, ctx.honba || 0);
  return { yaku: all, han, fu, score, yakuman: yakumanCount, menzen };
}

function countDora(ctx) {
  const tiles = ctx.handIds.slice();
  for (const m of ctx.melds || []) tiles.push(...m.tiles);
  let dora = 0, aka = 0, ura = 0;
  for (const ind of ctx.doraIndicators || []) {
    const d = doraFromIndicator(ind);
    dora += tiles.filter((t) => kindOf(t) === d).length;
  }
  if (ctx.riichi || ctx.doubleRiichi) {
    for (const ind of ctx.uraIndicators || []) {
      const d = doraFromIndicator(ind);
      ura += tiles.filter((t) => kindOf(t) === d).length;
    }
  }
  aka = tiles.filter(isRed).length;
  return { dora, aka, ura };
}

function limitName(han, yakumanCount) {
  if (yakumanCount >= 2) return { name: yakumanCount + '倍役満', base: 8000 * yakumanCount };
  if (yakumanCount === 1) return { name: '役満', base: 8000 };
  if (han >= 13) return { name: '数え役満', base: 8000 };
  if (han >= 11) return { name: '三倍満', base: 6000 };
  if (han >= 8) return { name: '倍満', base: 4000 };
  if (han >= 6) return { name: '跳満', base: 3000 };
  return null;
}

function calcScore(han, fu, isDealer, tsumo, yakumanCount, honba) {
  let base;
  const limit = limitName(han, yakumanCount);
  let name = limit ? limit.name : '';
  if (limit) base = limit.base;
  else {
    base = fu * Math.pow(2, 2 + han);
    if (base >= 2000) { base = 2000; name = '満貫'; }
  }
  const r = (x) => Math.ceil(x / 100) * 100;
  const out = { han, fu, name, tsumo, isDealer, honba };
  if (tsumo) {
    if (isDealer) {
      const each = r(base * 2);
      out.each = each + honba * 100;
      out.total = out.each * 3;
      out.detail = `${out.each}オール`;
    } else {
      const ko = r(base), oya = r(base * 2);
      out.ko = ko + honba * 100;
      out.oya = oya + honba * 100;
      out.total = out.ko * 2 + out.oya;
      out.detail = `${out.ko} / ${out.oya}`;
    }
  } else {
    const total = r(base * (isDealer ? 6 : 4)) + honba * 300;
    out.total = total;
    out.detail = `${total}点`;
  }
  return out;
}

const Engine = {
  KINDS, TILE_NAMES, kindOf, isRed, isHonor, isTerminal, isYaochu,
  countsFromKinds, countsFromIds, shanten, shantenStandard, shantenChiitoi,
  shantenKokushi, decompose, isComplete, winningTiles, doraFromIndicator,
  evaluateHand, calcScore, isKokushiHand, isChiitoiHand,
};

/* ===== ai.js ===== */
/* ============================================================
   CPU思考ルーチン
   ・受け入れ枚数（ウケ入れ）ベースの牌効率
   ・現物/筋/壁/字牌残り枚数による危険度読み
   ・シャンテン数と打点による押し引き
   ============================================================ */

const AI = (() => {
  const K = Engine.KINDS;
  const kindOf = Engine.kindOf;

  /* ============================================================
     打ち筋の係数
     tournament.js の paramsOf(chara) が作った値を、対局前に
     p.ai へ入れておくと、その人の判断がそのぶん変わる。
     入っていなければ NEUTRAL が使われ、以前と同じ打ち方になる。

     ここでやるのは「強くする」ことではなく「判断の傾きを変える」こと。
     未熟なうちは押しすぎ・守りが甘い係数が入り、完成度が上がるほど
     打ち筋どおりの正確な判断に近づく（引き継ぎ書の育成方針）。
     ============================================================ */
  const NEUTRAL = {
    push: 0.5, call: 0.5, riichi: 0.5, defense: 0.5,
    speed: 0.5, value: 0.5, variance: 0, endgame: 0.5,
    skill: 1,          // 判断の正確さ。1で最善手を選ぶ
  };

  /* ムラは「局ごとに係数が揺れる幅」。打牌ごとに振ると挙動が壊れるので、
     局が変わったときに一度だけ振り直して、その局のあいだは固定する */
  function paramsOf(p, g) {
    const base = p && p.ai;
    if (!base) return NEUTRAL;
    const v = base.variance || 0;
    if (v <= 0) return base;
    const key = g ? (g.kyoku + '-' + g.honba + '-' + g.bakaze) : '0';
    if (p._aiKey !== key) {
      p._aiKey = key;
      const jitter = {};
      for (const k of ['push', 'call', 'riichi', 'defense', 'speed', 'value', 'endgame']) {
        const d = (Math.random() * 2 - 1) * v * 0.5;
        jitter[k] = Math.max(0, Math.min(1, (base[k] === undefined ? 0.5 : base[k]) + d));
      }
      jitter.variance = v;
      /* skill（判断の正確さ）は揺らさずそのまま引き継ぐ。
         ここで落とすと未熟なキャラも最善手を打ってしまう */
      jitter.skill = base.skill === undefined ? 1 : base.skill;
      p._aiRolled = jitter;
    }
    return p._aiRolled || base;
  }

  /* 終盤の条件戦。最終局で、順位に応じて押し引きを傾ける。
     endgame が高いほど正確に傾き、低いと何も見ずに打つ */
  function endgameShift(g, p, a) {
    if (!g || g.kyoku < (g.maxKyoku || 4)) return 0;
    const scores = g.players.map((x) => x.score);
    const mine = p.score;
    const top = Math.max(...scores);
    const rank = scores.filter((s) => s > mine).length + 1;
    const gap = top - mine;
    let shift;
    if (rank === 1) shift = -0.35;                       // 逃げ切り。降りる
    else if (gap > 8000) shift = 0.45;                   // 離された。押す
    else shift = 0.2;                                    // 射程内。少し押す
    return shift * (a.endgame === undefined ? 0.5 : a.endgame);
  }

  /* ---- 場に見えている牌から残り枚数を数える ---- */
  function remaining(g, p) {
    const rem = new Array(K).fill(4);
    const sub = (k) => { if (rem[k] > 0) rem[k]--; };
    for (const id of p.hand) sub(kindOf(id));
    for (const pl of g.players) {
      for (const m of pl.melds) for (const id of m.tiles) sub(kindOf(id));
      for (const d of pl.discards) sub(kindOf(d.id));
    }
    for (const id of g.doraIndicators) sub(kindOf(id));
    return rem;
  }

  /* ---- 見えている枚数（危険度用） ---- */
  function visibleCount(g, p, kind) {
    let n = 0;
    for (const id of p.hand) if (kindOf(id) === kind) n++;
    for (const pl of g.players) {
      for (const m of pl.melds) for (const id of m.tiles) if (kindOf(id) === kind) n++;
      for (const d of pl.discards) if (kindOf(d.id) === kind) n++;
    }
    for (const id of g.doraIndicators) if (kindOf(id) === kind) n++;
    return n;
  }

  /* ---- 受け入れ ---- */
  function ukeire(counts, melds, rem) {
    const sh = Engine.shanten(counts, melds);
    let total = 0;
    const tiles = [];
    for (let k = 0; k < K; k++) {
      if (rem[k] <= 0 || counts[k] >= 4) continue;
      counts[k]++;
      const s2 = Engine.shanten(counts, melds);
      counts[k]--;
      if (s2 < sh) { total += rem[k]; tiles.push(k); }
    }
    return { shanten: sh, total, tiles };
  }

  /* ---- 相手の脅威度 0〜1 ---- */
  function threatLevel(g, o) {
    if (o.riichi) return 1;
    let t = 0;
    const melds = o.melds.filter((m) => m.type !== 'ankan');
    if (melds.length >= 1) {
      t += 0.12 * melds.length;
      for (const m of o.melds) {
        const k = m.tile;
        if (k >= 31 || k === g.bakaze || k === o.jikaze) t += 0.15;
        for (const id of m.tiles) if (isDoraTile(g, id)) t += 0.1;
      }
    }
    if (o.discards.length >= 12) t += 0.1;
    // 染め手読み：序盤に他色を大量に切っている
    const suitDiscards = [0, 0, 0];
    for (const d of o.discards) { const k = kindOf(d.id); if (k < 27) suitDiscards[Math.floor(k / 9)]++; }
    const totalSuit = suitDiscards.reduce((a, b) => a + b, 0);
    if (totalSuit >= 8 && o.melds.length >= 1) {
      const minSuit = Math.min(...suitDiscards);
      if (minSuit <= 1) t += 0.2;
    }
    return Math.min(0.75, t);
  }

  function isDoraTile(g, id) {
    if (Engine.isRed(id)) return true;
    const k = kindOf(id);
    return g.doraIndicators.some((ind) => Engine.doraFromIndicator(kindOf(ind)) === k);
  }

  /* ---- 現物集合 ---- */
  function safeTilesAgainst(g, o) {
    const set = new Set();
    for (const d of o.discards) set.add(kindOf(d.id));
    if (o.riichiTurn !== null && o.riichiTurn !== undefined) {
      for (const pl of g.players) {
        if (pl === o) continue;
        for (const d of pl.discards) {
          if (d.globalTurn >= o.riichiTurn) set.add(kindOf(d.id));
        }
      }
    }
    for (const m of o.passedTiles || []) set.add(m);
    return set;
  }

  /* ---- 1人に対する生の危険度 ---- */
  function rawDanger(g, p, o, kind, safe, rem, visCache) {
    if (safe.has(kind)) return 0;
    if (kind >= 27) {
      const vis = visCache ? visCache[kind] : visibleCount(g, p, kind);
      if (vis >= 3) return 0.5;
      if (vis === 2) return 3;
      return 8;
    }
    const num = kind % 9;
    const suit = Math.floor(kind / 9);
    const base = [8, 10, 12, 14, 14, 14, 12, 10, 8][num];
    let d = base;

    // 筋
    const has = (n) => n >= 0 && n <= 8 && safe.has(suit * 9 + n);
    let sujiCut = false;
    if (num <= 2) sujiCut = has(num + 3);
    else if (num >= 6) sujiCut = has(num - 3);
    else sujiCut = has(num - 3) && has(num + 3);
    if (sujiCut) d *= 0.5;

    // 壁（ノーチャンス / ワンチャンス）
    const cnt = (n) => (n < 0 || n > 8 ? 0 : rem[suit * 9 + n]);
    if (num >= 2 && num <= 6) {
      const left = cnt(num - 2), right = cnt(num + 2);
      if (left === 0 && right === 0) d *= 0.45;
      else if (left <= 1 && right <= 1) d *= 0.75;
    }
    if (cnt(num - 1) === 0 && cnt(num + 1) === 0) d *= 0.6; // 嵌張・両面の受けが薄い
    return d;
  }

  function makeThreatCache(g, p) {
    const rem = remaining(g, p);
    const vis = new Array(K).fill(0);
    for (let k = 0; k < K; k++) vis[k] = 4 - rem[k];
    const opps = [];
    for (const o of g.players) {
      if (o === p) continue;
      const th = threatLevel(g, o);
      if (th <= 0.05) continue;
      opps.push({ o, th, safe: safeTilesAgainst(g, o) });
    }
    return { rem, vis, opps };
  }

  function totalDanger(g, p, kind, cache) {
    const c = cache || makeThreatCache(g, p);
    let sum = 0;
    for (const e of c.opps) sum += e.th * rawDanger(g, p, e.o, kind, e.safe, c.rem, c.vis);
    return sum;
  }

  /* ---- 手の価値（翻数のざっくり見積り） ---- */
  function handValue(g, p, ignoreMenzen) {
    let v = 1;
    for (const id of p.hand) if (isDoraTile(g, id)) v += 1;
    for (const m of p.melds) for (const id of m.tiles) if (isDoraTile(g, id)) v += 1;
    const menzen = p.melds.every((m) => m.type === 'ankan');
    if (menzen && !ignoreMenzen) v += 1.5;
    for (const m of p.melds) {
      if (m.tile >= 31 || m.tile === g.bakaze || m.tile === p.jikaze) v += 1;
    }
    // 染め手気配
    const counts = Engine.countsFromIds(p.hand);
    const suitTotal = [0, 0, 0];
    for (let k = 0; k < 27; k++) suitTotal[Math.floor(k / 9)] += counts[k];
    if (Math.max(...suitTotal) >= 9) v += 2;
    return v;
  }

  /* ---- 打牌選択 ---- */
  function chooseDiscard(g, p, forbid) {
    const a = paramsOf(p, g);
    const rem = remaining(g, p);
    const menzen = p.melds.every((m) => m.type === 'ankan');
    const maxThreat = Math.max(0, ...g.players.filter((o) => o !== p).map((o) => threatLevel(g, o)));
    const baseCounts = Engine.countsFromIds(p.hand);
    const curShanten = Engine.shanten(baseCounts, p.melds);
    const value = handValue(g, p);

    // 押し引き係数。a.push が高いほど遠い手でも押す
    let push;
    if (curShanten <= 0) push = 1;
    else if (curShanten === 1) push = 0.5;
    else if (curShanten === 2) push = 0.2;
    else push = 0.08;
    push = Math.min(1, push * (0.6 + value / 4));
    push = Math.max(0, Math.min(1, push * (0.55 + a.push * 0.9) + endgameShift(g, p, a)));

    // 危険度をどれだけ重く見るか。a.defense が高いほど降りる
    const riskWeight = maxThreat * 26 * (1 - push) * (0.35 + a.defense * 1.3);

    const cache = makeThreatCache(g, p);
    const seen = new Set();
    const cands = [];
    for (const id of p.hand) {
      const k = kindOf(id);
      if (forbid && forbid.has(k)) continue;
      if (seen.has(k)) continue;
      seen.add(k);

      const c = baseCounts.slice();
      c[k]--;
      const u = ukeire(c, p.melds, rem);
      // a.speed が高いほど受け入れ枚数を、a.value が高いほど打点を優先する
      let eff = -u.shanten * 120 * (0.75 + a.speed * 0.5)
              + Math.min(u.total, 40) * 2.2 * (0.5 + a.speed * 1.0);

      // ドラ・赤は残す
      if (isDoraTile(g, id)) eff -= 14 * (0.4 + a.value * 1.2);
      // 役牌の対子は残す
      if (k >= 27 && baseCounts[k] >= 2) eff -= 8;
      if (k >= 27 && baseCounts[k] === 1 && rem[k] >= 2 && (k >= 31 || k === g.bakaze || k === p.jikaze)) eff -= 3;
      // 孤立字牌は早めに整理
      if (k >= 27 && baseCounts[k] === 1) eff += 4;
      // 端寄りの孤立牌から
      if (k < 27) {
        const n = k % 9;
        eff += (4 - Math.abs(4 - n)) * 0.3;
      }
      // テンパイなら和了役の有無を軽く見る
      if (u.shanten === 0 && !menzen) {
        const wins = Engine.winningTiles(c, p.melds);
        const hasYaku = wins.some((w) => {
          const test = c.slice(); test[w]++;
          return quickYakuCheck(g, p, test, w);
        });
        if (!hasYaku) eff -= 90;
      }

      const risk = totalDanger(g, p, k, cache);
      const score = eff - risk * riskWeight;
      cands.push({ id, score, eff, risk, shanten: u.shanten });
    }
    if (!cands.length) return null;
    cands.sort((x, y) => y.score - x.score);

    /* 未熟なうちは最善でない牌を選ぶ。
       係数の傾きだけでは打牌の順位がほとんど変わらず、完成度を上げても
       強くならなかったため、ここで直接「判断の正確さ」を効かせる。
       skill=1 なら常に最善、低いほど二番手・三番手に落ちる */
    const skill = a.skill === undefined ? 1 : a.skill;
    const slip = (1 - skill) * 0.55;
    if (cands.length > 1 && Math.random() < slip) {
      const n = Math.min(cands.length - 1, Math.random() < 0.65 ? 1 : 2);
      return cands[n];
    }
    return cands[0];
  }

  // 副露手が役ありで和了れるかの簡易チェック
  function quickYakuCheck(g, p, counts, winTile) {
    const ids = [];
    const used = {};
    for (let k = 0; k < K; k++) for (let i = 0; i < counts[k]; i++) {
      used[k] = (used[k] || 0) + 1;
      ids.push(k * 4 + (used[k] - 1));
    }
    const res = Engine.evaluateHand({
      handIds: ids, melds: p.melds, winTile, tsumo: true,
      bakaze: g.bakaze, jikaze: p.jikaze, isDealer: p.seat === g.dealer,
      doraIndicators: g.doraIndicators.map(kindOf), uraIndicators: [],
    });
    if (!res) return false;
    return res.yaku.some((y) => !['ドラ', '赤ドラ', '裏ドラ'].includes(y.name));
  }

  /* ---- リーチ判断 ---- */
  function shouldRiichi(g, p, discardId) {
    const a = paramsOf(p, g);
    const value = handValue(g, p);
    const c = Engine.countsFromIds(p.hand);
    c[kindOf(discardId)]--;
    const wins = Engine.winningTiles(c, p.melds);
    const rem = remaining(g, p);
    const waitCount = wins.reduce((s, k) => s + rem[k], 0);
    if (waitCount === 0) return false;
    if (g.wall.length < 6) return waitCount >= 4;

    // a.riichi が高いほど、待ちが悪くても打点が高くてもかける。
    // 低いと黙聴に寄る（門前高打点型・仕掛け重視型など）
    const minWait = a.riichi >= 0.85 ? 1 : a.riichi >= 0.65 ? 2 : a.riichi >= 0.45 ? 3 : 4;
    if (waitCount < minWait) return false;
    const damaValue = 4 + a.riichi * 6;      // これ以上の打点なら黙聴を選ぶ
    if (waitCount <= 2 && value >= damaValue) return false;

    // 押し引きの延長。危険なときに無理にかけない
    const maxThreat = Math.max(0, ...g.players.filter((o) => o !== p).map((o) => threatLevel(g, o)));
    if (maxThreat >= 0.9 && a.defense > 0.75 && waitCount <= 3) return false;
    return true;
  }

  /* ---- 鳴き判断 ---- */
  function shouldCall(g, p, tileId, type, candidateTiles) {
    const a = paramsOf(p, g);
    const k = kindOf(tileId);
    const before = Engine.shanten(Engine.countsFromIds(p.hand), p.melds);
    const rest = p.hand.filter((id) => !candidateTiles.includes(id));
    const newMelds = p.melds.concat([{ type, tile: k, tiles: candidateTiles.concat([tileId]) }]);
    const after = Engine.shanten(Engine.countsFromIds(rest), newMelds);
    if (after > before) return false;

    const maxThreat = Math.max(0, ...g.players.filter((o) => o !== p).map((o) => threatLevel(g, o)));
    if (maxThreat >= 1 && after > 0) return false;   // 他家リーチ中はテンパイになる鳴きだけ

    const isYakuhai = k >= 31 || k === g.bakaze || k === p.jikaze;
    const value = handValue(g, p, true);

    // a.call が低いほど鳴かない（門前高打点型・変則手型など）
    if (a.call < 0.2 && !(type === 'pon' && isYakuhai && after <= 0)) return false;

    // 役牌ポンは横ばいでも価値がある
    if (type === 'pon' && isYakuhai) {
      if (after < before) return true;
      return before <= 1 + Math.round(a.call * 3);
    }
    if (after >= before) return false;

    // 役の見込みを確認
    const counts = Engine.countsFromIds(rest);
    const allKinds = [];
    for (let i = 0; i < K; i++) for (let j = 0; j < counts[i]; j++) allKinds.push(i);
    for (const m of newMelds) for (const id of m.tiles) allKinds.push(kindOf(id));
    const tanyaoOK = allKinds.every((x) => !Engine.isYaochu(x));
    const suits = new Set(allKinds.filter((x) => x < 27).map((x) => Math.floor(x / 9)));
    const honitsuOK = suits.size <= 1;
    const yakuhaiHeld = newMelds.some((m) => m.tile >= 31 || m.tile === g.bakaze || m.tile === p.jikaze)
      || [31, 32, 33, g.bakaze, p.jikaze].some((y) => counts[y] >= 2);
    const toitoiOK = newMelds.every((m) => m.type !== 'chi')
      && Object.values(counts).filter((n) => n >= 2).length >= 3;
    if (!tanyaoOK && !honitsuOK && !yakuhaiHeld && !toitoiOK) return false;

    // 安手・遠い仕掛けは避ける。a.call が高いほど許容が広い
    const farLimit = 1 + Math.round(a.call * 2.6);        // 0.1→1  0.95→4
    if (after >= farLimit) return false;
    if (after === 2 && value < 4 - a.call * 2) return false;
    if (type === 'chi' && after >= 1 && value < 3 - a.call * 2) return false;
    return true;
  }

  function shouldKan(g, p, type) {
    const a = paramsOf(p, g);
    const maxThreat = Math.max(0, ...g.players.filter((o) => o !== p).map((o) => threatLevel(g, o)));
    if (maxThreat >= 0.9 - a.push * 0.3) return false;
    if (p.riichi) return true; // 待ちが変わらない暗槓のみ呼ばれる
    const sh = Engine.shanten(Engine.countsFromIds(p.hand), p.melds);
    if (type === 'ankan') return sh <= 2;
    return sh <= 1 && handValue(g, p) >= 3;
  }

  return {
    remaining, ukeire, threatLevel, totalDanger, safeTilesAgainst,
    handValue, chooseDiscard, shouldRiichi, shouldCall, shouldKan, isDoraTile,
    paramsOf, NEUTRAL,
  };
})();

/* ===== game.js ===== */
/* ============================================================
   対局進行
   ============================================================ */

const KAZE = ['東', '南', '西', '北'];
const SEAT_LABEL = ['自分', '下家', '対面', '上家'];

class Game {
  constructor(io, opts = {}) {
    this.io = io;
    this.opts = Object.assign({ length: 'tonpuu', startScore: 25000 }, opts);
    this.players = [0, 1, 2, 3].map((i) => ({
      seat: i, isAI: opts.spectate ? true : i !== 0, score: this.opts.startScore,
      hand: [], melds: [], discards: [], riichi: false, riichiTurn: null,
      ippatsu: false, doubleRiichi: false, furiten: false, passedTiles: [],
      jikaze: 27, name: (opts.foes && i > 0) ? opts.foes[i - 1] : SEAT_LABEL[i],
    }));
    this.bakaze = 27;
    this.dealer = 0;
    this.kyoku = 1;
    this.honba = 0;
    this.riichiSticks = 0;
    this.finished = false;
  }

  get maxKyoku() {
    if (this.opts.length === 'hanchan') return 8;
    if (this.opts.length === 'ikkyoku') return 1;
    return 4;
  }

  /* ---------- 配牌 ---------- */
  deal() {
    const ids = [];
    for (let i = 0; i < 136; i++) ids.push(i);
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    this.deadWall = ids.slice(0, 14);
    this.wall = ids.slice(14);
    this.doraIndicators = [this.deadWall[4]];
    this.uraIndicators = [this.deadWall[5]];
    this.kanCount = 0;
    this.rinshanIndex = 0;
    this.globalTurn = 0;
    this.lastDiscard = null;
    this.noCallsYet = true;
    this.currentDraw = null;

    for (const p of this.players) {
      p.hand = []; p.melds = []; p.discards = [];
      p.riichi = false; p.riichiTurn = null; p.ippatsu = false;
      p.doubleRiichi = false; p.furiten = false; p.passedTiles = [];
      p.jikaze = 27 + ((p.seat - this.dealer + 4) % 4);
      p.tenpaiAtDraw = false;
    }
    for (let r = 0; r < 3; r++) {
      for (let i = 0; i < 4; i++) {
        const p = this.players[(this.dealer + i) % 4];
        for (let n = 0; n < 4; n++) p.hand.push(this.wall.shift());
      }
    }
    for (let i = 0; i < 4; i++) {
      this.players[(this.dealer + i) % 4].hand.push(this.wall.shift());
    }
    for (const p of this.players) this.sortHand(p);
    if (this.cheat) {
      Cheat.resetHand(this);
      if ((this.perks || []).includes('kubari') && this.cheat.hand.length < Cheat.handLimit(this)) {
        this.cheat.hand.push(CHEATS[Math.floor(Math.random() * CHEATS.length)].id);
      }
    }
  }

  sortHand(p) {
    p.hand.sort((a, b) => (Engine.kindOf(a) - Engine.kindOf(b)) || a - b);
  }

  drawTile(fromDead = false, seat = null) {
    const c = this.cheat;
    if (c && seat !== null && !fromDead) {
      if (c.skipDraw) { c.skipDraw = false; if (this.wall.length > 1) this.wall.push(this.wall.shift()); }
      if (c.kingDraw) { c.kingDraw = false; fromDead = true; }
      else if (c.rigged[seat] !== undefined) {
        const want = c.rigged[seat];
        delete c.rigged[seat];
        const i = this.wall.findIndex((id) => Engine.kindOf(id) === want);
        if (i > 0) { const t = this.wall.splice(i, 1)[0]; this.wall.unshift(t); }
      } else if (c.doubleDraw) {
        c.doubleDraw = false;
        const a = this.wall.shift(), b = this.wall.shift();
        const p = this.players[seat];
        const score = (id) => {
          const cc = Engine.countsFromIds(p.hand.concat([id]));
          return Engine.shanten(cc, p.melds) * 10 - (AI.isDoraTile(this, id) ? 1 : 0);
        };
        const keep = score(a) <= score(b) ? a : b;
        const back = keep === a ? b : a;
        this.wall.push(back);
        return keep;
      }
    }
    if (fromDead) {
      // 嶺上牌は王牌の端から。ドラ表示牌の位置(4,6,8,10,12)は動かさない
      const t = this.deadWall[this.rinshanIndex++];
      if (this.wall.length) this.deadWall.push(this.wall.pop());
      return t;
    }
    return this.wall.shift();
  }

  addKanDora() {
    this.kanCount++;
    const idx = 4 + this.kanCount * 2;
    if (this.deadWall[idx] !== undefined) {
      this.doraIndicators.push(this.deadWall[idx]);
      this.uraIndicators.push(this.deadWall[idx + 1]);
    }
  }

  isMenzen(p) { return p.melds.every((m) => m.type === 'ankan'); }

  handCounts(p) { return Engine.countsFromIds(p.hand); }

  waits(p) {
    const c = this.handCounts(p);
    if (p.hand.length % 3 !== 1) return [];
    return Engine.winningTiles(c, p.melds);
  }

  updateFuriten(p) {
    const w = this.waits(p);
    const own = new Set(p.discards.map((d) => Engine.kindOf(d.id)));
    p.furitenPermanent = w.some((k) => own.has(k));
    p.furiten = p.furitenPermanent || p.passedTiles.some((k) => w.includes(k));
  }

  canWin(p, winKind, winId, ctxExtra) {
    const hand = p.hand.concat([winId]);
    const ctx = Object.assign({
      handIds: hand, melds: p.melds, winTile: winKind, winId,
      tsumo: false, riichi: p.riichi && !p.doubleRiichi, doubleRiichi: p.doubleRiichi,
      ippatsu: p.ippatsu, bakaze: this.bakaze, jikaze: p.jikaze,
      isDealer: p.seat === this.dealer,
      doraIndicators: this.doraIndicators.map(Engine.kindOf),
      uraIndicators: this.uraIndicators.map(Engine.kindOf),
      honba: this.honba,
    }, ctxExtra || {});
    const res = Engine.evaluateHand(ctx);
    if (!res) return null;
    const c = this.cheat;
    if (c && p.seat === 0 && (c.bonusHan || c.bonusUra) && !res.yakuman) {
      if (c.bonusHan) res.yaku.push({ name: '秘技 数え上げ', han: c.bonusHan });
      if (c.bonusUra) res.yaku.push({ name: '秘技 裏乗せ', han: c.bonusUra });
      res.han += c.bonusHan + c.bonusUra;
      res.score = Engine.calcScore(res.han, res.fu, ctx.isDealer, ctx.tsumo, 0, this.honba);
    }
    const real = res.yaku.filter((y) => !['ドラ', '赤ドラ', '裏ドラ'].includes(y.name));
    if (real.length === 0) return null;
    return res;
  }

  /* ---------- 1局 ---------- */
  async playHand() {
    this.deal();
    this.io.update();
    await this.io.event(`${KAZE[this.bakaze - 27]}${((this.kyoku - 1) % 4) + 1}局 ${this.honba}本場`, 900);

    let turn = this.dealer;
    let firstRound = true;
    let turnState = 'draw';       // 'draw' | 'kan' | 'call'
    let forbid = null;            // 喰い替え禁止牌

    while (true) {
      const p = this.players[turn];
      let drawnId = null;

      if (turnState === 'draw' || turnState === 'kan') {
        if (turnState === 'draw' && this.wall.length === 0) return await this.exhaustiveDraw();
        drawnId = this.drawTile(turnState === 'kan', turn);
        p.passedTiles = [];
        this.updateFuriten(p);
      }
      const isHaitei = this.wall.length === 0;
      const rinshan = turnState === 'kan';
      this.currentDraw = drawnId === null ? null : { seat: turn, id: drawnId };
      this.io.update();

      if (p.isAI && this.cheat) {
        const tell = Cheat.aiMaybeCheat(this, p);
        if (tell && tell.noticed) await this.io.aiTell(tell);
      }
      if (drawnId !== null) { p.hand.push(drawnId); this.sortHand(p); }

      const calcTsumo = () => {
        if (drawnId === null) return null;
        const view = Object.assign({}, p, { hand: p.hand.filter((x) => x !== drawnId) });
        return this.canWin(view, Engine.kindOf(drawnId), drawnId, {
          tsumo: true, rinshan, haitei: isHaitei && !rinshan,
          tenhou: firstRound && turn === this.dealer && this.noCallsYet && p.discards.length === 0,
          chihou: firstRound && turn !== this.dealer && this.noCallsYet && p.discards.length === 0,
        });
      };

      const buildOptions = (tsumoRes) => {
        const options = {
          discard: true, tsumo: !!tsumoRes, riichi: false,
          ankan: [], kakan: [], kyuushu: false, forbid,
        };
        const menzen = this.isMenzen(p);
        if (drawnId !== null && !p.riichi && menzen && p.score >= 1000 && this.wall.length >= 4) {
          const c = Engine.countsFromIds(p.hand);
          for (let k = 0; k < 34; k++) {
            if (c[k] === 0) continue;
            c[k]--;
            const ok = Engine.shanten(c, p.melds) === 0 && Engine.winningTiles(c, p.melds).length > 0;
            c[k]++;
            if (ok) { options.riichi = true; break; }
          }
        }
        if (drawnId !== null && this.wall.length > 0) {
          const c = Engine.countsFromIds(p.hand);
          for (let k = 0; k < 34; k++) {
            if (c[k] !== 4) continue;
            if (p.riichi) {
              if (Engine.kindOf(drawnId) !== k) continue;
              const rest13 = p.hand.filter((x) => x !== drawnId);
              const before = Engine.winningTiles(Engine.countsFromIds(rest13), p.melds).join();
              const rest = p.hand.filter((id) => Engine.kindOf(id) !== k);
              const after = Engine.winningTiles(
                Engine.countsFromIds(rest), p.melds.concat([{ type: 'ankan', tile: k, tiles: [] }])
              ).join();
              if (before === after && before !== '') options.ankan.push(k);
            } else options.ankan.push(k);
          }
          if (!p.riichi) {
            for (const m of p.melds) {
              if (m.type === 'pon' && p.hand.some((id) => Engine.kindOf(id) === m.tile)) options.kakan.push(m.tile);
            }
          }
        }
        if (firstRound && this.noCallsYet && p.melds.length === 0 && p.discards.length === 0 && drawnId !== null) {
          const kinds = new Set(p.hand.map(Engine.kindOf).filter(Engine.isYaochu));
          if (kinds.size >= 9) options.kyuushu = true;
        }
        return options;
      };

      let action, tsumoRes, options;
      do {
        tsumoRes = calcTsumo();
        options = buildOptions(tsumoRes);
        if (p.isAI) {
          await this.io.aiPause();
          action = this.aiTurnAction(p, options, drawnId, tsumoRes);
        } else {
          action = await this.io.askTurn(p, options, drawnId);
        }
        if (action.type === 'accuse') {
          const r = Cheat.accuse(this);
          await this.io.accuseResult(r);
          if (r.chombo) {
            const culprit = r.hit ? this.players[r.seat] : this.players[0];
            this.payChombo(culprit);
            return await this.abortiveDraw(`${culprit.name}のイカサマ露見`);
          }
        }
      } while (action.type === 'accuse' || action.type === 'cheat');

      if (action.type === 'chombo') {
        this.payChombo(p);
        return await this.abortiveDraw('イカサマ露見');
      }

      if (action.type === 'tsumo') {
        p.hand = p.hand.filter((id) => id !== drawnId);
        return await this.finishWin(p, drawnId, tsumoRes, null);
      }
      if (action.type === 'kyuushu') {
        return await this.abortiveDraw('九種九牌');
      }
      if (action.type === 'ankan' || action.type === 'kakan') {
        const k = action.tile;
        if (action.type === 'ankan') {
          const tiles = p.hand.filter((id) => Engine.kindOf(id) === k);
          p.hand = p.hand.filter((id) => Engine.kindOf(id) !== k);
          p.melds.push({ type: 'ankan', tile: k, tiles, from: p.seat });
          for (const q of this.players) q.ippatsu = false;
          await this.io.event(`${p.name} 暗槓`, 700);
          this.addKanDora();
        } else {
          const meld = p.melds.find((m) => m.type === 'pon' && m.tile === k);
          const id = p.hand.find((x) => Engine.kindOf(x) === k);
          p.hand = p.hand.filter((x) => x !== id);
          meld.type = 'kakan'; meld.tiles.push(id);
          await this.io.event(`${p.name} 加槓`, 700);
          const ron = await this.checkChankan(p, id);
          if (ron) return ron;
          for (const q of this.players) q.ippatsu = false;
          this.addKanDora();
        }
        if (this.totalKans() >= 4 && this.kanPlayers() >= 2) return await this.abortiveDraw('四開槓');
        turnState = 'kan'; forbid = null;
        this.io.update();
        continue;
      }

      const discardId = action.tile;
      const declaringRiichi = action.type === 'riichi';
      if (declaringRiichi) {
        p.riichi = true;
        p.riichiTurn = this.globalTurn;
        p.doubleRiichi = firstRound && this.noCallsYet;
        p.score -= 1000;
        this.riichiSticks++;
        await this.io.event(`${p.name} リーチ`, 800);
      }
      p.hand = p.hand.filter((id) => id !== discardId);
      this.sortHand(p);
      p.discards.push({
        id: discardId, tsumogiri: discardId === drawnId,
        riichi: declaringRiichi, globalTurn: this.globalTurn,
      });
      this.lastDiscard = { seat: turn, id: discardId };
      this.currentDraw = null;
      this.globalTurn++;
      if (declaringRiichi) p.ippatsu = true;
      else p.ippatsu = false;
      this.updateFuriten(p);
      this.io.update();

      if (firstRound && this.globalTurn === 4 && this.noCallsYet) {
        const first = this.players.map((q) => q.discards[0]).filter(Boolean);
        if (first.length === 4) {
          const kinds = first.map((d) => Engine.kindOf(d.id));
          if (kinds.every((k) => k >= 27 && k <= 30 && k === kinds[0])) {
            return await this.abortiveDraw('四風連打');
          }
        }
      }
      if (this.players.every((q) => q.riichi)) return await this.abortiveDraw('四家立直');

      const resp = await this.resolveDiscard(turn, discardId, isHaitei);
      if (resp && resp.type === 'ron') return resp.result;
      if (resp && resp.type === 'call') {
        turn = resp.seat;
        turnState = resp.kan ? 'kan' : 'call';
        forbid = resp.forbid || null;
        firstRound = false;
        this.noCallsYet = false;
        if (resp.kan) {
          if (this.totalKans() >= 4 && this.kanPlayers() >= 2) return await this.abortiveDraw('四開槓');
          this.addKanDora();
        }
        continue;
      }

      if (this.wall.length === 0) return await this.exhaustiveDraw();
      turn = (turn + 1) % 4;
      if (turn === this.dealer) firstRound = false;
      turnState = 'draw';
      forbid = null;
    }
  }

  payChombo(culprit) {
    const isOya = culprit.seat === this.dealer;
    for (const q of this.players) {
      if (q === culprit) continue;
      const amt = isOya ? 4000 : (q.seat === this.dealer ? 4000 : 2000);
      q.score += amt;
      culprit.score -= amt;
    }
    if (this.cheat) {
      // 罰符を払えば一度は帳消し。ただし目は付いたまま
      if (culprit.seat === 0) { this.cheat.hand = []; this.cheat.suspicion = 1; }
      else culprit.suspicion = 1;
    }
  }

  totalKans() {
    return this.players.reduce(
      (a, q) => a + q.melds.filter((m) => ['ankan', 'minkan', 'kakan'].includes(m.type)).length, 0);
  }
  kanPlayers() {
    return this.players.filter(
      (q) => q.melds.some((m) => ['ankan', 'minkan', 'kakan'].includes(m.type))).length;
  }

  /* ---------- CPUの手番行動 ---------- */
  aiTurnAction(p, options, drawnId, tsumoRes) {
    if (options.tsumo) return { type: 'tsumo' };
    if (options.kyuushu && Engine.shanten(Engine.countsFromIds(p.hand), p.melds) >= 3) {
      return { type: 'kyuushu' };
    }
    if (options.ankan.length && AI.shouldKan(this, p, 'ankan')) {
      return { type: 'ankan', tile: options.ankan[0] };
    }
    if (options.kakan.length && AI.shouldKan(this, p, 'kakan')) {
      return { type: 'kakan', tile: options.kakan[0] };
    }
    if (p.riichi) return { type: 'discard', tile: drawnId };

    const best = AI.chooseDiscard(this, p, options.forbid);
    if (options.riichi && best) {
      // リーチ可能な打牌の中から選ぶ
      const c = Engine.countsFromIds(p.hand);
      const cands = [];
      const seen = new Set();
      for (const id of p.hand) {
        const k = Engine.kindOf(id);
        if (seen.has(k)) continue; seen.add(k);
        c[k]--;
        if (Engine.shanten(c, p.melds) === 0) cands.push(id);
        c[k]++;
      }
      if (cands.length) {
        let pick = cands.includes(best.id) ? best.id : null;
        if (!pick) {
          let bestCount = -1;
          for (const id of cands) {
            const cc = Engine.countsFromIds(p.hand); cc[Engine.kindOf(id)]--;
            const rem = AI.remaining(this, p);
            const n = Engine.winningTiles(cc, p.melds).reduce((a, k) => a + rem[k], 0);
            if (n > bestCount) { bestCount = n; pick = id; }
          }
        }
        if (AI.shouldRiichi(this, p, pick)) return { type: 'riichi', tile: pick };
      }
    }
    return { type: 'discard', tile: best ? best.id : p.hand[p.hand.length - 1] };
  }

  /* ---------- 打牌に対する反応 ---------- */
  async resolveDiscard(from, tileId, isHaitei) {
    const kind = Engine.kindOf(tileId);
    const cands = [];
    for (let i = 1; i <= 3; i++) {
      const seat = (from + i) % 4;
      const p = this.players[seat];
      const opt = { ron: null, pon: null, kan: null, chi: [] };

      this.updateFuriten(p);
      const cc = this.cheat;
      const furitenOK = (!p.furiten && !p.furitenPermanent)
        || (p.seat === 0 && cc && cc.ignoreFuriten);
      if (furitenOK) {
        const res = this.canWin(p, kind, tileId, {
          tsumo: false, houtei: isHaitei,
        });
        if (res) opt.ron = res;
      }
      if (!p.riichi && this.wall.length > 0 && !(cc && cc.noCall.has(seat))) {
        const same = p.hand.filter((id) => Engine.kindOf(id) === kind);
        if (same.length >= 2) opt.pon = same.slice(0, 2);
        if (same.length >= 3) opt.kan = same.slice(0, 3);
        if (i === 1 && kind < 27) {
          const n = kind % 9, base = kind - n;
          const pick = (a, b) => {
            const x = p.hand.find((id) => Engine.kindOf(id) === base + a);
            const y = p.hand.find((id) => Engine.kindOf(id) === base + b);
            return x !== undefined && y !== undefined ? [x, y] : null;
          };
          if (n >= 2) { const t = pick(n - 2, n - 1); if (t) opt.chi.push(t); }
          if (n >= 1 && n <= 7) { const t = pick(n - 1, n + 1); if (t) opt.chi.push(t); }
          if (n <= 6) { const t = pick(n + 1, n + 2); if (t) opt.chi.push(t); }
        }
      }
      if (opt.ron || opt.pon || opt.kan || opt.chi.length) cands.push({ seat, p, opt });
    }
    if (!cands.length) return null;

    // ロン優先（頭ハネ）
    const decisions = [];
    for (const c of cands) {
      let act;
      if (c.p.isAI) act = this.aiCallAction(c.p, c.opt, tileId);
      else { this.io.update(); act = await this.io.askCall(c.p, c.opt, tileId, from); }
      decisions.push({ ...c, act });
    }
    const ronDec = decisions.filter((d) => d.act.type === 'ron');
    if (ronDec.length && this.cheat && this.cheat.voidDealIn && from === 0) {
      this.cheat.voidDealIn = false;
      await this.io.event('なかったこと', 900);
      return { type: 'ron', result: await this.abortiveDraw('見なかったことに') };
    }
    if (ronDec.length) {
      ronDec.sort((a, b) => ((a.seat - from + 4) % 4) - ((b.seat - from + 4) % 4));
      const d = ronDec[0];
      return { type: 'ron', result: await this.finishWin(d.p, tileId, d.opt.ron, this.players[from]) };
    }
    for (const d of decisions) {
      if (d.act.type === 'pass' && d.opt.ron) {
        d.p.passedTiles.push(kind);
        this.updateFuriten(d.p);
      }
    }
    const call = decisions.find((d) => ['pon', 'kan'].includes(d.act.type))
      || decisions.find((d) => d.act.type === 'chi');
    if (!call) return null;

    const p = call.p;
    const used = call.act.tiles;
    p.hand = p.hand.filter((id) => !used.includes(id));
    const type = call.act.type === 'kan' ? 'minkan' : call.act.type;
    p.melds.push({ type, tile: kind, tiles: used.concat([tileId]), from });
    this.players[from].discards.pop();
    this.lastCall = { seat: p.seat, type };
    const forbid = new Set([kind]);
    if (type === 'chi') {
      const ks = used.map(Engine.kindOf).sort((a, b) => a - b);
      if (ks[0] === kind + 1 && ks[1] === kind + 2 && kind % 9 <= 5) forbid.add(kind + 3);
      if (ks[0] === kind - 2 && ks[1] === kind - 1 && kind % 9 >= 3) forbid.add(kind - 3);
    }
    for (const q of this.players) q.ippatsu = false;
    const label = { pon: 'ポン', chi: 'チー', minkan: 'カン' }[type];
    await this.io.event(`${p.name} ${label}`, 700);
    this.io.update();
    return { type: 'call', seat: p.seat, kan: type === 'minkan', forbid };
  }

  aiCallAction(p, opt, tileId) {
    if (opt.ron) return { type: 'ron' };
    if (opt.kan && AI.shouldKan(this, p, 'minkan')) return { type: 'kan', tiles: opt.kan };
    if (opt.pon && AI.shouldCall(this, p, tileId, 'pon', opt.pon)) return { type: 'pon', tiles: opt.pon };
    for (const t of opt.chi) {
      if (AI.shouldCall(this, p, tileId, 'chi', t)) return { type: 'chi', tiles: t };
    }
    return { type: 'pass' };
  }

  async checkChankan(kanPlayer, tileId) {
    const kind = Engine.kindOf(tileId);
    for (let i = 1; i <= 3; i++) {
      const p = this.players[(kanPlayer.seat + i) % 4];
      this.updateFuriten(p);
      if (p.furiten || p.furitenPermanent) continue;
      const res = this.canWin(p, kind, tileId, { tsumo: false, chankan: true });
      if (!res) continue;
      let act;
      if (p.isAI) act = { type: 'ron' };
      else act = await this.io.askCall(p, { ron: res, pon: null, kan: null, chi: [] }, tileId, kanPlayer.seat);
      if (act.type === 'ron') {
        const meld = kanPlayer.melds.find((m) => m.type === 'kakan' && m.tile === kind);
        meld.type = 'pon';
        meld.tiles = meld.tiles.filter((x) => x !== tileId);
        return await this.finishWin(p, tileId, res, kanPlayer);
      }
      p.passedTiles.push(kind);
    }
    return null;
  }

  /* ---------- 和了処理 ---------- */
  async finishWin(winner, winId, result, loser) {
    const payments = [];
    const isDealer = winner.seat === this.dealer;
    const s = result.score;
    if (!loser) {
      for (const p of this.players) {
        if (p === winner) continue;
        const amt = isDealer ? s.each : (p.seat === this.dealer ? s.oya : s.ko);
        p.score -= amt;
        payments.push({ seat: p.seat, amount: -amt });
      }
      winner.score += s.total;
    } else {
      let payer = loser;
      if (this.cheat && loser.seat === 0 && this.cheat.scapegoat !== null
          && this.cheat.scapegoat !== undefined && this.cheat.scapegoat !== winner.seat) {
        payer = this.players[this.cheat.scapegoat];
        this.cheat.scapegoat = null;
      }
      payer.score -= s.total;
      winner.score += s.total;
      payments.push({ seat: payer.seat, amount: -s.total });
    }
    winner.score += this.riichiSticks * 1000;
    const sticks = this.riichiSticks;
    this.riichiSticks = 0;

    await this.io.result({
      type: 'win', winner, loser, result, winId, payments, sticks,
      hand: winner.hand.slice(), melds: winner.melds.slice(),
      doraIndicators: this.doraIndicators.slice(),
      uraIndicators: (winner.riichi ? this.uraIndicators.slice(0, this.doraIndicators.length) : []),
    });

    const renchan = winner.seat === this.dealer;
    return this.nextKyoku(renchan, false);
  }

  async exhaustiveDraw() {
    const tenpai = [];
    for (const p of this.players) {
      const st = Engine.shanten(this.handCounts(p), p.melds);
      const isTenpai = st === 0 && Engine.winningTiles(this.handCounts(p), p.melds).length > 0;
      p.tenpaiAtDraw = isTenpai;
      if (isTenpai) tenpai.push(p);
    }
    const n = tenpai.length;
    if (n > 0 && n < 4) {
      const gain = 3000 / n, loss = 3000 / (4 - n);
      for (const p of this.players) p.score += p.tenpaiAtDraw ? gain : -loss;
    }
    await this.io.result({ type: 'draw', reason: '流局', tenpai: this.players.map((p) => p.tenpaiAtDraw) });
    const dealerTenpai = this.players[this.dealer].tenpaiAtDraw;
    return this.nextKyoku(dealerTenpai, true);
  }

  async abortiveDraw(reason) {
    await this.io.result({ type: 'draw', reason, tenpai: null });
    return this.nextKyoku(true, true);
  }

  nextKyoku(renchan, isDraw) {
    if (this.players.some((p) => p.score < 0)) { this.finished = true; return 'end'; }
    if (renchan) {
      this.honba++;
      if (this.kyoku > this.maxKyoku) { this.finished = true; return 'end'; }
      return 'continue';
    }
    this.honba = isDraw ? this.honba + 1 : 0;
    this.kyoku++;
    this.dealer = (this.dealer + 1) % 4;
    if (this.kyoku > this.maxKyoku) { this.finished = true; return 'end'; }
    if (this.kyoku > 4) this.bakaze = 28;
    return 'continue';
  }

  async run() {
    while (!this.finished) {
      const r = await this.playHand();
      if (r === 'end') break;
    }
    await this.io.gameOver(this.rankings());
  }

  rankings() {
    return this.players
      .map((p) => ({ seat: p.seat, name: p.name, score: p.score }))
      .sort((a, b) => b.score - a.score);
  }
}

/* ===== ui.js ===== */
/* ============================================================
   画面表示と入力
   ============================================================ */

const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- 牌の絵 ---------- */
const faceCache = {};

/* 牌の絵は tiles/ のSVGを読む。
   FluffyStuff / riichi-mahjong-tiles（CC0）。出典は tiles/LICENSE.txt。
   自前で描いていた頃より字も図柄も本物に近い。 */
const TILE_FILE = (() => {
  const names = [];
  for (const suit of ['Man', 'Pin', 'Sou']) {
    for (let i = 1; i <= 9; i++) names.push(suit + i);
  }
  return names.concat(['Ton', 'Nan', 'Shaa', 'Pei', 'Haku', 'Hatsu', 'Chun']);
})();
/* 赤5は専用の絵がある */
const RED_FILE = { 4: 'Man5-Dora', 13: 'Pin5-Dora', 22: 'Sou5-Dora' };

function tileFaceSVG(kind, red) {
  const key = kind + (red ? 'r' : '');
  if (faceCache[key]) return faceCache[key];
  const name = (red && RED_FILE[kind]) || TILE_FILE[kind];
  const html = `<img class="face" src="tiles/${name}.svg" alt="" draggable="false">`;
  faceCache[key] = html;
  return html;
}

function tileHTML(id, size = 'big', cls = '', data = '') {
  return `<span class="tile ${size} ${cls}" ${data}>${tileFaceSVG(kindOf(id), Engine.isRed(id))}</span>`;
}
function backHTML(size = 'small') {
  return `<span class="tile ${size} hidden-back"></span>`;
}

/* ---------- 表示 ---------- */
const UI = {
  game: null,
  pending: null,
  riichiSelect: false,
  showHints: true,
  speed: 520,

  render() {
    const g = this.game;
    if (!g) return;
    this._maxThreat = Math.max(0, ...g.players.slice(1).map((o) => AI.threatLevel(g, o)));
    const bySeat = (r) => g.players[r % 4];

    // 中央情報
    const kyokuLabel = `${KAZE[g.bakaze - 27]}${((g.kyoku - 1) % 4) + 1}局`;
    $('#info').innerHTML = `
      <div class="kyoku">${kyokuLabel}</div>
      <div class="wall">${g.honba}本場 ・ 残り${g.wall.length}枚</div>
      <div id="dora">${g.doraIndicators.map((d) => tileHTML(d, 'tiny')).join('')}</div>
      ${g.riichiSticks ? `<div>${'<span class="riichi-stick"></span>'.repeat(Math.min(g.riichiSticks, 4))}</div>` : ''}
      ${g.cheat ? `<div class="cheatinfo">疑い ${'●'.repeat(g.cheat.suspicion) || '無'}
        ／ 技 ${g.cheat.hand.length}枚</div>` : ''}
      ${g.cheat && g.cheat.peek ? `<div class="peek">山 ${g.cheat.peek.map((id) => tileHTML(id, 'tiny')).join('')}</div>` : ''}
      <div class="scores">${[0, 1, 2, 3].map((i) => {
        const p = g.players[i];
        return `<div class="${i === 0 ? 'me' : ''} ${i === g.dealer ? 'dealer-dot' : ''}">
          ${i === 0 && p.face ? `<span class="oppFace"><img src="${p.face}" alt=""
            onerror="this.remove()"></span>` : ''}
          ${p.name} <b>${p.score}</b></div>`;
      }).join('')}</div>`;

    // 対局者
    const c = g.cheat;
    const KAZE_CH = ['東', '南', '西', '北'];
    const oppHTML = (p, vert) => `
      <div class="opp ${vert ? 'vert' : ''}">
        <div class="oppName">
          ${p.face ? `<span class="oppFace"><img src="${p.face}" alt=""
            onerror="this.remove()"></span>` : ''}
          <span class="oppKaze">${KAZE_CH[p.jikaze - 27] || ''}</span>
          <span class="oppWho">${p.name}</span>
          <span class="oppScore">${p.score}</span>
        </div>
        <div class="backs ${vert ? 'vert' : ''}">${
          c && c.reveal.has(p.seat)
            ? p.hand.map((id) => tileHTML(id, 'tiny')).join('')
            : Array(Math.max(0, p.hand.length)).fill(backHTML('tiny')).join('')}</div>
        ${c && c.showWaits.has(p.seat) ? `<div class="waits">待${
          Engine.winningTiles(Engine.countsFromIds(p.hand), p.melds).map(jpName).join('') || '無'}</div>` : ''}
        ${p.suspicion ? '<span class="susp">疑</span>' : ''}
        <div class="melds">${p.melds.map((m) => meldHTML(m, 'tiny')).join('')}</div>
        ${p.riichi ? '<span style="color:var(--vermilion)">立</span>' : ''}
      </div>`;
    $('#top').innerHTML = oppHTML(bySeat(2), false);
    $('#left').innerHTML = oppHTML(bySeat(3), true);
    $('#right').innerHTML = oppHTML(bySeat(1), true);

    // 河
    const riverHTML = (p, side) => p.discards.map((d, i) => {
      const last = g.lastDiscard && g.lastDiscard.seat === p.seat && i === p.discards.length - 1;
      const t = tileHTML(d.id, 'small',
        (d.riichi ? 'riichi ' : '') + (d.tsumogiri ? 'tsumogiri ' : '') + (last ? 'last' : ''));
      return side ? `<span class="cell ${d.riichi ? 'riichi' : ''}">${t}</span>` : t;
    }).join('');
    $('#river-bottom').innerHTML = riverHTML(bySeat(0), false);
    $('#river-right').innerHTML = riverHTML(bySeat(1), true);
    $('#river-top').innerHTML = riverHTML(bySeat(2), false);
    $('#river-left').innerHTML = riverHTML(bySeat(3), true);

    // 自分
    const me = g.players[0];
    $('#melds-row').innerHTML = me.melds.map((m) => meldHTML(m, 'small')).join('');
    const drawn = g.currentDraw && g.currentDraw.seat === 0 ? g.currentDraw.id : null;
    const hand = me.hand.filter((id) => id !== drawn);
    const selectable = this.pending && this.pending.type === 'turn';
    const allowed = this.allowedDiscards();
    const cell = (id, extra) => {
      const ok = selectable && (!allowed || allowed.has(id));
      const picked = this._selected === id ? 'picked ' : '';
      return tileHTML(id, 'big',
        picked + (ok ? 'selectable ' : (selectable ? 'dim ' : '')) + (extra || ''),
        `data-id="${id}"`) + (ok ? this.hintBar(id) : '');
    };
    $('#handrow').innerHTML = hand.map((id) => `<span class="tilewrap">${cell(id)}</span>`).join('')
      + (drawn !== null ? `<span class="tilewrap drawn">${cell(drawn, 'drawn')}</span>` : '');

    $('#handrow').querySelectorAll('.tile.selectable').forEach((el) => {
      el.onclick = () => this.onTileClick(+el.dataset.id);
    });
    this.renderHintText();
  },

  hintBar(id) {
    const forced = this.game.cheat && this.game.cheat.forceHints;
    if ((!this.showHints && !forced) || this._maxThreat < 0.5) return '';
    const g = this.game;
    const d = AI.totalDanger(g, g.players[0], kindOf(id));
    const c = d === 0 ? '#2e7d5b' : d < 2 ? '#b6a12e' : d < 5 ? '#c47b2a' : '#c0392b';
    return `<span class="hintbar" style="background:${c}"></span>`;
  },

  renderHintText() {
    const g = this.game, me = g.players[0];
    if (!this.pending || this.pending.type !== 'turn') { $('#hintbox').textContent = ''; return; }
    if (this._selected !== null && this._selected !== undefined) {
      $('#hintbox').textContent = `${jpName(kindOf(this._selected))} — もう一度たたくと切る`;
      return;
    }
    if (!this.showHints) { $('#hintbox').textContent = ''; return; }
    const c = Engine.countsFromIds(me.hand);
    const n = me.hand.length % 3 === 2 ? 1 : 0;
    let s;
    if (n) {
      let bestS = 9;
      for (let k = 0; k < 34; k++) { if (!c[k]) continue; c[k]--; bestS = Math.min(bestS, Engine.shanten(c, me.melds)); c[k]++; }
      s = bestS;
    } else s = Engine.shanten(c, me.melds);
    const label = s < 0 ? '和了' : s === 0 ? 'テンパイ' : `${s}シャンテン`;
    const threat = g.players.slice(1).some((p) => p.riichi) ? ' ・ 他家リーチ中' : '';
    const furiten = me.furiten || me.furitenPermanent ? ' ・ フリテン' : '';
    $('#hintbox').textContent = label + threat + furiten;
  },

  allowedDiscards() {
    if (!this.pending || this.pending.type !== 'turn') return null;
    const g = this.game, me = g.players[0], opts = this.pending.options;
    let set = null;
    if (this.riichiSelect) {
      set = new Set();
      const c = Engine.countsFromIds(me.hand);
      for (const id of me.hand) {
        const k = kindOf(id);
        c[k]--;
        if (Engine.shanten(c, me.melds) === 0 && Engine.winningTiles(c, me.melds).length) set.add(id);
        c[k]++;
      }
      return set;
    }
    if (me.riichi) {
      const drawn = g.currentDraw && g.currentDraw.seat === 0 ? g.currentDraw.id : null;
      return new Set(drawn === null ? [] : [drawn]);
    }
    if (opts.forbid && opts.forbid.size) {
      set = new Set(me.hand.filter((id) => !opts.forbid.has(kindOf(id))));
    }
    return set;
  },

  onTileClick(id) {
    if (!this.pending || this.pending.type !== 'turn') return;
    const allowed = this.allowedDiscards();
    if (allowed && !allowed.has(id)) return;
    if (this._selected !== id) {      // 一度目は選ぶだけ
      this._selected = id;
      this.render();
      return;
    }
    const type = this.riichiSelect ? 'riichi' : 'discard';
    this.riichiSelect = false;
    this._selected = null;
    this.resolve({ type, tile: id });
  },

  resolve(action) {
    this._selected = null;
    const p = this.pending;
    this.pending = null;
    $('#actions').innerHTML = '';
    this.render();
    if (p) p.resolve(action);
  },

  buttons(list) {
    const bar = $('#actions');
    bar.innerHTML = '';
    for (const b of list) {
      const el = document.createElement('button');
      el.className = 'act' + (b.primary ? ' primary' : '') + (b.ghost ? ' ghost' : '');
      el.innerHTML = b.label;
      el.onclick = b.onClick;
      bar.appendChild(el);
    }
  },

  /* ---- 手番の入力 ---- */
  askTurn(p, options, drawnId) {
    return new Promise((resolve) => {
      this.pending = { type: 'turn', options, resolve };
      this.riichiSelect = false;
      this._selected = null;
      const btns = [];
      if (options.tsumo) btns.push({ label: 'ツモ', primary: true, onClick: () => this.resolve({ type: 'tsumo' }) });
      if (options.riichi) {
        btns.push({
          label: 'リーチ',
          onClick: () => {
            this.riichiSelect = true;
            this._selected = null;
            this.render();
            this.buttons([{ label: 'やめる', ghost: true, onClick: () => { this.riichiSelect = false; this.askTurnButtons(options); this.render(); } }]);
          },
        });
      }
      for (const k of options.ankan) btns.push({ label: '暗槓', onClick: () => this.resolve({ type: 'ankan', tile: k }) });
      for (const k of options.kakan) btns.push({ label: '加槓', onClick: () => this.resolve({ type: 'kakan', tile: k }) });
      if (options.kyuushu) btns.push({ label: '九種九牌', onClick: () => this.resolve({ type: 'kyuushu' }) });
      this._turnButtons = btns;
      this.buttons(btns);
      this.render();

      // リーチ後は自動でツモ切り
      if (p.riichi && !options.tsumo && !options.ankan.length) {
        setTimeout(() => {
          if (this.pending && this.pending.resolve === resolve) this.resolve({ type: 'discard', tile: drawnId });
        }, this.speed);
      }
    });
  },
  askTurnButtons(options) { this.buttons(this._turnButtons || []); },

  /* ---- 鳴き・ロンの入力 ---- */
  askCall(p, opt, tileId, from) {
    return new Promise((resolve) => {
      this.pending = { type: 'call', resolve };
      const btns = [];
      if (opt.ron) btns.push({ label: 'ロン', primary: true, onClick: () => this.resolve({ type: 'ron' }) });
      if (opt.kan) btns.push({ label: 'カン', onClick: () => this.resolve({ type: 'kan', tiles: opt.kan }) });
      if (opt.pon) btns.push({ label: 'ポン', onClick: () => this.resolve({ type: 'pon', tiles: opt.pon }) });
      if (opt.chi.length === 1) {
        btns.push({ label: 'チー', onClick: () => this.resolve({ type: 'chi', tiles: opt.chi[0] }) });
      } else if (opt.chi.length > 1) {
        for (const t of opt.chi) {
          const label = 'チー ' + t.map((id) => jpName(kindOf(id))).join('');
          btns.push({ label, onClick: () => this.resolve({ type: 'chi', tiles: t }) });
        }
      }
      btns.push({ label: 'パス', ghost: true, onClick: () => this.resolve({ type: 'pass' }) });
      this.buttons(btns);
      this.render();
    });
  },

  async event(text, ms) {
    const t = $('#toast');
    t.textContent = text;
    t.className = 'show' + (/ポン|チー|カン|リーチ|暗槓|加槓/.test(text) ? ' call' : '');
    await sleep(ms || 700);
    t.className = '';
    await sleep(120);
  },

  async result(data) {
    const g = this.game;
    const panel = $('#overlay .panel');
    if (data.type === 'win') {
      const r = data.result;
      const yakuRows = r.yaku.map((y) =>
        `<div>${y.name}</div><div class="h">${y.yakuman ? '役満' : y.han + '翻'}</div>`).join('');
      const winTiles = data.hand.slice().sort((a, b) => kindOf(a) - kindOf(b));
      panel.innerHTML = `
        <h2>${data.loser ? 'ロン和了' : 'ツモ和了'} — ${data.winner.name}</h2>
        <div class="hand-view">
          ${winTiles.map((id) => tileHTML(id, 'small')).join('')}

const JP_SUIT = ['萬', '筒', '索'];
function jpName(k) {
  if (k < 27) return (k % 9 + 1) + JP_SUIT[Math.floor(k / 9)];
  return ['東', '南', '西', '北', '白', '發', '中'][k - 27];
}

function meldHTML(m, size) {
  if (m.type === 'ankan') {
    return `<span class="meld">${backHTML(size)}${tileHTML(m.tiles[1], size)}${tileHTML(m.tiles[2], size)}${backHTML(size)}</span>`;
  }
  const tiles = m.tiles.slice().sort((a, b) => kindOf(a) - kindOf(b));
  return `<span class="meld">${tiles.map((id) => tileHTML(id, size)).join('')}</span>`;
}

  const panel = $('#overlay .panel');

    + `<div class="opt">${buttons.map((b) =>
      `<button class="act ${b.primary ? 'primary' : ''} ${b.ghost ? 'ghost' : ''}" data-v="${b.v}">${b.label}</button>`
    ).join('')}</div>`;
  $('#overlay').classList.add('show');
  return new Promise((res) => {
    panel.querySelectorAll('[data-v]').forEach((el) => {
      el.onclick = () => { $('#overlay').classList.remove('show'); res(el.dataset.v); };
    });
  });
