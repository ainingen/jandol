<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雀ドル発掘放浪記</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%2313201c%22/%3E%3Crect%20x%3D%228%22%20y%3D%225%22%20width%3D%2216%22%20height%3D%2222%22%20rx%3D%223%22%20fill%3D%22%23f7f1e4%22/%3E%3Ctext%20x%3D%2216%22%20y%3D%2217%22%20text-anchor%3D%22middle%22%20font-size%3D%2212%22%20font-family%3D%22serif%22%20fill%3D%22%23c0392b%22%3E%E9%9B%80%3C/text%3E%3Ctext%20x%3D%2216%22%20y%3D%2225%22%20text-anchor%3D%22middle%22%20font-size%3D%228%22%20font-family%3D%22serif%22%20fill%3D%22%238c2f28%22%3E%E8%90%AC%3C/text%3E%3C/svg%3E">
<style>
/* ===== style.css ===== */
:root{
  --urushi:#0c1512;        /* 卓の漆 */
  --urushi-2:#132420;
  --felt:#16382e;          /* 羅紗 */
  --gold:#c9a24a;
  --gold-dim:#6d5b2c;
  --ivory:#f2ece0;
  --ivory-2:#ddd3c0;
  --ink:#22201c;
  --vermilion:#c0392b;
  --bamboo:#2e7d5b;
  --indigo:#2a5b93;
  --back:#1f5646;          /* 牌の背 */
  --back-2:#164236;
  --text:#e8e2d4;
  --muted:#93a09a;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --tw:clamp(22px,calc((100vw - 26px)/14),36px);   /* 手牌の幅 */
  --rw:clamp(14px,3.5vw,20px);   /* 河の幅 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,var(--urushi-2),var(--urushi) 70%);
  color:var(--text);font-family:var(--sans);overscroll-behavior:none;
  display:flex;justify-content:center;
}
#app{width:100%;max-width:760px;display:flex;flex-direction:column;min-height:100dvh;padding:6px}

/* ---------- 卓 ---------- */
#table{
  flex:1;display:grid;gap:2px;
  grid-template-columns:auto 1fr auto;
  grid-template-rows:auto 1fr auto;
  align-items:center;justify-items:center;
  background:
    linear-gradient(var(--felt),#11302a);
  border:1px solid var(--gold-dim);
  border-radius:10px;padding:6px;position:relative;min-height:0;
  box-shadow:inset 0 0 40px rgba(0,0,0,.55);
}
.opp{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.opp.vert{flex-direction:column}
.backs{display:flex;gap:1px}
.backs.vert{flex-direction:column}
.back{
  width:calc(var(--rw)*.8);height:calc(var(--rw)*1.05);border-radius:2px;
  background:linear-gradient(160deg,var(--back),var(--back-2));
  border:1px solid rgba(0,0,0,.4);
}
.backs.vert .back{width:calc(var(--rw)*1.05);height:calc(var(--rw)*.8)}

#center{
  display:grid;gap:1px;
  grid-template-columns:auto auto auto;
  grid-template-rows:auto auto auto;
  align-items:center;justify-items:center;
}
.river{display:grid;grid-template-columns:repeat(6,auto);gap:1px;align-content:start;justify-content:center;min-width:calc(var(--rw)*6.4)}
.river.side{grid-auto-flow:column;grid-template-columns:none;grid-template-rows:repeat(6,auto);min-width:0;min-height:calc(var(--rw)*6.4)}
.river .tile.riichi{transform:rotate(90deg);margin:0 calc(var(--rw)*.18)}
.river.side .cell{width:calc(var(--rw)*1.4);height:var(--rw);display:flex;align-items:center;justify-content:center}
.river.side .cell .tile{transform:rotate(90deg)}
.river.side .cell.riichi .tile{transform:none}
#top{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#right{grid-column:3;grid-row:2}
#center{grid-column:2;grid-row:2}
#left,#right{max-width:calc(var(--rw)*3.4)}
#river-top{grid-column:2;grid-row:1}
#river-left{grid-column:1;grid-row:2}
#info{grid-column:2;grid-row:2}
#river-right{grid-column:3;grid-row:2}
#river-bottom{grid-column:2;grid-row:3}

#info{
  min-width:104px;padding:8px 10px;text-align:center;
  background:rgba(0,0,0,.42);border:1px solid var(--gold-dim);border-radius:6px;
  font-size:11px;line-height:1.5;
}
#info .kyoku{font-family:var(--mincho);font-size:19px;letter-spacing:.06em;color:var(--gold)}
#info .wall{color:var(--muted)}
#dora{display:flex;gap:2px;justify-content:center;margin-top:4px}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 8px;margin-top:6px;font-size:10.5px}
.scores b{font-weight:600}
.scores .me{color:var(--gold)}
.dealer-dot::after{content:"親";font-size:9px;color:var(--vermilion);margin-left:2px}

/* ---------- 牌 ---------- */
.tile{
  display:inline-block;position:relative;border-radius:3px;
  background:linear-gradient(175deg,#fffdf6,var(--ivory) 55%,var(--ivory-2));
  box-shadow:0 1px 0 #b8ae9a,0 2px 3px rgba(0,0,0,.45);
  line-height:0;flex:none;
}
.tile svg{display:block;width:100%;height:100%}
.tile.small{width:var(--rw);height:calc(var(--rw)*1.35)}
.tile.big{width:var(--tw);height:calc(var(--tw)*1.36)}
.tile.tiny{width:calc(var(--rw)*.85);height:calc(var(--rw)*1.15)}
.tile.rot{transform:rotate(90deg);margin:0 calc((var(--rw)*.35)/2)}
.tile.tsumogiri{filter:brightness(.9)}
.tile.riichi-d{transform:rotate(90deg);margin:0 calc((var(--rw)*.35)/2)}
.tile.last{outline:2px solid var(--vermilion);outline-offset:-1px}
.tile.hidden-back{background:linear-gradient(160deg,var(--back),var(--back-2))}

/* ---------- 自分の領域 ---------- */
#myarea{padding:6px 2px 2px}
#melds-row{display:flex;gap:6px;justify-content:flex-end;min-height:0;margin-bottom:4px}
.meld{display:flex;gap:1px}
#handrow{display:flex;gap:1px;justify-content:center;align-items:flex-end;min-height:calc(var(--tw)*1.36)}
#handrow .drawn{margin-left:8px}
.tile.selectable{cursor:pointer;transition:transform .12s}
.tile.selectable:hover{transform:translateY(-5px)}
.tile.picked{transform:translateY(-12px) scale(1.22);z-index:5;
  box-shadow:0 6px 12px rgba(0,0,0,.6),0 0 0 2px var(--gold)}
.tile.picked:hover{transform:translateY(-12px) scale(1.22)}
.tile.dim{opacity:.35}
.hintbar{position:absolute;bottom:-4px;left:10%;width:80%;height:3px;border-radius:2px;pointer-events:none}
#actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;min-height:38px}
button.act{
  font-family:var(--mincho);font-size:15px;letter-spacing:.08em;
  padding:7px 15px;border-radius:4px;cursor:pointer;
  background:linear-gradient(#2b2620,#191512);color:var(--ivory);
  border:1px solid var(--gold-dim);
}
button.act:active{transform:translateY(1px)}
button.act.primary{background:linear-gradient(#a8352a,#7d251c);border-color:#e08b7f;color:#fff}
button.act.ghost{background:transparent;color:var(--muted)}
.chi-choice{display:flex;gap:4px;align-items:center}

/* ---------- 演出・オーバーレイ ---------- */
#toast{
  position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);
  font-family:var(--mincho);font-size:34px;letter-spacing:.14em;color:var(--ivory);
  text-shadow:0 2px 14px #000;pointer-events:none;opacity:0;transition:opacity .18s;
}
#toast.show{opacity:1}
#toast.call{color:var(--gold)}
#toast.win{color:#ffd98a}
#overlay{
  position:fixed;inset:0;background:rgba(5,10,8,.86);display:none;
  align-items:center;justify-content:center;padding:14px;overflow:auto;z-index:20;
}
#overlay.show{display:flex}
.panel{
  width:100%;max-width:460px;background:linear-gradient(#15211d,#0d1512);
  border:1px solid var(--gold-dim);border-radius:8px;padding:16px;
}
.panel h2{font-family:var(--mincho);font-size:20px;margin:0 0 10px;color:var(--gold);letter-spacing:.08em}
.yaku-list{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin:10px 0}
.yaku-list .h{color:var(--muted)}
.total{font-family:var(--mincho);font-size:26px;color:#ffd98a;text-align:right;margin-top:6px}
.hand-view{display:flex;gap:2px;flex-wrap:wrap;margin:8px 0}
.hand-view .win{margin-left:8px}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.rank-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:7px 2px;border-bottom:1px solid #23302b;font-size:15px}
.rank-row .r{font-family:var(--mincho);color:var(--gold)}
#start .panel{text-align:center}
.opt{display:flex;gap:8px;justify-content:center;margin:10px 0}
.opt button{flex:1}
.opt button.on{border-color:var(--gold);color:var(--gold)}
.title{font-family:var(--mincho);font-size:30px;letter-spacing:.3em;color:var(--ivory);margin:6px 0 2px}
.title-sub{font-size:12px;color:var(--muted);letter-spacing:.2em;margin-bottom:14px}
#hintbox{font-size:11px;color:var(--muted);text-align:center;min-height:15px;margin-top:2px}
.riichi-stick{width:34px;height:4px;background:var(--ivory);border-radius:2px;position:relative;display:inline-block;margin:0 2px}
.riichi-stick::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;background:var(--vermilion)}
#start{position:fixed;inset:0;background:rgba(5,10,8,.94);display:flex;align-items:center;
  justify-content:center;padding:14px;z-index:30;overflow:auto}
#start:not(.show){display:none}
#start .sub{margin-top:12px}
.tilewrap{display:inline-block;position:relative}

.cheatinfo{color:var(--gold);font-size:10.5px;margin-top:3px}
.peek{margin-top:3px;display:flex;gap:1px;justify-content:center}
.waits{font-size:10px;color:var(--gold)}
.susp{color:var(--vermilion);font-size:11px}
.cards{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.card{border:1px solid var(--gold-dim);border-radius:5px;padding:9px 11px;cursor:pointer;
  background:rgba(255,255,255,.03)}
.card.off{opacity:.4;cursor:default}
.card .cname{font-family:var(--mincho);font-size:17px;color:var(--ivory);
  display:flex;justify-content:space-between;align-items:baseline}
.card .cface{font-size:12px;color:var(--vermilion);font-family:var(--sans)}
.card .cdesc{font-size:12px;color:var(--text);margin-top:3px;line-height:1.5}
.card .cdetail{font-size:10.5px;color:var(--muted);margin-top:4px}
.story{font-family:var(--mincho);font-size:13.5px;line-height:1.9;color:var(--text);
  margin:10px 0;text-align:left}
.perk{font-size:12.5px;color:var(--text);margin:6px 0;text-align:left;line-height:1.6}
.opt{flex-wrap:wrap}

/* ===== theme.css ===== */
/* ============================================================
   theme.css — 全画面に効く「華」の層
   読み込み順は style.css → theme.css → 各画面のCSS

   方針：彩度を上げるのではなく、雀荘の金を効かせる。
   写真の背景がもともと金の傘ランプのボケなので、
   金箔の細線・漆の黒・朱の判子を強めるのが一番写真が映える。
   ============================================================ */

:root{
  --gold-hi:#f4e2a4;        /* 金の照り */
  --gold-lo:#7d6222;        /* 金の陰 */
  --urushi-3:#0e1a17;       /* 一番深い漆。真っ黒だと沈むので少し起こす */
  --shu:#c0392b;            /* 朱（契約印・S級） */
  --kin:linear-gradient(150deg,var(--gold-hi),var(--gold) 42%,var(--gold-lo));

  /* 明るさの調整。写真が暗いので、地の面と字は思い切って上げる */
  --urushi:#13201c;
  --urushi-2:#1a2a25;
  --gold:#d9b45e;
  --gold-dim:#8a7338;
  --text:#f2eee4;
  --ivory:#fbf7ec;
  --ivory-2:#e6ddc9;
  --muted:#aebbb4;          /* 補助文字。以前は暗すぎて読みにくかった */
  --panel:rgba(255,255,255,.05);   /* 卓の上に置く面 */
  --panel-2:rgba(255,255,255,.08);
}

/* ---------- 字体 ----------
   本文まで丸ゴにする。明朝のままだと硬く、表紙の丸ゴとも噛み合わない。
   常用漢字まで埋め込んであるので、入力された名前もそのまま丸ゴで出る。 */
body,button,input,select,textarea{
  font-family:var(--maru);
  font-weight:700;
  -webkit-font-smoothing:antialiased;
}
/* 見出しも丸ゴに寄せる（色は金のまま） */
.mkTitle,.tmTitle,.tkTitle,.scTitle,.ttSetupT,
.mkSecT,.tmSecT,.tkSecT,.scSecT,.tkRoundT,.tkGroupT,
.mkBigName,.mkName,.tmSeatName,.tmCandName,.scName,
.tkTierName,.tkChampion,.mkCopy,.tmVerdictLine,.scAgencyName{
  font-family:var(--maru);font-weight:800;
}
/* 字間は明朝向けに広げてあったので、丸ゴでは詰める */
.mkTitle,.tmTitle,.tkTitle,.scTitle{letter-spacing:.06em}
.mkSecT,.tmSecT,.tkSecT,.scSecT,.tkRoundT,.tkGroupT{letter-spacing:.05em}

/* 卓の羅紗の上に、傘ランプの灯りが落ちているような下地。
   以前は真っ黒に近くて全体が沈んでいたので、緑を残したまま持ち上げる */
body{
  background:
    radial-gradient(42% 30% at 12% 4%, rgba(217,180,94,.16), transparent 70%),
    radial-gradient(34% 26% at 90% 0%, rgba(217,180,94,.12), transparent 72%),
    radial-gradient(130% 100% at 50% 0%, #22352e, var(--urushi-3) 78%);
  background-attachment:fixed;
  color:var(--text);
}

/* 金箔の文字。見出しにだけ使う */
.kinji{
  background:var(--kin);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}

/* 金の細線。仕切りに使う */
.kinsen{
  height:1px;border:0;margin:14px 0;
  background:linear-gradient(90deg,transparent,var(--gold-dim) 12%,var(--gold) 50%,var(--gold-dim) 88%,transparent);
}

/* ---------- 見出しを金にする ---------- */
.mkTitle,.tmTitle,.tkTitle,.scTitle{
  background:var(--kin);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}

/* ---------- ランク章を石らしくする ---------- */
.mkRank{
  border:1px solid rgba(0,0,0,.45);
  box-shadow:0 1px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.35);
}
.rk-S{background:linear-gradient(150deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:#2a1f06}
.rk-A{background:linear-gradient(150deg,#d97363,var(--shu) 55%,#8e2318);color:#fdeeeb}
.rk-B{background:linear-gradient(150deg,#4a82bd,var(--indigo) 55%,#1b3c63);color:#eaf1f9}
.rk-C{background:linear-gradient(150deg,#4aa87c,var(--bamboo) 55%,#1c5540);color:#e9f6f0}
.rk-D{background:linear-gradient(150deg,#6f7b74,#4a5551 55%,#2e3633);color:#e4e9e6}

/* ---------- ボタンを箔押しにする ---------- */
.tmGo,.tkGo,.scGo,.scSign{
  background:var(--kin);border-color:var(--gold-lo);
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 2px 8px rgba(0,0,0,.45);
}
.tmGo[disabled],.tkGo[disabled],.scGo[disabled],.scSign[disabled]{
  background:transparent;box-shadow:none;
}

/* ---------- 見出しの罫を金線にする ---------- */
.mkSecT,.tmSecT,.tkSecT,.scSecT,.tkRoundT,.tkGroupT{
  border-bottom:0;
  padding-bottom:5px;
  background:linear-gradient(90deg,transparent,var(--gold-dim) 6%,var(--gold) 40%,transparent) bottom left/100% 1px no-repeat;
}

/* ============================================================
   ポップアップ（表紙の顔選び・チーム編成の入所希望者で共用）
   小さい札のままでは顔が分からないので、押したら大きく見せてから決める
   ============================================================ */
.popup{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:rgba(4,8,7,.86);padding:16px;
}
.popupBox{
  width:100%;max-width:360px;position:relative;
  border:1px solid var(--gold);border-radius:8px;overflow:hidden;
  background:var(--urushi-2);
  box-shadow:0 0 0 1px var(--gold-lo),0 10px 40px rgba(0,0,0,.7);
}
@media(prefers-reduced-motion:no-preference){
  .popupBox{animation:popupIn .2s cubic-bezier(.2,.9,.3,1.15) both}
}
@keyframes popupIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}

.popupClose{
  position:absolute;top:8px;right:8px;z-index:4;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--gold-dim);background:rgba(12,21,18,.72);color:var(--ivory);
  font-size:15px;cursor:pointer;
}
.popupClose:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.popupPhoto{position:relative;aspect-ratio:3/4;max-height:58dvh;overflow:hidden;z-index:0}
.popupPhoto .mkFace{position:absolute;inset:0;z-index:0}
.popupPhoto::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:34%;z-index:1;
  background:linear-gradient(transparent,var(--urushi-2) 94%);
}
.popupBody{padding:2px 14px 14px;text-align:center}
.popupNote{
  font-family:var(--maru);font-weight:700;font-size:13px;color:var(--ivory-2);
  letter-spacing:.04em;margin-bottom:11px;
}


/* ---------- 面を起こす ----------
   黒を重ねる作りだと、暗い写真の上でカードの輪郭が消えてしまう。
   白をうっすら乗せる形に変えて、卓と面の差をはっきりさせる */
.mkCount,.tkStat,.scStat,.ttStateItem,
.tkTable,.tkTier,.scAgency,.scCard,.tmCand,.mkCard,
.tkName,.tmMini,.mkTag,.tkBand{
  background-color:var(--panel);
}
.tkTier,.scAgency,.tmTable{
  background-image:linear-gradient(var(--panel-2),transparent);
}
.mkSheet,.popupBox,.scRevealBox{
  background:linear-gradient(var(--urushi-2),var(--urushi));
}
.mkOverlay,.popup,.scReveal{background:rgba(8,14,12,.80)}

/* 補助文字が細くて読めなかったので、少しだけ太らせる */
.mkStyle,.tmSeatStyle,.tkSeatStyle,.scSalary,.tkTierSize,.mkKana{font-weight:700}

/* ===== maru.css ===== */
/* ============================================================
   maru.css — 表紙とプレイヤー設定で使う丸ゴシック
   ※ tools/make-font.py が生成する。直接編集しないこと

   M PLUS Rounded 1c（SIL Open Font License 1.1）
   Copyright 2016 The Rounded M+ Project Authors
   https://github.com/coz-m/MPLUS_FONTS

   日本語の丸ゴシックはApple系にしか標準で入っていないため、
   使う文字だけを切り出して fonts/ に置いてある。外部通信は不要。

   CSSに埋め込まないのは、PLiCyの index.html に容量の上限があるため。
   埋め込むと index.html だけで1MB近くになる。
   パスは src/ から見た ../fonts/ と書いてある。
   CSSのurl()はCSSファイルの位置から解決されるため、単体ページ（直下のhtml）から
   src/maru.css を読んだときにこれで正しく届く。
   build.py は index.html に取り込むときに fonts/ へ書き換える。

   題字や副題の文言を変えたら make-font.py を実行し直すこと。
   ============================================================ */

@font-face{
  font-family:'Maru';font-style:normal;font-weight:700;font-display:swap;
  src:url(fonts/maru-ui.woff2) format('woff2');
}
@font-face{
  font-family:'Maru';font-style:normal;font-weight:800;font-display:swap;
  src:url(fonts/maru-title.woff2) format('woff2');
}

:root{
  --maru:'Maru',"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",
         "M PLUS Rounded 1c",var(--sans);
  --neon:#ff3a8c;
}

/* ===== title.css ===== */
/* ============================================================
   title.css — トップページとプレイヤー設定
   ============================================================ */

.ttRoot{width:100%;max-width:760px;margin:0 auto;padding:0 0 30px}

/* ---------- 表紙 ----------
   絵はすべて #cover のcanvasが描く。
   PLiCyはcanvasの中身しかサムネイルに撮らないため、
   顔の壁も題字もDOMではなくcanvas側にある。            */
#coverWrap{
  display:none;                 /* 表紙のときだけ出す。撮影用にDOMからは消さない */
  width:100%;line-height:0;border-bottom:1px solid var(--gold-dim);
  background:#081010;
}
#cover{width:100%;height:auto;display:block}
body.onTitle #coverWrap{display:block}

/* ---------- 本体 ---------- */
.ttBody{padding:16px 12px 0}

.ttActions{display:grid;gap:9px;margin-bottom:16px}
.ttBtn{
  display:block;width:100%;padding:14px;cursor:pointer;border-radius:5px;
  font-family:var(--maru);font-weight:800;font-size:16px;letter-spacing:.05em;
  border:1px solid var(--gold-lo);color:var(--ink);
  background:linear-gradient(150deg,var(--gold-hi),var(--gold) 42%,var(--gold-lo));
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 10px rgba(0,0,0,.5);
}
.ttBtn.ghost{
  background:transparent;color:var(--ivory-2);border-color:var(--gold-dim);
  box-shadow:none;font-size:14px;padding:11px;
}
.ttBtn:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

/* 事務所の現状 */
.ttState{
  border:1px solid var(--gold-dim);border-radius:6px;padding:11px 13px;margin-bottom:14px;
  background:linear-gradient(var(--urushi-2),rgba(19,36,32,.4));
}
.ttStateT{font-family:var(--maru);font-weight:700;font-size:12px;color:var(--gold);letter-spacing:.05em;margin-bottom:7px}
.ttStateRow{display:flex;flex-wrap:wrap;gap:6px}
.ttStateItem{
  font-size:11.5px;color:var(--muted);
  border:1px solid var(--gold-dim);border-radius:3px;padding:3px 8px;background:rgba(0,0,0,.28);
}
.ttStateItem b{font-family:var(--maru);font-weight:800;font-size:13.5px;color:var(--ivory);margin:0 2px}
.ttRoster{display:flex;gap:5px;margin-top:9px}
.ttRoster span{
  width:44px;height:58px;border-radius:3px;overflow:hidden;display:block;
  border:1px solid var(--gold-dim);background:linear-gradient(160deg,var(--back),var(--back-2));
}
.ttRoster img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}

.ttLead{font-size:12.5px;color:var(--muted);line-height:1.8;margin:0 2px 14px}
.ttFoot{
  font-family:var(--maru);font-weight:700;font-size:11.5px;color:var(--muted);
  letter-spacing:.03em;text-align:center;margin:18px 0 0;opacity:.75;
}
/* 表紙は縦に間延びしやすいので、中身を上下に散らさず上に寄せる */
body.onTitle #view{min-height:0}

/* ---------- プレイヤー設定 ---------- */
.ttSetup{padding:14px 12px 0}
.ttSetupT{
  font-family:var(--maru);font-weight:800;font-size:22px;letter-spacing:.03em;margin:0 0 6px;
  background:var(--kin);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.ttField{margin:16px 0 6px}
.ttLabel{
  display:block;font-family:var(--maru);font-weight:700;font-size:12.5px;color:var(--gold);
  letter-spacing:.07em;margin-bottom:6px;
}
.ttInput{
  width:100%;padding:11px 12px;border-radius:4px;
  font-family:var(--maru);font-weight:800;font-size:17px;letter-spacing:.03em;
  border:1px solid var(--gold-dim);background:rgba(0,0,0,.35);color:var(--ivory);
}
.ttInput:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.ttNote{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}

/* 12枚。4列3行で一画面に収まる */
.ttFaces{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:560px){.ttFaces{grid-template-columns:repeat(6,1fr)}}
.ttFace{
  position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;cursor:pointer;
  border:1px solid var(--gold-dim);background:linear-gradient(160deg,var(--back),var(--back-2));
  padding:0;width:100%;
}
.ttFace img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block;position:relative;z-index:1}
.ttFace.sil::after{
  content:"";position:absolute;inset:0;z-index:0;
  background:var(--sil-img) center 62%/78% no-repeat;opacity:.85;
}
.ttFace[aria-pressed="true"]{
  border-color:var(--gold);
  box-shadow:inset 0 0 0 1px var(--urushi-3),inset 0 0 0 2px var(--gold),0 0 12px rgba(201,162,74,.3);
}
.ttFace[aria-pressed="true"]::before{
  content:"選択";position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:2px 0;text-align:center;
  font-family:var(--maru);font-weight:800;font-size:9.5px;letter-spacing:.06em;
  color:var(--ink);background:var(--gold);
}
.ttFace:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

@media(min-width:560px){
  .ttWall{grid-template-columns:repeat(8,1fr)}
}

/* ===== meikan.css ===== */
/* ============================================================
   雀ドル名鑑 — meikan.css
   カラートークンは style.css の :root を使う。
   読み込み順は style.css → meikan.css。
   状態の意味：
     未発見  … 牌の背と同じ緑のシルエット
     発見済み … 生成り縁の肖像カード（顔＋ランク＋打ち筋）
     契約済み … 金の二重縁＋朱の契約印
   ============================================================ */

.mkRoot{
  width:100%;max-width:760px;margin:0 auto;padding:10px 8px 40px;
  font-family:var(--sans);color:var(--text);
}

/* ---------- 見出し ---------- */
.mkHead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:4px 2px 10px}
.mkTitle{
  font-family:var(--maru);font-weight:800;font-size:26px;letter-spacing:.07em;
  color:var(--ivory);margin:0;
}
.mkTitle small{font-size:12px;letter-spacing:.10em;color:var(--gold);margin-left:8px}
.mkCounts{display:flex;gap:8px;margin-left:auto}
.mkCount{
  font-size:12px;color:var(--muted);
  border:1px solid var(--gold-dim);border-radius:3px;padding:3px 8px;
  background:rgba(0,0,0,.25);
}
.mkCount b{color:var(--ivory);font-family:var(--maru);font-weight:800;font-size:14px;margin:0 1px}

/* ---------- 絞り込み ---------- */
.mkFilters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.mkChip{
  font-size:12px;padding:5px 10px;border-radius:3px;cursor:pointer;user-select:none;
  border:1px solid var(--gold-dim);background:transparent;color:var(--muted);
  font-family:var(--sans);
}
.mkChip[aria-pressed="true"]{
  background:var(--felt);color:var(--ivory);border-color:var(--gold);
}
.mkChip:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.mkSelect{
  font-size:12px;padding:5px 6px;border-radius:3px;
  border:1px solid var(--gold-dim);background:var(--urushi-2);color:var(--text);
}
.mkSelect:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.mkSep{width:1px;height:18px;background:var(--gold-dim);margin:0 2px}

/* ---------- 一覧 ---------- */
/* 2列。3列だと顔が親指の爪ほどになり、73枚の写真が活きない */
.mkGrid{
  display:grid;gap:9px;
  grid-template-columns:repeat(2,1fr);
}
@media(min-width:560px){.mkGrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.mkGrid{grid-template-columns:repeat(4,1fr)}}
.mkEmpty{
  grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;
  padding:40px 0;border:1px dashed var(--gold-dim);border-radius:6px;
}

.mkCard{
  position:relative;border-radius:4px;overflow:hidden;cursor:pointer;
  aspect-ratio:3/4;background:var(--urushi-2);
  border:1px solid var(--gold-dim);
  padding:0;text-align:inherit;color:inherit;font:inherit;display:block;width:100%;
}
.mkCard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 肖像。画像が読めない環境ではシルエット背景が残る */
.mkFace{position:absolute;inset:0;z-index:0} /* imgのz-indexを内側に閉じ込める */
.mkFace img{
  width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block;
  position:relative;z-index:1; /* シルエット(::after)より上に描く。読めないときはonerrorで消える */
}
.mkFace.sil{
  background:
    radial-gradient(90% 60% at 50% 20%,rgba(255,255,255,.06),transparent 60%),
    linear-gradient(165deg,var(--back),var(--back-2));
}
.mkFace.sil::after{
  content:"";position:absolute;inset:0;
  background:var(--sil-img) center 62%/78% no-repeat;
  opacity:.9;
}

/* 未発見 */
.mkCard.unknown{border-color:#233530}
.mkCard.unknown .mkFace.sil{filter:brightness(.55) saturate(.6)}
.mkCard.unknown .mkNo{color:#5c6d66}
.mkQ{
  position:absolute;top:34%;left:0;right:0;text-align:center;
  font-family:var(--mincho);font-size:30px;color:rgba(242,236,224,.28);
}

/* 番号（右上）とランク（左上） */
.mkNo{
  position:absolute;top:4px;right:4px;z-index:2;font-family:var(--maru);font-weight:800;
  font-size:10.5px;letter-spacing:.03em;color:var(--gold-hi);
  padding:1px 5px;border-radius:2px;
  background:rgba(8,16,16,.62);border:1px solid rgba(201,162,74,.4);
}
.mkRank{
  position:absolute;top:4px;left:4px;z-index:2;
  min-width:21px;height:21px;line-height:21px;text-align:center;
  font-family:var(--maru);font-weight:800;font-size:13px;border-radius:2px;
  padding:0 4px;color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.5);
}
.rk-S{background:linear-gradient(160deg,#e7c76a,var(--gold));}
.rk-A{background:#c05a4c;color:var(--ivory)}
.rk-B{background:var(--indigo);color:var(--ivory)}
.rk-C{background:var(--bamboo);color:var(--ivory)}
.rk-D{background:#525d57;color:var(--ivory)}

/* 名前帯（下） */
.mkBar{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 8px 7px;
  background:linear-gradient(transparent,rgba(6,10,9,.55) 38%,rgba(6,10,9,.95) 80%);
}
.mkBar::before{
  content:"";position:absolute;left:8px;right:8px;top:14px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,162,74,.55),transparent);
}
.mkName{
  display:block;font-family:var(--maru);font-weight:800;font-size:14px;color:var(--ivory);
  letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mkStyle{
  display:block;font-size:10.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 契約済み：金の二重縁＋契約印 */
.mkCard.signed{
  border:1px solid var(--gold);
  box-shadow:inset 0 0 0 1px rgba(12,21,18,.9),inset 0 0 0 2px var(--gold);
}
.mkSeal{
  position:absolute;right:7px;bottom:44px;z-index:2;width:32px;height:32px;border-radius:50%;
  border:2px solid var(--shu);color:var(--shu);
  font-family:var(--mincho);font-size:11.5px;line-height:1.05;font-weight:700;
  display:flex;align-items:center;justify-content:center;text-align:center;
  transform:rotate(-8deg);
  background:rgba(12,21,18,.55);
  letter-spacing:.02em;
}

/* ---------- 詳細 ---------- */
.mkOverlay{
  position:fixed;inset:0;z-index:60;background:rgba(4,8,7,.72);
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:560px){.mkOverlay{align-items:center}}
.mkSheet{
  width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;
  background:linear-gradient(var(--urushi-2),var(--urushi));
  border:1px solid var(--gold-dim);border-radius:10px 10px 0 0;
  position:relative;
}
@media(min-width:560px){.mkSheet{border-radius:10px}}
.mkSheet.signed{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim)}
@media(prefers-reduced-motion:no-preference){
  .mkSheet{animation:mkUp .18s ease-out}
  @keyframes mkUp{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
}
.mkClose{
  position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--gold-dim);background:rgba(12,21,18,.7);color:var(--ivory);
  font-size:15px;cursor:pointer;
}
.mkClose:focus-visible{outline:2px solid var(--gold)}

.mkPortrait{position:relative;width:100%;height:clamp(240px,46dvh,430px);overflow:hidden;background:var(--urushi-2)}
.mkPortrait .mkFace img{object-position:50% 10%}
.mkPortrait .mkQ{top:40%;font-size:44px}
.mkPortrait::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:70px;
  background:linear-gradient(transparent,var(--urushi-2));
}
.mkSealBig{
  position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;
  border:2.5px solid var(--vermilion);color:var(--vermilion);
  font-family:var(--mincho);font-size:15px;font-weight:700;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);
  background:rgba(12,21,18,.4);
}

.mkBody{padding:2px 16px 18px}
.mkNameRow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.mkBigNo{font-family:var(--maru);font-weight:800;font-size:13px;color:var(--gold)}
.mkBigName{font-family:var(--maru);font-weight:800;font-size:24px;color:var(--ivory);letter-spacing:.04em}
.mkKana{font-size:11px;color:var(--muted)}
.mkCopy{
  font-family:var(--maru);font-weight:800;font-size:13.5px;color:var(--gold);
  margin:6px 0 10px;letter-spacing:.03em;
}
.mkTags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mkTag{
  font-size:11.5px;padding:3px 8px;border-radius:3px;
  border:1px solid var(--gold-dim);color:var(--ivory-2);background:rgba(0,0,0,.25);
}
.mkTag.rank{font-family:var(--maru);font-weight:800}

.mkSecT{
  font-family:var(--maru);font-weight:800;font-size:13px;color:var(--ivory);
  border-bottom:1px solid var(--gold-dim);padding-bottom:3px;margin:14px 0 8px;
  letter-spacing:.05em;
}
.mkRow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin:5px 0}
.mkRow dt{color:var(--muted)}
.mkRow dd{margin:0;color:var(--text)}
.mkQuiet{font-size:12px;color:var(--muted);line-height:1.7}

/* 打ち筋の係数バー */
.mkBars{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 16px}
.mkBarRow{display:grid;grid-template-columns:3.2em 1fr;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.mkTrack{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.mkFill{display:block;height:100%;background:linear-gradient(90deg,var(--bamboo),var(--gold));border-radius:3px}

/* 完成度 */
.mkComp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.mkComp .mkTrack{height:8px}
.mkComp .mkFill{background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.mkGrade{font-family:var(--maru);font-weight:800;color:var(--ivory)}

/* ===== team.css ===== */
/* ============================================================
   チーム編成 — team.css
   style.css の :root トークンを使う。読み込み順は
     style.css → meikan.css → team.css
   （meikan.css はシルエットとランクバッジを共有するため）
   ============================================================ */

.tmRoot{
  width:100%;max-width:760px;margin:0 auto;padding:10px 8px 40px;
  font-family:var(--sans);color:var(--text);
}

/* ---------- 見出し ---------- */
.tmHead{margin:4px 2px 14px}
.tmTitle{
  font-family:var(--maru);font-weight:800;font-size:24px;letter-spacing:.06em;
  color:var(--ivory);margin:0 0 6px;
}
.tmLead{font-size:12.5px;color:var(--muted);line-height:1.75;margin:0;max-width:44em}

/* ---------- 卓（選んだ4人） ---------- */
.tmTable{
  position:relative;
  background:linear-gradient(var(--felt),#11302a);
  border:1px solid var(--gold-dim);border-radius:10px;
  padding:12px;margin-bottom:14px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.55);
}
.tmSeats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tmSeat{
  position:relative;border-radius:4px;overflow:hidden;aspect-ratio:3/4;
  border:1px dashed var(--gold-dim);background:rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;
  padding:0;color:inherit;font:inherit;width:100%;
}
.tmSeat.filled{border-style:solid;border-color:var(--gold);cursor:pointer}
.tmSeat.you{border-style:solid;border-color:var(--ivory-2);cursor:default}
.tmSeat:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.tmSeatKaze{
  position:absolute;top:4px;left:5px;z-index:3;
  font-family:var(--maru);font-weight:800;font-size:12px;color:var(--gold);
  text-shadow:0 1px 2px rgba(0,0,0,.9);
}
.tmSeatEmpty{
  font-family:var(--maru);font-weight:800;font-size:11px;color:var(--muted);
  text-align:center;line-height:1.6;padding:0 4px;
}
.tmSeatYou{
  font-family:var(--maru);font-weight:800;font-size:15px;color:var(--ivory);letter-spacing:.05em;
}
.tmSeatBar{
  position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 5px 4px;
  background:linear-gradient(transparent,rgba(6,10,9,.94) 55%);
}
.tmSeatName{
  display:block;font-family:var(--maru);font-weight:800;font-size:11.5px;color:var(--ivory);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 狭い画面ではフルネームが切れるので、姓と名を二行に折り返す */
@media(max-width:400px){
  .tmSeatName{white-space:normal;line-height:1.25;font-size:11px}
  .tmSeatStyle{font-size:8.5px}
  .tmSeatBar{padding-top:10px}
}
.tmSeatStyle{
  display:block;font-size:9px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tmSeatDrop{
  position:absolute;top:3px;right:4px;z-index:3;
  width:18px;height:18px;line-height:16px;text-align:center;border-radius:50%;
  border:1px solid var(--gold-dim);background:rgba(12,21,18,.8);
  color:var(--ivory-2);font-size:11px;
}

/* 講評 */
.tmVerdict{
  margin-top:12px;padding-top:10px;border-top:1px solid rgba(201,162,74,.28);
}
.tmVerdictLine{font-family:var(--maru);font-weight:800;font-size:13.5px;color:var(--gold);letter-spacing:.02em}
.tmVerdictNote{font-size:12px;color:var(--ivory-2);line-height:1.7;margin-top:4px}

.tmMeters{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 16px;margin-top:10px}
.tmMeterRow{display:grid;grid-template-columns:3.6em 1fr;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.tmTrack{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.tmFill{display:block;height:100%;background:linear-gradient(90deg,var(--bamboo),var(--gold));border-radius:3px}

.tmGo{
  display:block;width:100%;margin-top:12px;padding:11px;
  font-family:var(--maru);font-weight:800;font-size:15px;letter-spacing:.08em;
  border-radius:4px;cursor:pointer;
  border:1px solid var(--gold);background:var(--gold);color:var(--ink);
}
.tmGo[disabled]{
  border-color:var(--gold-dim);background:transparent;color:var(--muted);cursor:default;
}
.tmGo:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

/* ---------- 候補一覧 ---------- */
.tmSecT{
  font-family:var(--maru);font-weight:800;font-size:13px;color:var(--ivory);
  border-bottom:1px solid var(--gold-dim);padding-bottom:3px;margin:16px 0 10px;
  letter-spacing:.05em;
}
.tmGrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

.tmCand{
  display:grid;grid-template-columns:64px 1fr;gap:9px;align-items:stretch;
  border:1px solid var(--gold-dim);border-radius:4px;overflow:hidden;
  background:rgba(0,0,0,.24);padding:0;width:100%;text-align:left;
  color:inherit;font:inherit;cursor:pointer;
}
.tmCand:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tmCand.picked{border-color:var(--gold);background:rgba(201,162,74,.1)}
/* 「選出」は名前と同じ行に置くと長い名前を押し出すので、面の上に重ねる */
.tmCand.picked .tmCandFace::after{
  content:"選出";position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:3px 0;text-align:center;
  font-family:var(--maru);font-weight:800;font-size:10px;letter-spacing:.06em;
  color:var(--ink);background:var(--gold);
}

/* ============================================================
   発掘の演出
   雀荘をまわって見つけた一瞬を、写真いっぱいで見せる。
   収集ゲームで一番おいしい場面なので、金色の一行では惜しい。
   ============================================================ */
.scReveal{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:rgba(4,8,7,.86);padding:16px;
}
.scRevealBox{
  width:100%;max-width:400px;position:relative;
  border:1px solid var(--gold);border-radius:8px;overflow:hidden;
  background:var(--urushi-2);
  box-shadow:0 0 0 1px var(--gold-lo),0 10px 40px rgba(0,0,0,.7);
}
@media(prefers-reduced-motion:no-preference){
  .scRevealBox{animation:scPop .34s cubic-bezier(.2,.9,.3,1.2) both}
  .scRevealBox .scRevealShine{animation:scShine .9s ease-out .18s both}
}
@keyframes scPop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes scShine{
  from{transform:translateX(-120%) skewX(-18deg);opacity:0}
  40%{opacity:.55}
  to{transform:translateX(220%) skewX(-18deg);opacity:0}
}
.scRevealShine{
  position:absolute;top:0;bottom:0;width:38%;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(244,226,164,.5),transparent);
}

.scRevealPhoto{position:relative;aspect-ratio:3/4;max-height:56dvh;overflow:hidden;z-index:0}
.scRevealPhoto .mkFace{position:absolute;inset:0;z-index:0}
.scRevealPhoto::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:52%;z-index:1;
  background:linear-gradient(transparent,var(--urushi-2) 92%);
}
.scRevealRank{
  position:absolute;top:9px;left:9px;z-index:2;
  min-width:30px;height:30px;line-height:30px;text-align:center;padding:0 7px;
  font-family:var(--maru);font-weight:800;font-size:17px;border-radius:3px;
}
.scRevealCap{
  position:absolute;top:11px;right:11px;z-index:2;
  font-family:var(--maru);font-weight:800;font-size:11.5px;letter-spacing:.10em;color:var(--gold-hi);
  text-shadow:0 1px 4px rgba(0,0,0,.9);
}
.scRevealName{
  position:absolute;left:0;right:0;bottom:6px;z-index:2;text-align:center;
  font-family:var(--maru);font-weight:800;font-size:26px;letter-spacing:.05em;
  background:linear-gradient(160deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.85));
}
.scRevealBody{padding:4px 14px 14px;text-align:center}
.scRevealMeta{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.scRevealCopy{font-family:var(--maru);font-weight:800;font-size:13.5px;color:var(--ivory-2);margin:7px 0 12px}
.scRevealClose{
  display:block;width:100%;padding:11px;border-radius:4px;cursor:pointer;
  font-family:var(--maru);font-weight:800;font-size:14.5px;letter-spacing:.07em;color:var(--ink);
  border:1px solid var(--gold-lo);
  background:linear-gradient(150deg,var(--gold-hi),var(--gold) 42%,var(--gold-lo));
}
.scRevealClose:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

.scRevealMiss{padding:26px 18px;text-align:center}
.scRevealMiss p{font-family:var(--maru);font-weight:800;font-size:15px;color:var(--ivory-2);margin:0 0 16px;line-height:1.8}

/* ===== match.css ===== */
/* ============================================================
   match.css — 対局中の卓まわり
   読み込み順は style.css → theme.css → … → match.css（最後）
   style.css の指定を上書きするので、必ず後に置くこと。

   ・自分の手牌を大きくする
   ・卓を漆と金で飾る（女流の大会という題材に合わせる）
   ・横持ちを促す（強制はできない。理由は下の rotate の項）
   ============================================================ */

/* ---------- 手牌を大きく ----------
   14枚が横に並ぶので、画面幅から逆算する。
   縦持ちは幅がぎりぎりなので隙間を詰め、横持ちは高さで頭打ちにする */
/* 14枚＋隙間13＋引いた牌の余白。これを引かないと左右にはみ出す */
body.inMatch{
  --tw:clamp(23px,calc((100vw - 28px)/14),52px);
  /* --rw-fit は match.js が入れる自動調整の係数。
     卓からはみ出したら河を少しずつ縮めて必ず収める */
  --rw-base:clamp(15px,4.4vw,24px);
  --rw:calc(var(--rw-base) * var(--rw-fit,1));
}
body.inMatch #handrow{gap:1px}
body.inMatch #handrow .drawn{margin-left:5px}
body.inMatch #table{overflow:hidden}
/* 横持ちは高さが足りない。河が伸びると卓が縦に膨らんで手牌が画面外に出るので、
   牌は高さで頭打ちにし、河は思い切って小さくする */
@media(orientation:landscape){
  body.inMatch{
    --tw:clamp(28px,min(calc((100vw - 30px)/14),17dvh),58px);
    --rw:clamp(10px,1.55vw,17px);
  }
  body.inMatch #app{height:100dvh;min-height:0;padding:4px}
  body.inMatch #table{min-height:0;overflow:hidden;padding:4px;border-radius:10px}
  body.inMatch #info{min-width:92px;padding:5px 9px;font-size:10.5px;line-height:1.4}
  body.inMatch #info .kyoku{font-size:16px}
  body.inMatch #myarea{padding:3px 2px 1px}
  body.inMatch #actions{margin-top:3px;min-height:29px}
  body.inMatch #hintbox{min-height:0;margin-top:1px}
  body.inMatch button.act{padding:5px 12px;font-size:14px}
  body.inMatch #hintbox{min-height:12px}
  body.inMatch #table::before,body.inMatch #table::after{width:18px;height:18px}

  /* 横持ちは高さが足りない。河が6列で折り返すと縦に伸びて牌が小さくなるので、
     横幅は余っているぶん列を増やして段数を減らす。
     左右の相手の背も13枚縦に並ぶと高さを食うので薄く畳む。 */
  body.inMatch{--rw:clamp(14px,2.3vw,24px)}

  /* 中央の表示が卓の高さを食って、自分の捨て牌が卓の外に押し出されていた。
     横持ちは左右が余っているので、中央から外して脇に寄せる。
     絶対配置にすると中段が空くので、その分を河に回せる */
  body.inMatch #table{position:relative}
  body.inMatch #info{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    z-index:3;min-width:0;width:auto;max-width:30%;
    padding:7px 10px;text-align:left;
  }
  body.inMatch #info .scores{display:block;line-height:1.7}
  body.inMatch #info .scores span{display:block}
  body.inMatch #dora{justify-content:flex-start;margin-top:5px}
  body.inMatch .river{grid-template-columns:repeat(12,auto);min-width:calc(var(--rw)*12.4)}
  body.inMatch .river.side{
    grid-template-columns:none;grid-template-rows:repeat(3,auto);
    min-width:0;min-height:calc(var(--rw)*3.4);
  }
  /* 左右の相手の手牌は13枚が縦一列に並ぶので、そのままだと300px近くなり
     卓の高さを食って自分の捨て牌が押し出される。二列に折り返して半分にする。
     背は .back ではなく .tile.tiny で描かれている点に注意 */
  body.inMatch .backs.vert{flex-wrap:wrap;max-height:calc(var(--rw)*7.2);align-content:center}
  body.inMatch .backs.vert .tile{height:calc(var(--rw)*.95);width:calc(var(--rw)*.72)}
  body.inMatch #left,body.inMatch #right{max-width:calc(var(--rw)*2.6)}
}

body.inMatch #handrow{min-height:calc(var(--tw)*1.42)}
body.inMatch #myarea{padding:8px 2px 4px}

/* つまみ上げたときの見え方も大きく */
body.inMatch .tile.picked{
  transform:translateY(-14px) scale(1.26);
  box-shadow:0 8px 16px rgba(0,0,0,.65),0 0 0 2px var(--gold),0 0 18px rgba(201,162,74,.45);
}

/* ---------- 卓を飾る ---------- */
body.inMatch #table{
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(90% 70% at 50% 110%, rgba(0,0,0,.45), transparent 70%),
    linear-gradient(#1c4638,#12302a 60%,#0e2620);
  border:1px solid var(--gold);
  box-shadow:
    inset 0 0 0 1px rgba(8,16,16,.9),
    inset 0 0 0 2px rgba(201,162,74,.55),
    inset 0 0 60px rgba(0,0,0,.55),
    0 6px 24px rgba(0,0,0,.5);
  border-radius:14px;
}

/* 四隅の金の飾り。卓の角を締める */
body.inMatch #table::before,
body.inMatch #table::after{
  content:"";position:absolute;width:26px;height:26px;pointer-events:none;
  border:2px solid rgba(201,162,74,.75);
}
body.inMatch #table::before{
  top:7px;left:7px;border-right:0;border-bottom:0;border-radius:6px 0 0 0;
}
body.inMatch #table::after{
  bottom:7px;right:7px;border-left:0;border-top:0;border-radius:0 0 6px 0;
}

/* 中央の表示。漆の板に金の縁 */
body.inMatch #info{
  background:linear-gradient(rgba(10,18,16,.86),rgba(6,12,10,.92));
  border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(8,16,16,.9),0 4px 14px rgba(0,0,0,.55),
             inset 0 1px 0 rgba(255,255,255,.06);
  border-radius:8px;padding:9px 12px;
}
body.inMatch #info .kyoku{
  font-family:var(--maru);font-weight:800;font-size:20px;letter-spacing:.04em;
  background:linear-gradient(160deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
body.inMatch .scores .me{color:var(--gold-hi)}

/* 牌の艶。象牙らしく上に光を入れる */
body.inMatch .tile{
  background:linear-gradient(172deg,#fffefa,#f7f1e4 48%,#e4dac4);
  box-shadow:
    0 1px 0 #b0a68f,
    0 2px 4px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.95);
  border-radius:4px;
}
body.inMatch .back{
  background:linear-gradient(160deg,#2a6a56,#12362c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.5);
}

/* 手番のボタンも金に寄せる */
body.inMatch button.act{
  font-family:var(--maru);font-weight:800;letter-spacing:.04em;
  background:linear-gradient(#243029,#151f1b);
  border-color:var(--gold-dim);color:var(--ivory);
}
body.inMatch button.act.primary{
  background:linear-gradient(150deg,var(--gold-hi),var(--gold) 42%,var(--gold-lo));
  border-color:var(--gold);color:var(--ink);
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 2px 8px rgba(0,0,0,.5);
}

/* ---------- 横持ちの誘導 ----------
   画面の向きは、Webでは固定できない。
   screen.orientation.lock() はフルスクリーン中のAndroid Chromeでしか効かず、
   iOS Safari は非対応。PLiCyはiframeで動くのでフルスクリーン権限も取れない。
   そこで「試すだけ試して、駄目なら横にしてもらう」形にしてある。
   縦のままでも打てるので、閉じる道も必ず残すこと。           */
#rotateHint{
  position:fixed;inset:0;z-index:40;display:none;
  align-items:center;justify-content:center;padding:24px;text-align:center;
  background:rgba(6,12,10,.94);
}
body.inMatch.needRotate #rotateHint{display:flex}
.rotateBox{max-width:320px}
.rotateIcon{
  width:96px;height:60px;margin:0 auto 18px;border-radius:8px;
  border:2px solid var(--gold);
  box-shadow:inset 0 0 0 1px rgba(8,16,16,.9),0 0 24px rgba(201,162,74,.25);
}
@media(prefers-reduced-motion:no-preference){
  .rotateIcon{animation:rotateTip 2.4s ease-in-out infinite}
}
@keyframes rotateTip{
  0%,30%{transform:rotate(90deg) scale(.7)}
  55%,100%{transform:none}
}
.rotateText{
  font-family:var(--maru);font-weight:800;font-size:17px;color:var(--ivory);
  letter-spacing:.04em;margin-bottom:6px;
}
.rotateSub{font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:18px}
.rotateGo{
  font-size:13px;padding:9px 16px;border-radius:4px;cursor:pointer;
  border:1px solid var(--gold-dim);background:transparent;color:var(--ivory-2);
}
.rotateGo:focus-visible{outline:2px solid var(--gold);outline-offset:2px}


/* ============================================================
   列レイアウト
   卓を上から見た形（四方に配置＋左右は回転）をやめて、
   各家を「手牌の行」「捨て牌の行」の二行ずつ、上から順に積む。

   回転した牌は読みにくく、左右の河は縦に伸びて卓の高さを食っていた。
   横に並べると四人ぶんが同じ大きさ・同じ向きで読める。

   ui.js の書き出し先（#top / #left / #right / #river-*）はそのままで、
   #center に display:contents を当てて #table 直下に並べ替えている。
   ============================================================ */
body.inMatch #table{
  display:flex;flex-direction:column;justify-content:flex-start;
  gap:0;padding:8px 10px;overflow:hidden;
}
body.inMatch #center{display:contents}

/* 上から 下家 → 対面 → 上家 → 自分。読み下すと手番の順になる */
body.inMatch #right{order:1}
body.inMatch #river-right{order:2}
body.inMatch #top{order:3}
body.inMatch #river-top{order:4}
body.inMatch #left{order:5}
body.inMatch #river-left{order:6}
body.inMatch #info{order:7}
body.inMatch #river-bottom{order:8}

body.inMatch #top,body.inMatch #left,body.inMatch #right{
  display:block;width:100%;max-width:none;padding-top:3px;
}
/* .opp.vert は縦並びなので、行レイアウトでは横並びに戻す */
body.inMatch .opp,body.inMatch .opp.vert{
  display:flex;flex-direction:row;align-items:center;gap:8px;
  width:100%;justify-content:flex-start;
}
/* 名前の札 */
.oppName{
  display:flex;align-items:center;gap:6px;flex:none;min-width:11.5em;
  font-size:11.5px;color:var(--muted);
}
.oppKaze{
  font-family:var(--maru);font-weight:800;font-size:13px;color:var(--gold);
  border:1px solid var(--gold-dim);border-radius:3px;padding:0 4px;background:rgba(0,0,0,.3);
}
.oppWho{
  color:var(--ivory-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:6.5em;
}
.oppScore{margin-left:auto;font-family:var(--maru);font-weight:800;color:var(--ivory)}

/* 手牌の背は一列に戻す。折り返しも回転もしない */
body.inMatch .backs,body.inMatch .backs.vert{
  display:flex;flex-direction:row;flex-wrap:nowrap;gap:1px;max-height:none;
}
body.inMatch .backs .tile{
  height:calc(var(--rw)*1.15);width:calc(var(--rw)*.85);transform:none;
}
body.inMatch .opp .melds{display:flex;gap:5px;margin-left:6px}

/* 河は全員おなじ向き・おなじ組み方 */
body.inMatch .river,body.inMatch .river.side{
  display:flex;flex-wrap:wrap;gap:1px;
  grid-template-columns:none;grid-template-rows:none;grid-auto-flow:row;
  justify-content:flex-start;align-content:flex-start;
  width:100%;min-width:0;min-height:calc(var(--rw)*1.36);
  padding:0 0 2px calc(11.5em + 8px);     /* 名前の札のぶん字下げして頭をそろえる */
  box-sizing:border-box;
  border-bottom:1px solid rgba(201,162,74,.16);
}
body.inMatch .river.side .cell{width:auto;height:auto;display:inline-flex}
body.inMatch .river.side .cell .tile,
body.inMatch .river .tile.riichi{transform:none}
body.inMatch .river.side .cell.riichi .tile,
body.inMatch .river .tile.riichi{outline:1px solid var(--vermilion);outline-offset:-1px}
body.inMatch .river .tile.last{outline:2px solid var(--vermilion);outline-offset:-1px}

/* 自分の行。局の表示を名前の札の位置に置く */
body.inMatch #info{
  position:static;transform:none;order:7;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  width:100%;max-width:none;min-width:0;
  margin-top:5px;padding:5px 8px;text-align:left;
}
body.inMatch #info .kyoku{font-size:15px}
/* 他家の点数は各行に出ているので、自分のぶんだけ残す */
body.inMatch #info .scores{display:contents}
body.inMatch #info .scores > div{display:none}
body.inMatch #info .scores > .me{
  display:flex;align-items:baseline;gap:6px;order:-1;
  color:var(--ivory-2);font-size:11.5px;
}
body.inMatch #info .scores > .me b{font-family:var(--maru);font-weight:800;color:var(--gold-hi)}
body.inMatch #dora{margin:0 0 0 auto}
body.inMatch #river-bottom{padding-left:0;border-bottom:0}

@media(orientation:landscape){
  body.inMatch #table{padding:5px 10px}
  body.inMatch #info{margin-top:2px;padding:2px 8px}
  body.inMatch #top,body.inMatch #left,body.inMatch #right{padding-top:2px}
  body.inMatch .backs .tile{height:calc(var(--rw)*1.0);width:calc(var(--rw)*.74)}
  body.inMatch .river,body.inMatch .river.side{padding-bottom:1px}
  body.inMatch .oppName{font-size:11px;min-width:11em}
  body.inMatch .river,body.inMatch .river.side{padding-left:calc(11em + 8px)}
}

/* 河が埋まって鳴きが入ると、詰めても収まらない端末があり得る。
   隠すのではなくスクロールできるようにして、捨て牌が消えないようにする */
body.inMatch #table{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
body.inMatch #table::-webkit-scrollbar{width:4px}
body.inMatch #table::-webkit-scrollbar-thumb{
  background:rgba(201,162,74,.5);border-radius:2px;
}

/* ---------- 牌の絵 ----------
   tiles/ のSVGは図柄だけで、牌の面は入っていない（面は Front.svg が別にある）。
   面はこれまでどおりCSSで描き、その上に図柄を乗せる */
body.inMatch .tile{overflow:hidden;line-height:0}
body.inMatch .tile .face{
  width:100%;height:100%;display:block;object-fit:contain;
}
body.inMatch .tile.hidden-back{
  background:linear-gradient(160deg,#2c7059,#14372c);
  border-radius:12%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.5);
}

/* ---------- 打っている人の顔 ---------- */
/* 顔の大きさも河に連動させる。固定pxだと自動調整で縮められず、
   はみ出したときに逃げ場がなくなる */
.oppFace{
  width:clamp(11px,calc(var(--rw)*0.95),26px);
  height:clamp(11px,calc(var(--rw)*0.95),26px);
  border-radius:50%;overflow:hidden;flex:none;
