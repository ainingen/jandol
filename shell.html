<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雀ドル発掘放浪記</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%2313201c%22/%3E%3Crect%20x%3D%228%22%20y%3D%225%22%20width%3D%2216%22%20height%3D%2222%22%20rx%3D%223%22%20fill%3D%22%23f7f1e4%22/%3E%3Ctext%20x%3D%2216%22%20y%3D%2217%22%20text-anchor%3D%22middle%22%20font-size%3D%2212%22%20font-family%3D%22serif%22%20fill%3D%22%23c0392b%22%3E%E9%9B%80%3C/text%3E%3Ctext%20x%3D%2216%22%20y%3D%2225%22%20text-anchor%3D%22middle%22%20font-size%3D%228%22%20font-family%3D%22serif%22%20fill%3D%22%238c2f28%22%3E%E8%90%AC%3C/text%3E%3C/svg%3E">
<!--__STYLES__-->
<style>
/* ===== 外枠 =====
   **ページ全体ではなく、アプリの内側でスクロールさせる。**
   PLiCyのプレイヤーは枠のスクロールを止めていることがあり、
   ページスクロールに頼るとボタンに手が届かなくなる（実際に届かなかった）。
   body を100dvhで固定して、中の #scroll だけを流す。 */
html,body{height:100%}
body{
  display:flex;flex-direction:column;align-items:center;
  height:100dvh;overflow:hidden;padding-bottom:0;
}
#appTop{flex:none}
#scroll{
  flex:1;width:100%;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:64px;                 /* 下端に固定した #nav のぶん */
}
body.onTitle #scroll{padding-bottom:0}
body.inMatch #scroll{display:none}
#view{min-height:0}
/* 所持金は上部バーに常設するので、画面内の重複は隠す
   （単体ページで開いたときは表示されたままにしておく） */
#view .tkStat.money,#view .scStat.money{display:none}

#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;gap:2px;
  background:linear-gradient(rgba(12,21,18,.86),var(--urushi));
  border-top:1px solid var(--gold-dim);
  padding:5px 6px calc(5px + env(safe-area-inset-bottom));
  backdrop-filter:blur(6px);
}
#nav button{
  flex:1;max-width:150px;padding:8px 4px;border-radius:4px;cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--muted);
  font-family:var(--mincho);font-size:13px;letter-spacing:.08em;
}
#nav button[aria-current="page"]{
  color:var(--gold);border-color:var(--gold-dim);background:rgba(201,162,74,.09);
}
#nav button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#nav button[disabled]{opacity:.35;cursor:default}
/* タブが6つになったので、狭い幅では字を詰める。
   **一行に収めること。**折り返すと下の段が押しにくくなり、
   「スカウ／ト」のように割れて読めなくなる（実機で割れた） */
@media (max-width:420px){
  #nav{gap:0;padding-left:2px;padding-right:2px}
  #nav button{padding:8px 1px;font-size:11.5px;letter-spacing:0}
}
@media (max-width:340px){
  #nav button{font-size:10.5px}
}

.appTop{
  display:flex;align-items:center;gap:10px;
  max-width:760px;margin:0 auto;padding:8px 10px 0;
}
.appTitle{
  font-family:var(--mincho);font-size:13px;letter-spacing:.22em;margin:0;padding:2px 0;
  background:none;border:0;cursor:pointer;
  background-image:var(--kin);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.appTitle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* 表紙のときは上下の枠を消して、写真を画面いっぱいに見せる */
body.onTitle #appTop,body.onTitle #nav,body.onTitle .appReset{display:none}
body.onTitle{padding-bottom:0}

/* 対局中は卓だけにする */
body.inMatch #appTop,body.inMatch #nav,body.inMatch .appReset,body.inMatch #view{display:none}
body.inMatch{padding-bottom:0}
#matchRoot:empty{display:none}
#matchRoot{display:flex;justify-content:center;width:100%}
body.inMatch #matchRoot{flex:1;min-height:0}
.appMoney{margin-left:auto;font-size:11.5px;color:var(--muted)}
.appMoney b{font-family:var(--mincho);font-size:13px;color:var(--ivory);margin:0 2px}

.appReset{
  display:block;max-width:760px;margin:24px auto 0;padding:0 10px;
  text-align:right;
}
.appReset button{
  font-size:11px;padding:4px 9px;border-radius:3px;cursor:pointer;
  border:1px dashed var(--gold-dim);background:transparent;color:#5c6d66;
}
</style>
</head>
<body>

<div class="appTop" id="appTop">
  <button class="appTitle" id="appHome" type="button">雀ドル発掘放浪記</button>
  <span class="appMoney" id="appMoney"></span>
</div>

<!-- 実対局のときだけ使う。ui.js は document 直下のidを見るので、
     #view の外に置いて、対局中は他をすべて隠す -->
<div id="matchRoot"></div>

<!-- スクロールするのはここだけ。body は 100dvh で固定してある -->
<div id="scroll">
  <!-- 表紙の絵。PLiCyのサムネイルはこのcanvasの中身を撮る。
       複数のcanvasを置くと撮影が乱れるため、タグとしてのcanvasはこれ一枚だけにすること。
       **画面が低いときは title.css が縮めるが、DOMからは外さないし中身も描いたままにする。** -->
  <div id="coverWrap"><canvas id="cover" width="1200" height="900"></canvas></div>

  <div id="view"></div>

  <div class="appReset"><button id="appReset">最初からやり直す</button></div>
</div>

<nav id="nav" aria-label="画面の切り替え">
  <button data-go="office">事務所</button>
  <button data-go="team">チーム</button>
  <button data-go="taikai">大会</button>
  <button data-go="jansou">雀荘</button>
  <button data-go="meikan">名鑑</button>
</nav>

<!--__SCRIPTS__-->

<script>
/* ============================================================
   外枠 — セーブと画面の切り替え
   セーブはすべてidで持つ（引き継ぎ書 §5）。
   localStorage が使えない環境では毎回最初から。
   ============================================================ */
(function () {
  'use strict';
  var SAVE_KEY = 'jandol_save_v1';

  function blankState() {
    return {
      discovered: FREE_AGENTS.map(function (c) { return c.id; }),
      contracted: [],
      comp: Object.fromEntries(FREE_AGENTS.map(function (c) { return [c.id, c.comp]; })),
      compMax: {}, grades: {}, favor: {},
      team: [], teamDecided: false,
      money: 0, playerRank: 'D', playerWins: 0, records: {}, recent: [],
      agency: 1, beaten: [],
      autoMatch: false, matchSpeed: 520, showHints: true,
      /* 事務所ハブ（docs/design/office/spec.md §10）。
         **最上位に持つ。parlor の下ではない**（Jansou.normalize() が
         知らないキーを捨てるため。引き継ぎ書 §5）。
         trip / offers / offerFired / offerAccepted は第三段・第四段で足す
         （そのときもここに既定値を書くこと） */
      officeName: '',
      officePref: null,
      assign: {},                // { [charaId]: 'parlor'|'trip'|'rest'|'job:<id>' }
      trip: null,                // 遠征中なら { pref, purpose, target, members, deputy, dayLeft, log }
      offers: [],                // 届いている依頼（受ける前）
      /* メールを開いたときに見えていた依頼の id（office/room.md §9）。
         未読 ＝ offers のうちここに無いもの。**三箇所に書くこと**
         （blankState / loadState / onStart）——落とすと毎回ぜんぶ未読に戻る */
      mailRead: [],
      offerFired: [],            // once の依頼で既に発火した id
      offerAccepted: [],         // 受けた依頼の id（RULES.event が見る）
      popUp: {},                 // { [charaId]: 人気の底上げ }。アイドル活動で貯まる
      wins: {},                  // { [charaId]: { [tierId]: {entries,win,place} } } 大会戦績
      fatigue: {},               // { [charaId]: 0..100 }
      cond: {},                  // { [charaId]: -2..2 }
      /* 「その日ぶんはもう引いた」の印（§9）。**ここに書き忘れると
         リロードのたびに引き直され、朝を開くたび調子が変わる** */
      fatigueDay: -1,
      condDay: -1,
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return blankState();
      var s = JSON.parse(raw), b = blankState();
      /* 知らない項目もそのまま残す。拾い直した項目だけを返すと、
         あとから足した項目を消してしまう */
      return Object.assign({}, s, {
        discovered: Array.isArray(s.discovered) ? s.discovered : b.discovered,
        contracted: Array.isArray(s.contracted) ? s.contracted : [],
        comp: Object.assign({}, b.comp, s.comp || {}),
        compMax: s.compMax || {}, grades: s.grades || {}, favor: s.favor || {},
        team: Array.isArray(s.team) ? s.team : [],
        money: typeof s.money === 'number' ? s.money : 0,
        playerRank: s.playerRank || 'D',
        playerWins: typeof s.playerWins === 'number' ? s.playerWins : 0,
        records: s.records || {},
        recent: Array.isArray(s.recent) ? s.recent : [],
        agency: typeof s.agency === 'number' ? s.agency : 1,
        beaten: Array.isArray(s.beaten) ? s.beaten : [],
        playerFace: Title.normalizeFace(s.playerFace),
        autoMatch: !!s.autoMatch,
        matchSpeed: typeof s.matchSpeed === 'number' ? s.matchSpeed : 520,
        showHints: s.showHints !== false,
        /* 事務所。**既存セーブには無い。**officePref が null のままなら、
           事務所を初めて開いたときに一度だけ選ばせる（office/spec.md §5）。
           既定を勝手に決めない——本拠地は一度きりの選択なので */
        officeName: typeof s.officeName === 'string' ? s.officeName : '',
        officePref: typeof s.officePref === 'string' ? s.officePref : null,
        /* 配置と、疲労・調子の器（§6.3・§9）。**中身の解釈は office.js が持つ。**
           ここは「オブジェクトであること」だけを保証して、既定値
           （配置は parlor、疲労0、調子0）は Office.assignFor / fatigueOf /
           condOf が返す。二か所に既定を書かない */
        assign: s.assign && typeof s.assign === 'object' ? s.assign : {},
        /* **遠征はリロードされたら続きから**（§7.5）。壊れていたら
           Office.tripOf が null に落とし、assign の trip も店に戻る */
        trip: s.trip && typeof s.trip === 'object' ? s.trip : null,
        offers: Array.isArray(s.offers) ? s.offers : [],
        mailRead: Array.isArray(s.mailRead) ? s.mailRead : [],
        offerFired: Array.isArray(s.offerFired) ? s.offerFired : [],
        offerAccepted: Array.isArray(s.offerAccepted) ? s.offerAccepted : [],
        popUp: s.popUp && typeof s.popUp === 'object' ? s.popUp : {},
        wins: s.wins && typeof s.wins === 'object' ? s.wins : {},
        fatigue: s.fatigue && typeof s.fatigue === 'object' ? s.fatigue : {},
        cond: s.cond && typeof s.cond === 'object' ? s.cond : {},
        /* **印を落とさないこと。**落とすとリロードのたびに引き直される */
        fatigueDay: typeof s.fatigueDay === 'number' ? s.fatigueDay : -1,
        condDay: typeof s.condDay === 'number' ? s.condDay : -1,
      });
    } catch (e) { return blankState(); }
  }

  var canSave = true;
  function saveState(st) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); }
    catch (e) { canSave = false; }
  }

  var state = loadState();

  var store = {
    get: function () { return state; },
    set: function (patch) { Object.assign(state, patch); saveState(state); paintTop(); },

    /* 事務所がハブ。各画面はここから行き、ここへ戻る（office/spec.md §0）。
       office.js は store.go が無ければ入口の釦を出さないので、
       単体ページ（office.html）でも壊れない */
    go: function (name, opts) { go(name, opts); },

    /* 昼。事務所の「今日を始める」から呼ばれる。
       **雀荘の画面を開いてそのまま営業を回す。**フロアの再生は雀荘の
       DOM のままなので、演出には一行も手を入れていない。
       終わったら事務所の夜へ返す。`parlor.day` は Jansou の settle が
       もう進めている（office/spec.md §6.1） */
    startDay: function () {
      go('jansou', { autoRun: true, onDayEnd: function () { go('office', { phase: 'night' }); } });
    },

    /* 大会は「事務所に届く依頼」から入る（office/spec.md §8.2）。
       大会の画面へ降りて、終わったら事務所へ結果を持ち帰る。
       **大会選択の画面は通らない。**入口を一本にするため */
    goTaikai: function (tierId, offerId) {
      go('taikai', { tierId: tierId, onDone: function (res) {
        /* **結果は opts で渡す。**画面を替えると Office は組み直されるので、
           前の mount の閉包に控えた関数は宙に浮く（呼んでも何も出ない） */
        go('office', { phase: 'night', taikai: { tierId: tierId, offerId: offerId, res: res } });
      } });
    },

    /* チーム編成が終わったら事務所へ送る */
    onDecided: function () { go('office'); },

    /* 表紙から */
    onContinue: function () { go(state.teamDecided ? 'office' : 'team'); },
    onStart: function () {
      /* 「最初からはじめる」は進行だけ消す。**いま決めたものは残す**
         ——名前・顔と、事務所名・本拠地（title.js が onStart の直前に
         store.set で書いている。ここで拾わないと、その場で消える） */
      var keep = {
        playerName: state.playerName, playerFace: state.playerFace,
        officeName: state.officeName, officePref: state.officePref,
      };
      /* mailRead は進行なので持ち越さない。**blankState が空で入れる**
         ——ここで書き忘れても消えるだけだが、三箇所を揃えておく */
      keep.mailRead = [];
      state = Object.assign(blankState(), keep);
      saveState(state);
      go('team');
    },
    onSigned: function () { paintTop(); },

    /* 自分が座る卓だけ実際に打つ。他の卓は taikai.js が確率処理する。
       設定で切れるようにしてあり、切ると全部の卓が自動処理になる。 */
    playRealMatch: function (table, ctx) {
      if (state.autoMatch) return null;      // 「自分の卓も自動で処理する」設定
      document.body.classList.add('inMatch');
      return Match.play(document.getElementById('matchRoot'), table, {
        title: ctx.tier.name + '　' + ctx.name,
        speed: state.matchSpeed || 520,
        showHints: state.showHints !== false,
      }).then(function (rank) {
        document.body.classList.remove('inMatch');
        return rank;
      }, function (e) {
        document.body.classList.remove('inMatch');
        throw e;
      });
    },
  };

  var view = document.getElementById('view');
  var nav = document.getElementById('nav');
  var current = null;

  function paintTop() {
    var el = document.getElementById('appMoney');
    var txt = '所持金 <b>' + (state.money || 0).toLocaleString('ja-JP') + '</b>円';
    if (!canSave) txt += '　（この環境では保存できません）';
    el.innerHTML = txt;
    if (current === 'title') return;
    /* チームを決めるまで他の画面は開けない */
    Array.prototype.forEach.call(nav.querySelectorAll('[data-go]'), function (b) {
      var locked = !state.teamDecided && b.dataset.go !== 'team';
      b.disabled = locked;
      b.setAttribute('aria-current', b.dataset.go === current ? 'page' : 'false');
    });
  }

  /* opts は画面ごとの引数。いまは雀荘（autoRun / onDayEnd）と
     事務所（phase）だけが読む。持たない画面には渡っても無害 */
  function go(name, opts) {
    /* ポップアップ類は body に足しているので、画面を替えるときに自分で消す。
       残したままだと次の画面の上に覆いが被さったままになる */
    Array.prototype.forEach.call(
      document.querySelectorAll('.popup,.mkOverlay,.scReveal'),
      function (el) { el.remove(); }
    );
    current = name;
    view.innerHTML = '';
    var root = document.createElement('div');
    view.appendChild(root);
    document.body.classList.toggle('onTitle', name === 'title');
    if (name === 'title') Title.mount(root, store);
    else if (name === 'office') Office.mount(root, store, opts);
    else if (name === 'meikan') Meikan.mount(root, store);
    else if (name === 'team') Team.mount(root, store);
    else if (name === 'taikai') Taikai.mount(root, store, opts);
    else if (name === 'jansou') Jansou.mount(root, store, opts);
    /* **スカウトは下のタブから外した**（探すのは遠征に置き換わったので、
       出る入口は事務所ひとつでいい）。画面そのものは残す——
       **見つけた子と契約できるのはここだけ**なので、事務所の入口から入る */
    else if (name === 'scout') Scout.mount(root, store);
    paintTop();
    /* スクロールするのは #scroll なので、window.scrollTo では戻らない */
    document.getElementById('scroll').scrollTop = 0;
  }

  nav.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b && !b.disabled) go(b.dataset.go);
  });

  document.getElementById('appReset').addEventListener('click', function () {
    if (!window.confirm('セーブを消して最初からやり直します。よろしいですか。')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    state = blankState();
    go('team');
  });

  document.getElementById('appHome').addEventListener('click', function () { go('title'); });

  /* 表紙の絵は起動時に一度だけ描く。以降どの画面にいても撮影できる */
  Title.paintCover(document.getElementById('cover'), state);

  go('title');
})();
</script>
</body>
</html>
